<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powers Game</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #0a0f2c, #000);
    overflow: hidden;
    color: white;
}

/* FUNDO ANIMADO */
.energy {
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(0,150,255,0.2), transparent);
    animation: move 10s linear infinite;
}

@keyframes move {
    0% {transform: translate(0,0);}
    50% {transform: translate(-25%,-25%);}
    100% {transform: translate(0,0);}
}

/* MENU */
.menu {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
}

h1 {
    font-size: 40px;
    margin-bottom: 20px;
    text-shadow: 0 0 20px cyan;
}

button {
    display: block;
    margin: 10px auto;
    padding: 15px 40px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #00aaff, #0044ff);
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px cyan;
}

/* PARTÍCULAS */
.particle {
    position: absolute;
    width: 5px;
    height: 5px;
    background: cyan;
    border-radius: 50%;
    opacity: 0.7;
    animation: float 5s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(100vh);
    }
    to {
        transform: translateY(-10vh);
    }
}
</style>
</head>

<body>

<div class="energy"></div>

<div class="menu">
    <h1>⚡ POWER GAME</h1>
    <button onclick="play()">Jogar</button>
    <button onclick="powers()">Poderes</button>
</div>

<script>
function play(){
    alert("Entrando no jogo...");
}

function powers(){
    alert("Poderes: Energia, Tempestade, Tank Mode");
}

/* GERAR PARTÍCULAS */
for(let i=0;i<100;i++){
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random()*100+"%";
    p.style.animationDuration = (3+Math.random()*5)+"s";
    document.body.appendChild(p);
}
</script>

</body>
</html>
