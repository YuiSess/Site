<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PixVerse AI Video Generator</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#0f0f0f;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        width:500px;
        background:#1a1a1a;
        border:1px solid #333;
        padding:25px;
        border-radius:20px;
        box-shadow:0 0 30px rgba(0,0,0,0.5);
    }

    h1{
        text-align:center;
        margin-bottom:20px;
    }

    textarea{
        width:100%;
        height:120px;
        resize:none;
        border:none;
        outline:none;
        padding:15px;
        border-radius:10px;
        background:#111;
        color:white;
        font-size:16px;
    }

    button{
        width:100%;
        margin-top:15px;
        padding:15px;
        border:none;
        border-radius:10px;
        background:#5865f2;
        color:white;
        font-size:17px;
        cursor:pointer;
        transition:0.2s;
    }

    button:hover{
        transform:scale(1.02);
        background:#4752c4;
    }

    .status{
        margin-top:20px;
        text-align:center;
        color:#aaa;
    }

    video{
        width:100%;
        margin-top:20px;
        border-radius:15px;
        display:none;
    }
</style>
</head>
<body>

<div class="container">
    <h1>PixVerse AI Video</h1>

    <textarea id="prompt" placeholder="Escreva o vídeo que a IA vai criar..."></textarea>

    <button onclick="gerarVideo()">Gerar Vídeo</button>

    <div class="status" id="status"></div>

    <video id="video" controls></video>
</div>

<script>

const API_KEY = "sk-222105aa951ada1ff202c696e42c5dd0";

async function gerarVideo(){

    const prompt = document.getElementById("prompt").value;
    const status = document.getElementById("status");
    const video = document.getElementById("video");

    if(!prompt){
        alert("Escreve alguma coisa né.");
        return;
    }

    status.innerText = "Gerando vídeo...";

    try{

        const response = await fetch("https://app-api.pixverse.ai/openapi/v1/video/text/generate",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "API-KEY":API_KEY
            },
            body:JSON.stringify({
                prompt:prompt,
                aspect_ratio:"16:9",
                duration:5
            })
        });

        const data = await response.json();

        console.log(data);

        const videoId = data.data.video_id;

        verificarVideo(videoId);

    }catch(err){
        console.error(err);
        status.innerText = "Erro ao gerar vídeo.";
    }
}

async function verificarVideo(videoId){

    const status = document.getElementById("status");
    const video = document.getElementById("video");

    const interval = setInterval(async ()=>{

        const response = await fetch(
            `https://app-api.pixverse.ai/openapi/v1/video/result/${videoId}`,
            {
                headers:{
                    "API-KEY":API_KEY
                }
            }
        );

        const data = await response.json();

        console.log(data);

        if(data.data.status === "success"){

            clearInterval(interval);

            status.innerText = "Vídeo pronto.";

            video.src = data.data.url;
            video.style.display = "block";

        }else if(data.data.status === "failed"){

            clearInterval(interval);

            status.innerText = "Falhou.";

        }else{

            status.innerText = "Processando vídeo...";
        }

    },5000);
}

</script>

</body>
</html>
