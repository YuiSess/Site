<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A RUA — Horror v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#fff}
#canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}
#rain-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0.25;z-index:2}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:all;background:#000}
.screen.hidden{display:none!important}
#menu-screen .tagline{font-size:11px;letter-spacing:8px;color:rgba(255,255,255,0.3);text-transform:uppercase}
#menu-screen h1{font-size:clamp(44px,9vw,88px);letter-spacing:18px;text-transform:uppercase;text-shadow:0 0 60px rgba(200,0,0,0.4);animation:flicker 5s infinite}
#menu-screen .sub{font-size:12px;letter-spacing:5px;color:rgba(255,255,255,0.25);font-style:italic;margin-bottom:10px}
.menu-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{background:transparent;border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.8);padding:13px 30px;font-family:'Courier New',monospace;font-size:12px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all 0.25s}
.btn:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.55);color:#fff}
.btn.primary{border-color:rgba(200,50,50,0.5);color:rgba(255,150,150,0.9)}
.btn.primary:hover{background:rgba(180,0,0,0.12);border-color:rgba(255,80,80,0.8)}
#konami-hint{position:absolute;bottom:18px;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.1)}
#lobby-screen h2{font-size:16px;letter-spacing:10px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:8px}
.lobby-input{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.25);color:#fff;font-family:'Courier New',monospace;font-size:16px;letter-spacing:4px;padding:8px 4px;text-align:center;width:220px;outline:none}
.lobby-input::placeholder{color:rgba(255,255,255,0.18)}
.lobby-sep{width:60px;height:1px;background:rgba(255,255,255,0.1);margin:6px 0}
.mode-tabs{display:flex;gap:12px}
.tab{background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.4);padding:9px 22px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.tab.active{border-color:rgba(255,255,255,0.6);color:#fff;background:rgba(255,255,255,0.05)}
#players-list{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.35);min-height:50px;text-align:center;line-height:2}
.quick-room-btn{font-size:10px;letter-spacing:3px;color:rgba(255,200,100,0.5);background:none;border:none;font-family:'Courier New';cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.quick-room-btn:hover{color:rgba(255,220,150,0.9)}
#hud{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:none;gap:28px;align-items:center;background:rgba(0,0,0,0.4);padding:10px 22px;border:1px solid rgba(255,255,255,0.06)}
.hud-item{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.5)}
.bar-wrap{width:70px;height:5px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15)}
.bar-fill{height:100%;transition:width 0.4s}
#bat-fill{background:#a8ff78}
#stam-fill{background:#78b4ff}
#san-fill{background:#ff78b0}
#bat-pct{font-size:9px;min-width:28px}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.35)}
#crosshair::before{width:10px;height:1px;top:0;left:-5px}
#crosshair::after{width:1px;height:10px;top:-5px;left:0}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,0.72) 100%);pointer-events:none}
#noise-overlay{position:absolute;inset:0;opacity:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;mix-blend-mode:multiply}
#red-pulse{position:absolute;inset:0;opacity:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(200,0,0,0.5)}
#monster-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;opacity:0;pointer-events:none;box-shadow:0 0 60px 30px rgba(180,0,0,0.12)}
#msg-box{position:absolute;top:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.msg{font-size:10px;letter-spacing:3px;color:rgba(255,180,180,0.8);text-transform:uppercase;animation:fadeMsg 4s forwards;white-space:nowrap}
#nametags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.nametag{position:absolute;font-size:9px;letter-spacing:3px;color:rgba(150,200,255,0.7);text-transform:uppercase;transform:translateX(-50%);white-space:nowrap;text-shadow:0 0 8px rgba(0,0,0,1)}
#chat-wrap{position:absolute;bottom:80px;left:20px;width:280px;pointer-events:all}
#chat-log{height:110px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:6px;scrollbar-width:none}
#chat-log::-webkit-scrollbar{display:none}
.chat-msg{font-size:10px;letter-spacing:1px;line-height:1.5;color:rgba(255,255,255,0.55)}
.chat-msg .name{color:rgba(150,200,255,0.8);margin-right:4px}
.chat-msg.system{color:rgba(255,200,100,0.5);font-style:italic}
#chat-input-wrap{display:flex;gap:6px}
#chat-input{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.8);font-family:'Courier New',monospace;font-size:10px;letter-spacing:1px;padding:6px 8px;flex:1;outline:none}
#chat-input::placeholder{color:rgba(255,255,255,0.2)}
#chat-send{background:transparent;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.4);font-family:'Courier New';font-size:10px;letter-spacing:2px;padding:6px 10px;cursor:pointer}
#chat-send:hover{border-color:rgba(255,255,255,0.4);color:#fff}
#keys-hint{position:absolute;top:20px;left:20px;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.18);line-height:2.2;pointer-events:none}
#found-items{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:3px;color:rgba(255,200,100,0.55);pointer-events:none}
#online-list{position:absolute;top:18px;right:18px;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.25);line-height:2;text-align:right;pointer-events:none}
#car-prompt{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:3px;color:rgba(255,255,200,0.7);pointer-events:none;display:none;background:rgba(0,0,0,0.5);padding:6px 14px;border:1px solid rgba(255,255,150,0.2)}
#lore-popup{position:absolute;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;pointer-events:all;padding:40px}
#lore-popup .lore-label{font-size:9px;letter-spacing:6px;color:rgba(255,50,50,0.6);text-transform:uppercase}
#lore-popup p{font-size:14px;letter-spacing:2px;color:rgba(255,255,255,0.65);line-height:2.2;text-align:center;max-width:560px;font-style:italic}
#lore-popup button{background:transparent;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.35);font-family:'Courier New',monospace;font-size:11px;letter-spacing:4px;cursor:pointer;padding:10px 24px;pointer-events:all}
#lore-popup button:hover{border-color:rgba(255,255,255,0.4);color:rgba(255,255,255,0.7)}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:0.3}95%{opacity:1}97%{opacity:0.1}98%{opacity:1}}
@keyframes fadeMsg{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<canvas id="rain-canvas"></canvas>
<div id="ui">
  <div id="vignette"></div>
  <div id="noise-overlay"></div>
  <div id="red-pulse"></div>
  <div id="monster-ring"></div>
  <div id="menu-screen" class="screen">
    <p class="tagline">horror experience</p>
    <h1>A RUA</h1>
    <p class="sub">quando você começa a ver as mesmas coisas...</p>
    <div class="menu-btns">
      <button class="btn primary" onclick="UI.showLobby()">▶ JOGAR</button>
      <button class="btn" onclick="UI.showControls()">CONTROLES</button>
    </div>
    <p id="konami-hint">↑↑↓↓←→←→BA para um segredo</p>
  </div>
  <div id="lobby-screen" class="screen hidden">
    <h2>como jogar?</h2>
    <div class="mode-tabs">
      <button class="tab active" id="tab-solo" onclick="UI.setMode('solo')">SOLO</button>
      <button class="tab" id="tab-multi" onclick="UI.setMode('multi')">MULTIPLAYER</button>
    </div>
    <input class="lobby-input" id="name-input" placeholder="SEU NOME" maxlength="12">
    <div id="multi-options" style="display:none;flex-direction:column;align-items:center;gap:12px">
      <div class="lobby-sep"></div>
      <input class="lobby-input" id="room-input" placeholder="CÓDIGO DA SALA" maxlength="6" style="text-transform:uppercase">
      <button class="quick-room-btn" onclick="UI.quickRoom()">⚡ sala rápida (gerar código)</button>
      <div id="players-list"></div>
    </div>
    <div style="display:flex;gap:14px;margin-top:6px">
      <button class="btn primary" id="start-btn" onclick="UI.startFromLobby()">ENTRAR</button>
      <button class="btn" onclick="UI.showMenu()">← VOLTAR</button>
    </div>
  </div>
  <div id="hud">
    <div class="hud-item">🔦 <div class="bar-wrap"><div class="bar-fill" id="bat-fill" style="width:100%"></div></div><span id="bat-pct">100%</span></div>
    <div class="hud-item">⚡ <div class="bar-wrap"><div class="bar-fill" id="stam-fill" style="width:100%"></div></div></div>
    <div class="hud-item">🧠 <div class="bar-wrap"><div class="bar-fill" id="san-fill" style="width:100%"></div></div></div>
    <div class="hud-item" id="car-hud" style="display:none">🚗 <span id="car-speed-txt" style="color:rgba(255,220,100,0.8);font-size:9px">0 km/h</span></div>
  </div>
  <div id="crosshair"></div>
  <div id="msg-box"></div>
  <div id="found-items"></div>
  <div id="online-list"></div>
  <div id="car-prompt"></div>
  <div id="keys-hint">
    WASD — mover<br>
    SHIFT — correr<br>
    F — lanterna<br>
    E — entrar/sair do carro<br>
    T — chat<br>
    ESC — soltar mouse
  </div>
  <div id="nametags"></div>
  <div id="chat-wrap" style="display:none">
    <div id="chat-log"></div>
    <div id="chat-input-wrap">
      <input id="chat-input" placeholder="mensagem... (enter)" maxlength="80">
      <button id="chat-send" onclick="Chat.send()">OK</button>
    </div>
  </div>
  <div id="lore-popup">
    <div class="lore-label" id="lore-label-txt">FITA VHS — ENCONTRADA</div>
    <p id="lore-text"></p>
    <button onclick="UI.closeLore()">[ continuar ]</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

class Car{
  constructor(x,z,ry=0){
    this.grp=new THREE.Group();
    this.vel=new THREE.Vector3();
    this.heading=ry;
    this.speed=0;
    this.steering=0;
    this.occupied=false;
    this.build();
    this.grp.position.set(x,0,z);
    this.grp.rotation.y=ry;
    scene.add(this.grp);
    // Items inside car
    this.items=[];
    this.buildInterior();
  }
  build(){
    const rnd=Math.floor(Math.random()*5);
    const colors=[0x1a1a2e,0x16213e,0x0f3460,0x1b1b2f,0x2d132c];
    const cMat=new THREE.MeshLambertMaterial({color:colors[rnd]});
    const dkMat=new THREE.MeshLambertMaterial({color:0x0a0a0a});
    const glassMat=new THREE.MeshLambertMaterial({color:0x112233,transparent:true,opacity:0.4});
    // Body
    const body=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.8,4.4),cMat);body.position.y=0.55;body.castShadow=true;body.receiveShadow=true;this.grp.add(body);
    // Roof / cabin
    const roof=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.65,2.4),cMat);roof.position.set(0,1.22,0.1);this.grp.add(roof);
    // Windows
    const wf=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.45,0.05),glassMat);wf.position.set(0,1.1,1.32);this.grp.add(wf);
    const wb=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.45,0.05),glassMat);wb.position.set(0,1.1,-1.12);this.grp.add(wb);
    // Wheels
    const wMat=new THREE.MeshLambertMaterial({color:0x111111});
    [[0.92,0,1.4],[-(0.92),0,1.4],[0.92,0,-1.4],[-(0.92),0,-1.4]].forEach(([wx,wy,wz])=>{
      const w=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.22,10),wMat);
      w.rotation.z=Math.PI/2;w.position.set(wx,0.3,wz);this.grp.add(w);
    });
    // Headlights
    const hlMat=new THREE.MeshBasicMaterial({color:0xffffee});
    const tl=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.14,0.04),hlMat);tl.position.set(0.55,0.65,2.22);this.grp.add(tl);
    const tr=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.14,0.04),hlMat);tr.position.set(-0.55,0.65,2.22);this.grp.add(tr);
    // Headlight glow
    const hl=new THREE.PointLight(0xffffdd,0,18,2);hl.position.set(0,0.65,2.8);this.grp.add(hl);
    this.headlightL=hl;
    // Taillights
    const tlMat=new THREE.MeshBasicMaterial({color:0x880000});
    const tll=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,0.04),tlMat);tll.position.set(0.55,0.65,-2.22);this.grp.add(tll);
    const tlr=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,0.04),tlMat);tlr.position.set(-0.55,0.65,-2.22);this.grp.add(tlr);
  }
  buildInterior(){
    // Random items inside car: tapes or items
    const tM=new THREE.MeshBasicMaterial({color:0x991100});
    const pM=new THREE.MeshLambertMaterial({color:0x332211});
    // Tape on seat
    if(Math.random()>0.4){
      const tape=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.06,0.08),tM);
      tape.position.set(0.35,1.0,0.3);
      tape.userData={type:'tape_car',collected:false,lore:'"Encontrei isso no banco de trás... era de alguém que passou por aqui. A rua consome tudo."'};
      this.grp.add(tape);
      this.items.push(tape);
    }
    // Paper on dashboard
    if(Math.random()>0.5){
      const paper=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.01,0.12),new THREE.MeshLambertMaterial({color:0xddccaa}));
      paper.position.set(-0.3,0.98,-0.3);
      paper.userData={type:'note',collected:false,lore:'"Nota: NÃO SAIA DO CARRO. Ele não te vê se você estiver dentro."'};
      this.grp.add(paper);
      this.items.push(paper);
    }
  }
  update(dt){
    if(!this.occupied) return;
    // Input
    const acc=keys['KeyW']?1:(keys['KeyS']?-0.6:0);
    const str=keys['KeyA']?1:(keys['KeyD']?-1:0);
    const maxSpd=keys['ShiftLeft']||keys['ShiftRight']?22:12;
    this.speed+=acc*12*dt;
    this.speed*=0.92;
    this.speed=Math.max(-5,Math.min(maxSpd,this.speed));
    if(Math.abs(this.speed)>0.2) this.heading+=str*(this.speed/maxSpd)*1.8*dt;
    this.grp.rotation.y=this.heading;
    this.grp.position.x+=Math.sin(this.heading)*this.speed*dt;
    this.grp.position.z+=Math.cos(this.heading)*this.speed*dt;
    // Clamp
    this.grp.position.x=Math.max(-340,Math.min(340,this.grp.position.x));
    this.grp.position.z=Math.max(-340,Math.min(340,this.grp.position.z));
    // Headlights on when occupied
    this.headlightL.intensity=1.5;
    // Speed HUD
    const kmh=Math.round(Math.abs(this.speed)*3.6);
    document.getElementById('car-speed-txt').textContent=kmh+' km/h';
    // Position camera inside car
    camera.position.set(this.grp.position.x,this.grp.position.y+1.4,this.grp.position.z);
    camera.position.x+=Math.sin(this.heading)*0.15;
    camera.position.z+=Math.cos(this.heading)*0.15;
  }
}

  placeTapes();

  // Forest ring — outer boundary
  const trM=new THREE.MeshLambertMaterial({color:0x080a06}),leM=new THREE.MeshLambertMaterial({color:0x060808});
  for(let i=0;i<400;i++){

    const b=new THREE.Mesh(new THREE.BoxGeometry(22,22,22),m);b.position.set(x,11,z);b.castShadow=true;scene.add(b);
    const w=new THREE.Mesh(new THREE.BoxGeometry(8,12,30),m);w.position.set(x+15,6,z);scene.add(w);
    const cM=new THREE.MeshBasicMaterial({color:0x550000});
    const cv=new THREE.Mesh(new THREE.BoxGeometry(0.5,4,0.1),cM);cv.position.set(x,14,z+11.05);scene.add(cv);
    const ch=new THREE.Mesh(new THREE.BoxGeometry(2.5,0.5,0.1),cM);ch.position.set(x,14,z+11.05);scene.add(ch);
    const hl=new THREE.PointLight(0x220000,0.7,30);hl.position.set(x,11,z);scene.add(hl);
  }else if(type==='metro'){
    const e=new THREE.Mesh(new THREE.BoxGeometry(9,4,9),m);e.position.set(x,2,z);scene.add(e);
    for(let i=0;i<6;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(5,0.3,1.2),m);s.position.set(x,-0.1-i*0.3,z+2.5+i);scene.add(s);}
    const ml=new THREE.PointLight(0x003322,0.5,18);ml.position.set(x,2.5,z);scene.add(ml);
  }else if(type==='bridge'){
    const br=new THREE.Mesh(new THREE.BoxGeometry(8,0.5,80),m);br.position.set(x,0.25,z+40);scene.add(br);
    for(let i=0;i<16;i++){
      [3.8,-(3.8)].forEach(rx=>{
        const r=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.4,0.1),m);r.position.set(x+rx,1.0,z+i*5);scene.add(r);
        const rail=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,80),m);rail.position.set(x+rx,1.7,z+40);scene.add(rail);
      });
    }
  }else if(type==='warehouse'){
    const w=new THREE.Mesh(new THREE.BoxGeometry(28,12,40),m);w.position.set(x,6,z);w.castShadow=true;scene.add(w);
    const wl=new THREE.PointLight(0x110000,0.4,25);wl.position.set(x,8,z);scene.add(wl);

  }
}

class Monster{
  constructor(){
    this.grp=new THREE.Group();this.build();this.grp.position.set(55,0,55);scene.add(this.grp);
    this.speed=0.032;this.state='patrol';this.stTimer=0;this.alertLv=0;
    this.patrol=[new THREE.Vector3(55,0,55),new THREE.Vector3(-55,0,55),new THREE.Vector3(-55,0,-55),new THREE.Vector3(55,0,-55),new THREE.Vector3(0,0,90),new THREE.Vector3(90,0,0),new THREE.Vector3(-90,0,-90)];
    this.pIdx=0;
  }
  build(){
    const m=new THREE.MeshLambertMaterial({color:0x0b0b0b}),m2=new THREE.MeshLambertMaterial({color:0x111114});
    const torso=new THREE.Mesh(new THREE.BoxGeometry(0.75,2.6,0.38),m);torso.position.y=3.6;this.grp.add(torso);
    const head=new THREE.Mesh(new THREE.BoxGeometry(0.65,0.75,0.55),m2);head.position.set(0,5.25,0.04);head.rotation.z=0.08;this.grp.add(head);this.headMesh=head;
    this.armL=new THREE.Mesh(new THREE.BoxGeometry(0.14,2.3,0.14),m);this.armL.position.set(-0.58,3.1,0);this.armL.rotation.z=0.32;this.grp.add(this.armL);
    this.armR=new THREE.Mesh(new THREE.BoxGeometry(0.14,2.3,0.14),m);this.armR.position.set(0.58,3.1,0);this.armR.rotation.z=-0.32;this.grp.add(this.armR);
    this.legL=new THREE.Mesh(new THREE.BoxGeometry(0.24,1.9,0.24),m);this.legL.position.set(-0.22,1.15,0);this.grp.add(this.legL);
    this.legR=new THREE.Mesh(new THREE.BoxGeometry(0.24,1.9,0.24),m);this.legR.position.set(0.22,1.15,0);this.grp.add(this.legR);
    const eM=new THREE.MeshBasicMaterial({color:0x880000});
    const e1=new THREE.Mesh(new THREE.SphereGeometry(0.055,4,4),eM);e1.position.set(-0.14,5.28,0.29);this.grp.add(e1);
    const e2=new THREE.Mesh(new THREE.SphereGeometry(0.055,4,4),eM);e2.position.set(0.14,5.28,0.29);this.grp.add(e2);
  }
  update(dt,playerPos){
    // Monster ignores player inside car
    if(G.inCar){G.monsterDist=999;G.nearMonster=false;return;}
    this.stTimer+=dt;
    const dist=this.grp.position.distanceTo(playerPos);
    G.monsterDist=dist;
    if(dist<10&&flashlightOn){this.state='chase';this.alertLv=Math.min(1,this.alertLv+dt*0.6);}
    else if(dist<26){this.alertLv=Math.min(1,this.alertLv+dt*0.08);if(this.alertLv>0.65)this.state='stalk';}
    else{this.alertLv=Math.max(0,this.alertLv-dt*0.04);if(this.stTimer>12){this.state='patrol';this.stTimer=0;}}
    let target;
    if(this.state==='chase'){this.speed=0.07;target=playerPos;}
    else if(this.state==='stalk'){this.speed=0.025;target=dist>32?playerPos:null;}
    else{this.speed=0.026;target=this.patrol[this.pIdx];if(this.grp.position.distanceTo(target)<3)this.pIdx=(this.pIdx+1)%this.patrol.length;}
    if(target){
      const dir=new THREE.Vector3().subVectors(target,this.grp.position);dir.y=0;
      if(dir.lengthSq()>0.001){dir.normalize();this.grp.position.addScaledVector(dir,this.speed);this.grp.rotation.y=Math.atan2(dir.x,dir.z);}
    }
    const t=performance.now()*0.001;
    const ws=this.state==='chase'?9:3;
    this.legL.rotation.x=Math.sin(t*ws)*0.42;this.legR.rotation.x=-Math.sin(t*ws)*0.42;
    this.armL.rotation.x=Math.sin(t*ws)*0.28;this.armR.rotation.x=-Math.sin(t*ws)*0.28;
    this.headMesh.rotation.y=Math.sin(t*0.65)*0.18;
    this.grp.position.y=Math.abs(Math.sin(t*ws))*0.08;
    G.nearMonster=dist<20;
  }
}

// ════ REMOTE PLAYERS ════
const PLAYER_COLORS=[0x334488,0x884433,0x338855,0x664488,0x886633];
const remotePlayers={};
function getOrCreateRemote(key,name){
  if(remotePlayers[key])return remotePlayers[key];
  const color=PLAYER_COLORS[Object.keys(remotePlayers).length%PLAYER_COLORS.length];
  const grp=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color});
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.58,1.35,0.28),mat);body.position.y=1.08;grp.add(body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.48,0.48,0.48),mat);head.position.y=2.02;grp.add(head);
  const aL=new THREE.Mesh(new THREE.BoxGeometry(0.14,1.05,0.14),mat);aL.position.set(-0.38,0.95,0);grp.add(aL);
  const aR=new THREE.Mesh(new THREE.BoxGeometry(0.14,1.05,0.14),mat);aR.position.set(0.38,0.95,0);grp.add(aR);
  const lL=new THREE.Mesh(new THREE.BoxGeometry(0.22,1.05,0.22),mat);lL.position.set(-0.18,0.35,0);grp.add(lL);
  const lR=new THREE.Mesh(new THREE.BoxGeometry(0.22,1.05,0.22),mat);lR.position.set(0.18,0.35,0);grp.add(lR);
  scene.add(grp);
  const tag=document.createElement('div');tag.className='nametag';tag.textContent=name;
  document.getElementById('nametags').appendChild(tag);
  remotePlayers[key]={grp,tag,name,color,aL,aR,lL,lR,animT:0,lastPos:new THREE.Vector3()};
  return remotePlayers[key];
}
function removeRemote(key){if(!remotePlayers[key])return;scene.remove(remotePlayers[key].grp);remotePlayers[key].tag.remove();delete remotePlayers[key];}
function updateNametagsDOM(){Object.values(remotePlayers).forEach(p=>{const pos=p.grp.position.clone();pos.y+=2.6;const v=pos.clone().project(camera);if(v.z>1){p.tag.style.display='none';return;}const sx=(v.x*0.5+0.5)*window.innerWidth;const sy=(-0.5*v.y+0.5)*window.innerHeight-10;p.tag.style.display='block';p.tag.style.left=sx+'px';p.tag.style.top=sy+'px';});}
function animateRemotePlayers(dt){Object.values(remotePlayers).forEach(p=>{const moved=p.grp.position.distanceTo(p.lastPos);p.lastPos.copy(p.grp.position);p.animT+=dt*(moved>0.01?8:2);p.lL.rotation.x=Math.sin(p.animT)*(moved>0.01?0.38:0.05);p.lR.rotation.x=-Math.sin(p.animT)*(moved>0.01?0.38:0.05);p.aL.rotation.x=Math.sin(p.animT)*(moved>0.01?0.25:0.03);p.aR.rotation.x=-Math.sin(p.animT)*(moved>0.01?0.25:0.03);p.grp.position.y=moved>0.01?Math.abs(Math.sin(p.animT))*0.05:0;});}

// ════ RAIN ════
const rc=document.getElementById('rain-canvas'),rCtx=rc.getContext('2d');
rc.width=window.innerWidth;rc.height=window.innerHeight;
const drops=Array.from({length:280},()=>({x:Math.random()*rc.width,y:Math.random()*rc.height,s:7+Math.random()*9,l:12+Math.random()*18}));
function drawRain(){rCtx.clearRect(0,0,rc.width,rc.height);rCtx.strokeStyle='rgba(180,210,255,0.22)';rCtx.lineWidth=0.6;drops.forEach(d=>{rCtx.beginPath();rCtx.moveTo(d.x,d.y);rCtx.lineTo(d.x-0.8,d.y+d.l);rCtx.stroke();d.y+=d.s;d.x-=0.4;if(d.y>rc.height){d.y=-15;d.x=Math.random()*rc.width;}});}

// ════ CHAT ════
const Chat={
  focused:false,
  addMsg(name,text,isSystem=false){const log=document.getElementById('chat-log');const div=document.createElement('div');div.className='chat-msg'+(isSystem?' system':'');div.innerHTML=isSystem?text:`<span class="name">${name}</span>${text}`;log.appendChild(div);log.scrollTop=log.scrollHeight;while(log.children.length>40)log.removeChild(log.firstChild);},
  send(){const inp=document.getElementById('chat-input');const txt=inp.value.trim();if(!txt)return;inp.value='';Chat.addMsg(G.myName,txt);if(roomRef&&!G.solo){roomRef.child('chat').push({name:G.myName,text:txt,t:Date.now()});}},
  focus(){this.focused=true;document.getElementById('chat-input').focus();if(isLocked)document.exitPointerLock();},
  blur(){this.focused=false;document.getElementById('chat-input').blur();}
};
document.getElementById('chat-input').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){Chat.send();Chat.blur();}if(e.key==='Escape')Chat.blur();});

// ════ UI ════
const UI={
  _mode:'solo',
  showMenu(){show('menu-screen');hide('lobby-screen');},
  showLobby(){hide('menu-screen');show('lobby-screen');},
  showControls(){document.getElementById('lore-label-txt').textContent='CONTROLES';document.getElementById('lore-text').textContent='WASD — Mover  ·  SHIFT — Correr  ·  F — Lanterna  ·  E — Entrar/Sair do Carro  ·  T — Chat  ·  ESC — Liberar mouse  ·  Dentro do carro: WASD = dirigir, SHIFT = turbo';document.getElementById('lore-popup').style.display='flex';},
  setMode(mode){this._mode=mode;document.getElementById('tab-solo').classList.toggle('active',mode==='solo');document.getElementById('tab-multi').classList.toggle('active',mode==='multi');const mo=document.getElementById('multi-options');mo.style.display=mode==='multi'?'flex':'none';},
  quickRoom(){const code=Math.random().toString(36).slice(2,8).toUpperCase();document.getElementById('room-input').value=code;showMsg('SALA: '+code+' — compartilhe!');},
  async startFromLobby(){
    const name=(document.getElementById('name-input').value.trim()||'ANÔNIMO').toUpperCase().slice(0,12);
    G.myName=name;G.solo=this._mode==='solo';
    if(!G.solo){const code=document.getElementById('room-input').value.trim().toUpperCase();if(!code||code.length<3){showMsg('CÓDIGO INVÁLIDO');return;}G.roomCode=code;document.getElementById('start-btn').textContent='CONECTANDO...';const ok=await loadFirebase();if(!ok){showMsg('FIREBASE OFFLINE — MODO SOLO');G.solo=true;}else{await connectRoom();}document.getElementById('start-btn').textContent='ENTRAR';}
    startGame();
  },
  closeLore(){document.getElementById('lore-popup').style.display='none';document.getElementById('lore-label-txt').textContent='FITA VHS — ENCONTRADA';if(G.running)canvas.requestPointerLock();}
};
function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
function showMsg(txt){const d=document.createElement('div');d.className='msg';d.textContent=txt;document.getElementById('msg-box').appendChild(d);setTimeout(()=>d.remove(),4000);}

// ════ FIREBASE ROOM ════
async function connectRoom(){
  roomRef=fbDB.ref('horror_rooms/'+G.roomCode);
  const myRef=roomRef.child('players/'+G.myId);
  myRef.set({name:G.myName,x:0,y:1.7,z:0,ry:0,t:Date.now(),online:true});
  myRef.onDisconnect().remove();
  roomRef.child('players').on('child_added',snap=>{if(snap.key===G.myId)return;const d=snap.val()||{};getOrCreateRemote(snap.key,d.name||'???');Chat.addMsg('','⟶ '+(d.name||'???')+' entrou na sala',true);updateOnlineList();});
  roomRef.child('players').on('child_changed',snap=>{if(snap.key===G.myId)return;const d=snap.val()||{},p=remotePlayers[snap.key];if(p){p.grp.position.set(d.x||0,d.y||0,d.z||0);p.grp.rotation.y=d.ry||0;}});
  roomRef.child('players').on('child_removed',snap=>{if(remotePlayers[snap.key])Chat.addMsg('','⟵ '+(remotePlayers[snap.key].name)+' saiu',true);removeRemote(snap.key);updateOnlineList();});
  roomRef.child('chat').limitToLast(1).on('child_added',snap=>{const d=snap.val();if(!d||d.name===G.myName)return;Chat.addMsg(d.name,d.text);});
  roomRef.child('events').limitToLast(1).on('child_added',snap=>{const ev=snap.val();if(!ev||ev.player===G.myName)return;showMsg(ev.player+' coletou uma fita VHS');});
  updateOnlineList();
}
function updateOnlineList(){const names=Object.values(remotePlayers).map(p=>p.name);const el=document.getElementById('online-list');if(names.length===0){el.textContent='';return;}el.textContent='👥 '+names.join('\n');}

// ════ START GAME ════
function startGame(){
  hide('lobby-screen');hide('menu-screen');
  document.getElementById('hud').style.display='flex';
  document.getElementById('keys-hint').style.display='block';
  document.getElementById('chat-wrap').style.display='block';
  document.getElementById('found-items').textContent='FITAS VHS: 0/8';
  buildMap();
  monster=new Monster();
  G.running=true;
  Chat.addMsg('','[ bem-vindo à rua — versão 3 ]',true);
  if(!G.solo)Chat.addMsg('','[ sala: '+G.roomCode+' ]',true);
  showMsg('BEM-VINDO À RUA');
  setTimeout(()=>showMsg('ENCONTRE AS 8 FITAS VHS'),2800);
  setTimeout(()=>showMsg('ELE ESTÁ AQUI'),7500);
  setTimeout(()=>showMsg('DICA: CARROS PODEM TE PROTEGER'),12000);
  canvas.requestPointerLock();
}

// ════ INTERACT ════
function interact(){
  if(G.inCar){
    // Exit car
    const car=G.drivingCar;
    G.inCar=false;G.drivingCar=null;
    car.occupied=false;
    car.headlightL.intensity=0;
    camera.position.set(car.grp.position.x+2,1.7,car.grp.position.z+2);
    document.getElementById('car-hud').style.display='none';
    document.getElementById('car-prompt').style.display='none';
    showMsg('SAIU DO CARRO');
    return;
  }
  // Check cars nearby
  for(const car of cars){
    const d=camera.position.distanceTo(car.grp.position);
    if(d<3.5&&!car.occupied){
      car.occupied=true;G.inCar=true;G.drivingCar=car;
      document.getElementById('car-hud').style.display='flex';
      showMsg('DENTRO DO CARRO — WASD PARA DIRIGIR');
      // Check items inside car
      car.items.forEach(item=>{
        if(!item.userData.collected&&new THREE.Vector3().copy(item.getWorldPosition(new THREE.Vector3())).distanceTo(camera.position)<4){
          item.userData.collected=true;item.visible=false;
          G.foundTapes++;
          document.getElementById('found-items').textContent='FITAS VHS: '+G.foundTapes+'/8';
          document.getElementById('lore-label-txt').textContent=item.userData.type==='note'?'NOTA ENCONTRADA':'FITA VHS — ENCONTRADA';
          document.getElementById('lore-text').textContent=item.userData.lore;
          document.getElementById('lore-popup').style.display='flex';
          if(isLocked)document.exitPointerLock();
        }
      });
      return;
    }
  }
  // Check tapes on ground
  tapeObjects.forEach((t,i)=>{
    if(t.mesh.userData.collected)return;
    if(camera.position.distanceTo(t.mesh.position)<3){
      t.mesh.userData.collected=true;t.mesh.visible=false;t.gl.intensity=0;
      G.foundTapes++;
      document.getElementById('found-items').textContent='FITAS VHS: '+G.foundTapes+'/8';
      document.getElementById('lore-label-txt').textContent='FITA VHS — ENCONTRADA';
      document.getElementById('lore-text').textContent=t.lore;
      document.getElementById('lore-popup').style.display='flex';
      if(isLocked)document.exitPointerLock();
      if(roomRef&&!G.solo)roomRef.child('events').push({player:G.myName,tape:i,t:Date.now()});
      if(G.foundTapes>=8)setTimeout(()=>showEnding(),3000);
    }
  });
}

function showEnding(){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:#000;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-family:Courier New,monospace;color:#fff;padding:60px';
  o.innerHTML='<p style="font-size:clamp(13px,2vw,17px);letter-spacing:2px;color:rgba(255,255,255,0.5);text-align:center;line-height:2.8;max-width:560px;font-style:italic">"Eu tentei mostrar pra todos..."<br>"Mas ninguém queria enxergar..."<br>"Pra eles eu era louco..."<br>"Pra mim... isso era normal..."</p><div style="width:60px;height:1px;background:rgba(255,255,255,0.15)"></div><p style="font-size:10px;letter-spacing:7px;color:rgba(255,255,255,0.25)">A HISTÓRIA NUNCA TERMINOU.</p><button onclick="location.reload()" style="background:transparent;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.35);font-family:Courier New;font-size:10px;letter-spacing:4px;padding:12px 28px;cursor:pointer;margin-top:16px">JOGAR NOVAMENTE</button>';
  document.body.appendChild(o);
}

// ════ INPUT ════
canvas.addEventListener('click',()=>{if(G.running&&!Chat.focused)canvas.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>{isLocked=document.pointerLockElement===canvas;});
document.addEventListener('mousemove',e=>{
  if(!isLocked||!G.running||G.inCar)return;
  yaw-=e.movementX*0.002;
  pitch=Math.max(-1.2,Math.min(0.8,pitch-e.movementY*0.002));
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
});
document.addEventListener('keydown',e=>{
  if(Chat.focused)return;
  keys[e.code]=true;
  if(!G.running)return;
  if(e.code==='KeyF')toggleFlash();
  if(e.code==='KeyE')interact();
  if(e.code==='KeyT'){e.preventDefault();Chat.focus();}
  if(e.code==='Escape')document.exitPointerLock();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function toggleFlash(){
  if(G.inCar)return;
  flashlightOn=!flashlightOn;
  flashlight.intensity=flashlightOn?4.5:0;
  showMsg(flashlightOn?'LANTERNA LIGADA':'LANTERNA DESLIGADA');
}

// ════ CAR NEARBY PROMPT ════
function checkCarProximity(){
  if(G.inCar){document.getElementById('car-prompt').style.display='none';return;}
  for(const car of cars){
    const d=camera.position.distanceTo(car.grp.position);
    if(d<4&&!car.occupied){
      const el=document.getElementById('car-prompt');
      el.style.display='block';el.textContent='[ E ] — ENTRAR NO CARRO';return;
    }
  }
  document.getElementById('car-prompt').style.display='none';
}

// ════ MAIN LOOP ════
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastT)*0.001,0.05);lastT=ts;
  const t=ts*0.001;
  if(G.running){
    if(G.inCar&&G.drivingCar){
      G.drivingCar.update(dt);
      // Camera follows car direction
      camera.rotation.order='YXZ';
      camera.rotation.y=G.drivingCar.heading+Math.PI;
      camera.rotation.x=-0.05;
    }else{
      // Walking movement
      const running=keys['ShiftLeft']||keys['ShiftRight'];
      const spd=running?5.8:2.8;
      const mv=new THREE.Vector3();
      if(keys['KeyW'])mv.z=-1;
      if(keys['KeyS'])mv.z=1;
      if(keys['KeyA'])mv.x=-1;
      if(keys['KeyD'])mv.x=1;
      if(mv.lengthSq()>0){mv.normalize().applyEuler(new THREE.Euler(0,yaw,0));camera.position.addScaledVector(mv,spd*dt);}
      const moving=mv.lengthSq()>0;
      camera.position.y=1.7+Math.sin(t*(running?12:6))*(moving?0.04:0);
      camera.position.x=Math.max(-330,Math.min(330,camera.position.x));
      camera.position.z=Math.max(-330,Math.min(330,camera.position.z));
      // Stats
      if(flashlightOn){G.battery-=dt*1.2;if(G.battery<=0){G.battery=0;toggleFlash();showMsg('BATERIA ACABOU');}}
      else G.battery=Math.min(100,G.battery+dt*4.5);
      if(running&&moving){G.stamina-=dt*18;if(G.stamina<=0){G.stamina=0;keys['ShiftLeft']=false;keys['ShiftRight']=false;}}
      else G.stamina=Math.min(100,G.stamina+dt*9);
    }
    if(G.nearMonster)G.sanity-=dt*7;else G.sanity=Math.min(100,G.sanity+dt*1.8);
    // HUD
    document.getElementById('bat-fill').style.width=G.battery+'%';
    document.getElementById('bat-pct').textContent=Math.round(G.battery)+'%';
    document.getElementById('stam-fill').style.width=G.stamina+'%';
    document.getElementById('san-fill').style.width=G.sanity+'%';
    // Effects
    document.getElementById('noise-overlay').style.opacity=(1-G.sanity/100)*0.18;
    const ri=Math.max(0,1-G.monsterDist/20);
    document.getElementById('red-pulse').style.opacity=ri*0.7;
    document.getElementById('monster-ring').style.opacity=ri*0.5;
    // Flashlight flicker
    if(flashlightOn&&G.monsterDist<18){flashlight.intensity=4.5-Math.sin(t*18)*0.8*(1-G.monsterDist/18);}
    else if(flashlightOn&&!G.inCar){flashlight.intensity=4.5;}
    // Street lamp flicker
    streetLamps.forEach(l=>{l.t+=dt;const f=Math.sin(l.t*6.5)*0.06+Math.sin(l.t*22.3)*0.04;l.light.intensity=l.base+f;if(Math.random()<0.0006)l.light.intensity=0;});
    // Monster
    monster.update(dt,camera.position);
    // Tape spin
    tapeObjects.forEach(tp=>{if(!tp.mesh.userData.collected)tp.mesh.rotation.y+=dt*2.2;});
    // Remote players
    animateRemotePlayers(dt);
    updateNametagsDOM();
    // Car proximity prompt
    checkCarProximity();
    // Firebase sync
    posTimer+=dt;
    if(posTimer>0.1&&roomRef&&!G.solo){
      posTimer=0;
      roomRef.child('players/'+G.myId).update({x:+(camera.position.x.toFixed(2)),y:+(camera.position.y.toFixed(2)),z:+(camera.position.z.toFixed(2)),ry:+(yaw.toFixed(2)),t:Date.now()});
    }
  }
  drawRain();
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();rc.width=window.innerWidth;rc.height=window.innerHeight;});

requestAnimationFrame(loop);
</script>
