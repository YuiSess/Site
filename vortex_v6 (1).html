<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VORTEX TACTICAL — V7 FULL WAR EDITION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;user-select:none}
#gameCanvas{display:block;width:100vw;height:100vh;cursor:none}

/* ── CROSSHAIR ── */
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20}
.ch-line{position:absolute;background:rgba(255,255,255,0.95);box-shadow:0 0 3px #00ff88}
#ch-t{width:1px;height:8px;top:-14px;left:0}
#ch-b{width:1px;height:8px;top:6px;left:0}
#ch-l{height:1px;width:8px;left:-14px;top:0}
#ch-r{height:1px;width:8px;left:6px;top:0}
#ch-dot{width:2px;height:2px;background:#00ff88;top:-1px;left:-1px;border-radius:50%}
#crosshair.spread .ch-line{animation:spreadAnim 0.1s ease-out}
@keyframes spreadAnim{0%{transform:scale(1)}100%{transform:scale(1.5)}}
#crosshair.aiming #ch-t,#crosshair.aiming #ch-b,#crosshair.aiming #ch-l,#crosshair.aiming #ch-r{opacity:0}

/* ── HUD ── */
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;display:none}
.hud-bottom{position:absolute;bottom:0;left:0;right:0;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-end}
.ammo-wrap{text-align:right}
.ammo-main{font-size:42px;font-weight:900;color:#fff;letter-spacing:3px;line-height:1;text-shadow:0 0 20px #fff8}
.ammo-sep{font-size:22px;color:#fff4;margin:0 4px}
.ammo-res{font-size:24px;color:#fff6}
.ammo-label{font-size:9px;letter-spacing:4px;color:#00ff8888;margin-bottom:3px}
.weapon-name{font-size:11px;letter-spacing:3px;color:#ffffff66;margin-top:2px}
.health-wrap{min-width:180px}
.hp-label{font-size:9px;letter-spacing:4px;color:#ff444488;margin-bottom:5px}
.hp-bar{height:3px;background:#fff1;border-radius:2px;overflow:hidden;margin-bottom:4px}
.hp-fill{height:100%;background:linear-gradient(90deg,#ff3333,#ff9900);transition:width .3s;border-radius:2px}
.hp-num{font-size:28px;font-weight:700;color:#fff;letter-spacing:2px}
.armor-bar{height:2px;background:#fff1;border-radius:1px;overflow:hidden;margin-top:3px}
.armor-fill{height:100%;background:linear-gradient(90deg,#3388ff,#88ccff);transition:width .3s}

/* ── TOP HUD ── */
.hud-top{position:absolute;top:0;left:0;right:0;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.round-timer{font-size:28px;font-weight:700;color:#fff;letter-spacing:6px;text-shadow:0 0 20px #fff8}
.round-mode{font-size:9px;letter-spacing:5px;color:#00ff8888;text-align:center;margin-top:2px}
.score-wrap{display:flex;gap:20px;align-items:center;font-size:13px;letter-spacing:2px}
.score-item{color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.score-num{font-size:22px;font-weight:700}
.score-label{font-size:8px;color:#fff6;letter-spacing:3px}

/* ── MINIMAP ── */
#minimapWrap{position:fixed;top:16px;right:16px;pointer-events:none;z-index:15}
#minimapCanvas{border:1px solid #00ff8433;border-radius:3px;display:block}
.mm-label{font-size:8px;letter-spacing:3px;color:#00ff8466;text-align:center;margin-top:3px}

/* ── WEAPON SWITCHER ── */
#weaponBar{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;z-index:15;display:none}
.w-slot{width:60px;height:60px;border:1px solid #ffffff22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:8px;color:#fff6;letter-spacing:1px;border-radius:3px;background:rgba(0,0,0,0.4)}
.w-slot.active{border-color:#00ff88;color:#00ff88;background:rgba(0,255,136,0.08);box-shadow:0 0 10px #00ff8833}
.w-icon{font-size:16px}

/* ── KILL FEED ── */
#killFeed{position:fixed;top:60px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:15;pointer-events:none}
.kill-item{padding:4px 10px;font-size:11px;color:#fff;border-radius:2px;animation:kfIn 3.5s forwards;background:rgba(0,0,0,0.55);border-left:2px solid #ff4444}
.kill-item.mine{border-left-color:#00ff88}
@keyframes kfIn{0%{opacity:0;transform:translateX(20px)}10%{opacity:1;transform:translateX(0)}85%{opacity:1}100%{opacity:0}}

/* ── CHAT ── */
#chatBox{position:fixed;bottom:90px;left:20px;width:260px;z-index:15;pointer-events:none}
.chat-msg{font-size:11px;padding:3px 8px;border-left:1px solid #00ff8444;background:rgba(0,0,0,0.5);margin-bottom:2px;border-radius:0 2px 2px 0;animation:fadeIn .2s ease;color:#ddd}
.chat-msg .sender{color:#00ff88}
@keyframes fadeIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}

/* ── DAMAGE / EFFECTS ── */
#dmgVignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 55%,#ff000044);opacity:0;transition:opacity .1s;z-index:8}
#dmgVignette.show{opacity:1}
#lowHpVignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 45%,#ff000066);animation:breathe 1.5s ease-in-out infinite;display:none;z-index:8}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.9}}
#screenFlash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .05s;z-index:9}

/* ── SCOPE ── */
#scopeOverlay{position:fixed;inset:0;pointer-events:none;z-index:18;display:none}
#scopeRing{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:320px;height:320px;border-radius:50%;border:3px solid #111;box-shadow:0 0 0 9999px rgba(0,0,0,.97)}
.scope-line{position:absolute;background:#00ff8866}
#sl-h{height:1px;width:100%;top:50%;transform:translateY(-50%)}
#sl-v{width:1px;height:100%;left:50%;transform:translateX(-50%)}
#sl-tl{width:40%;height:1px;top:50%;right:55%;transform:translateY(-50%) scaleX(1)}
#sl-tr{width:40%;height:1px;top:50%;left:55%;transform:translateY(-50%)}
.scope-mil{position:absolute;background:#00ff8833;font-size:8px;color:#00ff8888;text-align:center}

/* ── GRENADE WARN ── */
#grenWarn{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);color:#ff8800;font-size:12px;letter-spacing:4px;display:none;pointer-events:none;z-index:20;animation:blinkW .4s infinite}
@keyframes blinkW{0%,100%{opacity:1}50%{opacity:0}}

/* ── INTERACTION PROMPT ── */
#interactPrompt{position:fixed;top:55%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;display:none;text-align:center}
.interact-key{display:inline-block;padding:4px 10px;border:1px solid #fff6;font-size:11px;letter-spacing:3px;color:#fff;background:rgba(0,0,0,.6);border-radius:3px;margin-bottom:4px}
.interact-label{font-size:10px;letter-spacing:2px;color:#ffffff88;display:block}

/* ── RESPAWN ── */
#respawnScreen{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:60;pointer-events:none}
.respawn-title{color:#ff4444;font-size:18px;letter-spacing:8px;text-shadow:0 0 20px #ff4444}
.respawn-num{font-size:56px;font-weight:700;color:#fff;letter-spacing:8px}

/* ── MOD MENU ── */
#modMenu{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;background:rgba(5,10,18,.97);border:1px solid #00ff8833;border-radius:4px;z-index:80;display:none;pointer-events:all;font-family:'Courier New',monospace}
#modMenu.open{display:block}
.mm-header{padding:14px 18px;border-bottom:1px solid #00ff8822;display:flex;justify-content:space-between;align-items:center}
.mm-title{font-size:13px;letter-spacing:6px;color:#00ff88}
.mm-close{background:none;border:none;color:#ff4444;cursor:pointer;font-size:16px;font-family:inherit;letter-spacing:2px}
.mm-tabs{display:flex;border-bottom:1px solid #00ff8811}
.mm-tab{flex:1;padding:8px;text-align:center;font-size:10px;letter-spacing:2px;color:#ffffff44;cursor:pointer;border:none;background:none;font-family:inherit;transition:all .2s}
.mm-tab.active{color:#00ff88;border-bottom:1px solid #00ff88}
.mm-tab:hover{color:#fff}
.mm-content{padding:12px 18px;max-height:320px;overflow-y:auto}
.mm-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff08}
.mm-row-label{font-size:11px;letter-spacing:2px;color:#fff}
.mm-row-sub{font-size:9px;color:#ffffff44;letter-spacing:1px;margin-top:2px}
.mm-toggle{width:36px;height:18px;border-radius:9px;background:#ffffff22;border:none;cursor:pointer;position:relative;transition:background .2s}
.mm-toggle.on{background:#00ff88}
.mm-toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s}
.mm-toggle.on::after{left:20px}
.mm-slider-wrap{display:flex;align-items:center;gap:8px}
.mm-slider{width:100px;accent-color:#00ff88}
.mm-val{font-size:10px;color:#00ff88;min-width:28px;text-align:right;letter-spacing:1px}
.mm-btn{padding:6px 14px;background:transparent;border:1px solid #00ff8844;color:#00ff88;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .2s}
.mm-btn:hover{background:#00ff8811;border-color:#00ff88}
.mm-section{font-size:8px;letter-spacing:4px;color:#00ff8866;margin:10px 0 6px}

/* ── MAIN MENU ── */
#mainScreen{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:90;pointer-events:all}
.ms-inner{width:440px;text-align:center}
.ms-title{font-size:52px;font-weight:900;letter-spacing:10px;color:#fff;text-shadow:0 0 40px #00ff88,0 0 80px #00ff8833;margin-bottom:4px}
.ms-sub{font-size:10px;letter-spacing:8px;color:#00ff88;margin-bottom:32px}
.ms-btn{display:block;width:100%;padding:13px;background:transparent;border:1px solid #00ff8866;color:#00ff88;font-family:'Courier New',monospace;font-size:12px;letter-spacing:5px;cursor:pointer;margin-bottom:8px;transition:all .2s;border-radius:2px}
.ms-btn:hover{background:#00ff8811;letter-spacing:7px;border-color:#00ff88;box-shadow:0 0 20px #00ff8822}
.ms-btn.sec{border-color:#ffffff22;color:#ffffff66;font-size:10px;letter-spacing:3px}
.ms-btn.sec:hover{border-color:#ffffff44;color:#fff;background:#ffffff08}
.ms-players{margin:16px 0;padding:14px;border:1px solid #ffffff0a;text-align:left;border-radius:2px}
.ms-pl-title{font-size:8px;letter-spacing:4px;color:#00ff8877;margin-bottom:8px}
.ms-pl-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;color:#fff;border-bottom:1px solid #ffffff08}
.ms-pl-dot{width:6px;height:6px;border-radius:50%;background:#00ff88;animation:pulse 1.2s ease-in-out infinite}
.ms-pl-dot.e{background:#ff4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.controls-panel{text-align:left;margin:10px 0;padding:12px;border:1px solid #ffffff08;font-size:10px;color:#ffffff66;line-height:2;letter-spacing:1px;display:none;border-radius:2px}

/* ── MUZZLE FLASH ── */
#muzzleFlash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);width:180px;height:180px;background:radial-gradient(circle,#ffffa0cc,#ff880000);border-radius:50%;pointer-events:none;z-index:7;transition:transform .04s}
#muzzleFlash.fire{transform:translate(-50%,-50%) scale(1)}

/* ── STATUS BAR LEFT ── */
#statusBar{position:fixed;left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:15;display:none}
.stat-row{display:flex;align-items:center;gap:6px;font-size:9px;color:#ffffff55;letter-spacing:2px}
.stat-icon{width:14px;height:14px;border:1px solid #ffffff22;display:flex;align-items:center;justify-content:center;font-size:7px;color:#00ff88}

/* ── VEHICLE HUD ── */
#vehicleHUD{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);display:none;pointer-events:none;z-index:15;text-align:center}
.vhud-speed{font-size:32px;font-weight:700;color:#fff;letter-spacing:4px}
.vhud-label{font-size:8px;letter-spacing:4px;color:#00ff8888}
.vhud-name{font-size:10px;letter-spacing:3px;color:#ffffff66;margin-top:2px}

/* ── HIT MARKER ── */
.hit-marker{position:fixed;top:50%;left:50%;pointer-events:none;z-index:20;animation:hmAnim .4s ease-out forwards}
@keyframes hmAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}

/* ── LOADING SCREEN ── */
#loadScreen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;pointer-events:none}
.load-title{font-size:48px;font-weight:900;letter-spacing:10px;color:#fff;text-shadow:0 0 40px #00ff88;margin-bottom:8px}
.load-sub{font-size:10px;letter-spacing:6px;color:#00ff8888;margin-bottom:40px}
.load-bar-wrap{width:280px;height:3px;background:#ffffff11;border-radius:2px;overflow:hidden;margin-bottom:14px}
.load-bar-fill{height:100%;background:linear-gradient(90deg,#00ff88,#00aaff);width:0%;transition:width .15s ease;border-radius:2px}
.load-status{font-size:9px;letter-spacing:3px;color:#ffffff44}

/* ── SANDBOX PANEL ── */
#sandboxPanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;background:rgba(5,10,18,.97);border:1px solid #ffaa0033;border-radius:4px;z-index:80;display:none;pointer-events:all;font-family:'Courier New',monospace;max-height:88vh;overflow-y:auto}
#sandboxPanel.open{display:block}
.sb-header{padding:14px 18px;border-bottom:1px solid #ffaa0022;display:flex;justify-content:space-between;align-items:center}
.sb-title{font-size:13px;letter-spacing:6px;color:#ffaa00}
.sb-close{background:none;border:none;color:#ff4444;cursor:pointer;font-size:16px;font-family:inherit;letter-spacing:2px}
.sb-section{font-size:8px;letter-spacing:4px;color:#ffaa0066;margin:12px 18px 6px}
.sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 18px 8px}
.sb-btn{padding:8px 10px;background:transparent;border:1px solid #ffaa0033;color:#ffaa00;font-family:'Courier New',monospace;font-size:9px;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .2s;text-align:left}
.sb-btn:hover{background:#ffaa0011;border-color:#ffaa00}
.sb-btn.red{border-color:#ff444433;color:#ff6666}.sb-btn.red:hover{background:#ff444411;border-color:#ff4444}
.sb-btn.blue{border-color:#4488ff33;color:#88aaff}.sb-btn.blue:hover{background:#4488ff11;border-color:#4488ff}
.sb-btn.green{border-color:#00ff8833;color:#00ff88}.sb-btn.green:hover{background:#00ff8811;border-color:#00ff88}
.sb-row{display:flex;justify-content:space-between;align-items:center;padding:7px 18px;border-bottom:1px solid #ffffff08}
.sb-row-label{font-size:11px;letter-spacing:2px;color:#fff}
.sb-row-sub{font-size:9px;color:#ffffff44;letter-spacing:1px;margin-top:2px}
.sb-input{background:#ffffff08;border:1px solid #ffaa0033;color:#ffaa00;font-family:'Courier New',monospace;font-size:10px;padding:4px 8px;width:80px;border-radius:2px;text-align:center}
.sb-input:focus{outline:none;border-color:#ffaa00}

::-webkit-scrollbar-track{background:#ffffff08}
::-webkit-scrollbar-thumb{background:#00ff8844;border-radius:2px}

/* ── TURRET HUD ── */
#turretHUD{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;z-index:22}
#turretCrosshair{width:80px;height:80px;border:2px solid #ff4444;border-radius:50%;position:relative}
#turretCrosshair::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#ff4444;margin-top:-.5px}
#turretCrosshair::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ff4444;margin-left:-.5px}
.turret-label{font-size:9px;letter-spacing:4px;color:#ff4444;text-align:center;margin-top:4px;text-shadow:0 0 8px #ff4444}

/* ── SECRET WEAPON INDICATOR ── */
#secretWeaponPulse{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:20;display:none;text-align:center}
.sw-label{font-size:10px;letter-spacing:4px;color:#ff00ff;text-shadow:0 0 12px #ff00ff;animation:swPulse 1s ease-in-out infinite}
@keyframes swPulse{0%,100%{opacity:1;text-shadow:0 0 12px #ff00ff}50%{opacity:.4;text-shadow:0 0 24px #ff00ff}}

/* ── ZOMBIE MODE ── */
#zombieHUD{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:12;display:none}
#zombieWave{position:fixed;top:80px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:8px;color:#aa0000;text-shadow:0 0 20px #ff0000;display:none;text-align:center}
#zombiePanel{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);display:none;pointer-events:none;z-index:16;background:rgba(0,0,0,.7);padding:8px 18px;border-radius:3px;border:1px solid #aa000055;text-align:center}
.zombie-stat{font-size:11px;letter-spacing:3px;color:#ff4444;margin:2px 0}
#downedScreen{position:fixed;inset:0;background:rgba(60,0,0,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:55;pointer-events:none}
.downed-title{color:#ff4444;font-size:16px;letter-spacing:6px;text-shadow:0 0 20px #ff4444;animation:breathe 1s infinite}
.downed-hp{font-size:32px;color:#fff;letter-spacing:4px}
.downed-hint{font-size:10px;letter-spacing:3px;color:#ffffff66}
#inventoryPanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:460px;background:rgba(5,10,8,.97);border:1px solid #00ff8833;border-radius:4px;z-index:85;display:none;pointer-events:all;font-family:'Courier New',monospace;max-height:80vh;overflow-y:auto}
.inv-header{padding:14px 18px;border-bottom:1px solid #00ff8822;display:flex;justify-content:space-between;align-items:center}
.inv-title{font-size:13px;letter-spacing:6px;color:#00ff88}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px}
.inv-slot{width:80px;height:80px;border:1px solid #ffffff18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:8px;color:#fff6;letter-spacing:1px;border-radius:3px;background:rgba(0,0,0,0.4);cursor:pointer;transition:all .2s;position:relative}
.inv-slot:hover{border-color:#00ff8866;background:rgba(0,255,136,.05)}
.inv-slot.filled{border-color:#00ff8844}
.inv-slot .item-icon{font-size:22px}
.inv-slot .item-count{position:absolute;bottom:2px;right:4px;font-size:9px;color:#00ff88;font-weight:700}
.inv-slot.equipped{border-color:#00ff88;box-shadow:0 0 8px #00ff8833}
/* ── CAR SPEED LINES ── */
#speedLines{position:fixed;inset:0;pointer-events:none;z-index:7;display:none;overflow:hidden}
.spd-line{position:absolute;background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.06),transparent);width:2px;animation:speedAnim linear infinite}
@keyframes speedAnim{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}

/* ── TURRET MOUNT PROMPT ── */
.turret-prompt{border-left-color:#ff4444 !important}

/* ── SECRET WEAPON CROSSHAIR ── */
#crosshair.minigun .ch-line{background:rgba(255,0,255,0.95);box-shadow:0 0 6px #ff00ff}
#crosshair.minigun #ch-dot{background:#ff00ff}

/* ── DAMAGE NUMBER POPUP ── */
.dmg-popup{position:fixed;pointer-events:none;z-index:25;font-family:'Courier New',monospace;font-weight:900;letter-spacing:2px;animation:dmgFloat 1.1s ease-out forwards}
@keyframes dmgFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-55px) scale(.8)}}
.dmg-popup.headshot{color:#ffee00;text-shadow:0 0 8px #ffaa00}
.dmg-popup.normal{color:#ff6644;text-shadow:0 0 6px #ff3300}

/* ── TEAM HUD ── */
#teamBar{position:fixed;top:55px;left:50%;transform:translateX(-50%);display:none;pointer-events:none;z-index:16;background:rgba(0,0,0,.55);padding:5px 14px;border-radius:3px;border:1px solid #ffffff11;display:flex;gap:20px;align-items:center}
.team-score{font-size:22px;font-weight:900;letter-spacing:4px}
.team-score.blue{color:#4488ff;text-shadow:0 0 10px #4488ff88}
.team-score.red{color:#ff4444;text-shadow:0 0 10px #ff444488}
.team-sep{color:#ffffff33;font-size:18px}

/* ── ROOM PANEL (tela de salas) ── */
#roomScreen{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:91;pointer-events:all}
#roomScreen.open{display:flex}
.room-inner{width:520px;font-family:'Courier New',monospace}
.room-title{font-size:28px;font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 20px #00ff88;margin-bottom:6px;text-align:center}
.room-sub{font-size:9px;letter-spacing:5px;color:#00ff8888;text-align:center;margin-bottom:20px}
.room-tabs{display:flex;border-bottom:1px solid #00ff8822;margin-bottom:14px}
.room-tab{flex:1;padding:9px;text-align:center;font-size:10px;letter-spacing:3px;color:#ffffff44;cursor:pointer;border:none;background:none;font-family:inherit;transition:all .2s}
.room-tab.active{color:#00ff88;border-bottom:2px solid #00ff88}
.room-list{max-height:220px;overflow-y:auto;margin-bottom:14px}
.room-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #ffffff0a;border-radius:3px;margin-bottom:5px;cursor:pointer;transition:all .2s}
.room-item:hover{border-color:#00ff8844;background:#00ff8808}
.room-item-name{flex:1;font-size:12px;letter-spacing:2px;color:#fff}
.room-item-mode{font-size:9px;color:#00ff8888;letter-spacing:2px}
.room-item-count{font-size:10px;color:#ffffff55}
.room-create{padding:14px;border:1px solid #00ff8833;border-radius:3px;margin-bottom:12px}
.room-create-title{font-size:9px;letter-spacing:4px;color:#00ff8888;margin-bottom:10px}
.room-input{width:100%;background:#ffffff08;border:1px solid #00ff8833;color:#fff;font-family:'Courier New',monospace;font-size:11px;padding:7px 10px;border-radius:2px;margin-bottom:8px;letter-spacing:2px}
.room-input:focus{outline:none;border-color:#00ff88}
.room-mode-sel{display:flex;gap:6px;margin-bottom:10px}
.room-mode-btn{flex:1;padding:7px;border:1px solid #ffffff22;color:#ffffff66;font-family:'Courier New',monospace;font-size:9px;letter-spacing:2px;cursor:pointer;background:none;border-radius:2px;transition:all .2s}
.room-mode-btn.sel{border-color:#00ff88;color:#00ff88;background:#00ff8811}
.room-team-sel{display:flex;gap:6px;margin-bottom:10px}
.room-team-btn{flex:1;padding:7px;border:1px solid #ffffff11;cursor:pointer;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;background:none;border-radius:2px;transition:all .2s}
.room-team-btn.blue-sel{border-color:#4488ff;color:#4488ff;background:#4488ff11}
.room-team-btn.red-sel{border-color:#ff4444;color:#ff4444;background:#ff444411}

/* ── CROSSHAIR PER WEAPON ── */
#crosshair.pistol #ch-t,#crosshair.pistol #ch-b{height:5px;top:-9px}
#crosshair.pistol #ch-t{top:-9px}#crosshair.pistol #ch-b{top:4px}
#crosshair.pistol #ch-l,#crosshair.pistol #ch-r{width:5px}
#crosshair.pistol #ch-l{left:-9px}#crosshair.pistol #ch-r{left:4px}
#crosshair.rpg #ch-t,#crosshair.rpg #ch-b{height:12px}
#crosshair.rpg #ch-t{top:-18px}#crosshair.rpg #ch-b{top:8px}
#crosshair.rpg #ch-l,#crosshair.rpg #ch-r{width:12px}
#crosshair.rpg #ch-l{left:-18px}#crosshair.rpg #ch-r{left:8px}
#crosshair.rpg .ch-line{background:rgba(255,120,0,.9);box-shadow:0 0 4px #ff8800}
#crosshair.shotgun .ch-line{background:rgba(255,80,80,.9);box-shadow:0 0 4px #ff4444}
#crosshair.sniper .ch-line{opacity:0}

/* ── INSIDE ROOM indicator ── */
#insideLabel{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:19;display:none;font-size:9px;letter-spacing:4px;color:#ffffff44;text-align:center}

/* ── STAT COUNTERS (headshot / dmg) ── */
#statPanel{position:fixed;bottom:160px;right:16px;pointer-events:none;z-index:15;text-align:right;display:none}
.stat-line{font-size:10px;letter-spacing:2px;color:#ffffff55;margin-bottom:2px}
.stat-line span{color:#fff;font-weight:700}

/* ── GAME MODE SELECTOR ── */
#gameModeSelector{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;align-items:center;justify-content:center;z-index:92;pointer-events:all;overflow-y:auto}
#gameModeSelector.open{display:flex}
.gms-inner{width:900px;max-width:98vw;padding:20px;font-family:'Courier New',monospace}
.gms-title{font-size:32px;font-weight:900;letter-spacing:10px;color:#fff;text-shadow:0 0 30px #00ff88;text-align:center;margin-bottom:4px}
.gms-sub{font-size:9px;letter-spacing:6px;color:#00ff8888;text-align:center;margin-bottom:24px}
.gms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.gms-card{padding:14px;border:1px solid #ffffff18;border-radius:4px;cursor:pointer;transition:all .22s;background:rgba(255,255,255,.02);position:relative;overflow:hidden}
.gms-card:hover{border-color:#00ff8866;background:rgba(0,255,136,.05);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,255,136,.1)}
.gms-card.active-mode{border-color:#00ff88;background:rgba(0,255,136,.08);box-shadow:0 0 20px rgba(0,255,136,.2)}
.gms-card-icon{font-size:28px;margin-bottom:8px}
.gms-card-name{font-size:12px;font-weight:700;letter-spacing:3px;color:#fff;margin-bottom:4px}
.gms-card-desc{font-size:9px;letter-spacing:1px;color:#ffffff55;line-height:1.5}
.gms-card-tag{position:absolute;top:8px;right:8px;font-size:7px;letter-spacing:2px;padding:2px 6px;border-radius:2px}
.tag-tdm{background:#4488ff22;color:#4488ff;border:1px solid #4488ff44}
.tag-ffa{background:#ff444422;color:#ff4444;border:1px solid #ff444444}
.tag-obj{background:#ffaa0022;color:#ffaa00;border:1px solid #ffaa0044}
.tag-coop{background:#00ff8822;color:#00ff88;border:1px solid #00ff8844}
.tag-elite{background:#ff00ff22;color:#ff00ff;border:1px solid #ff00ff44}
.tag-br{background:#ff880022;color:#ff8800;border:1px solid #ff880044}
.gms-back{display:block;width:100%;padding:13px;background:transparent;border:1px solid #ffffff22;color:#ffffff66;font-family:'Courier New',monospace;font-size:11px;letter-spacing:4px;cursor:pointer;transition:all .2s;border-radius:3px;text-align:center}
.gms-back:hover{border-color:#fff;color:#fff}

/* ── GAME MODE HUD OVERLAYS ── */
#gameModeHUD{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:17}
.mode-banner{text-align:center;padding:6px;font-size:10px;letter-spacing:6px;font-weight:700}
.mode-banner.tdm{background:linear-gradient(90deg,#4488ff22,#4488ff44,#4488ff22);color:#4488ff}
.mode-banner.ffa{background:linear-gradient(90deg,#ff444422,#ff444444,#ff444422);color:#ff4444}
.mode-banner.br{background:linear-gradient(90deg,#ff880022,#ff880044,#ff880022);color:#ff8800}
.mode-banner.coop{background:linear-gradient(90deg,#00ff8822,#00ff8844,#00ff8822);color:#00ff88}
.mode-banner.elite{background:linear-gradient(90deg,#ff00ff22,#ff00ff44,#ff00ff22);color:#ff00ff}

/* Objective markers */
#objPanel{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:none;pointer-events:none;z-index:16;background:rgba(0,0,0,.6);padding:5px 16px;border-radius:3px;border:1px solid #ffaa0044;text-align:center;font-family:'Courier New',monospace}
.obj-title{font-size:8px;letter-spacing:4px;color:#ffaa0088}
.obj-row{font-size:12px;letter-spacing:3px;color:#fff;margin:2px 0}

/* BR Zone ring */
#brZonePanel{position:fixed;bottom:80px;right:16px;display:none;pointer-events:none;z-index:16;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:3px;border:1px solid #ff880066;font-family:'Courier New',monospace}
.br-label{font-size:8px;letter-spacing:3px;color:#ff8800aa;margin-bottom:4px}
.br-val{font-size:16px;font-weight:700;letter-spacing:3px;color:#ff8800}
.br-alive{font-size:10px;color:#ffffff66;margin-top:2px;letter-spacing:2px}

/* Killstreak announcer */
#killstreakBanner{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:22;display:none;text-align:center}
.ks-name{font-size:26px;font-weight:900;letter-spacing:8px;color:#ffcc00;text-shadow:0 0 30px #ffcc00,0 0 60px #ff880088;animation:ksAnim 2s ease-out forwards}
.ks-sub{font-size:10px;letter-spacing:5px;color:#ffffff88}
@keyframes ksAnim{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}

/* Perk / loadout panel */
#loadoutPanel{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:85;pointer-events:all;font-family:'Courier New',monospace}
#loadoutPanel.open{display:flex}
.lp-inner{width:700px;max-width:98vw}
.lp-title{font-size:22px;font-weight:900;letter-spacing:8px;color:#00ff88;margin-bottom:18px;text-align:center}
.lp-section{font-size:8px;letter-spacing:4px;color:#00ff8877;margin:12px 0 8px}
.lp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.lp-card{padding:10px 8px;border:1px solid #ffffff18;border-radius:3px;cursor:pointer;text-align:center;transition:all .2s;font-size:9px;letter-spacing:1px;color:#fff}
.lp-card:hover{border-color:#00ff88;background:#00ff8808}
.lp-card.sel{border-color:#00ff88;background:#00ff8814;box-shadow:0 0 10px #00ff8833}
.lp-icon{font-size:22px;margin-bottom:4px}
.lp-name{font-size:9px;letter-spacing:2px;color:#fff;font-weight:700}
.lp-desc{font-size:8px;color:#ffffff55;margin-top:2px}
.lp-confirm{display:block;width:100%;padding:12px;background:transparent;border:1px solid #00ff8866;color:#00ff88;font-family:'Courier New',monospace;font-size:11px;letter-spacing:5px;cursor:pointer;border-radius:3px;transition:all .2s;margin-top:12px}
.lp-confirm:hover{background:#00ff8811;border-color:#00ff88}

/* Drones HUD */
#dronePanel{position:fixed;top:90px;right:16px;display:none;pointer-events:none;z-index:16;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:3px;border:1px solid #4488ff44;font-family:'Courier New',monospace}
.drone-title{font-size:8px;letter-spacing:3px;color:#4488ff88}
.drone-list{margin-top:6px}
.drone-item{font-size:10px;letter-spacing:2px;color:#fff;padding:3px 0;border-bottom:1px solid #ffffff08}
.drone-item.active{color:#00ff88}

/* Wave / Survival HUD */
#waveHUD{position:fixed;top:90px;left:50%;transform:translateX(-50%);display:none;pointer-events:none;z-index:16;text-align:center;font-family:'Courier New',monospace}
.wave-num{font-size:36px;font-weight:900;letter-spacing:8px;color:#ff4444;text-shadow:0 0 20px #ff4444}
.wave-label{font-size:8px;letter-spacing:5px;color:#ff444488}
.wave-enemies{font-size:12px;letter-spacing:3px;color:#ffffff66;margin-top:4px}

/* Nuclear event */
#nuclearWarning{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
.nuke-border{position:absolute;inset:0;border:4px solid #ff4444;animation:nukePulse .5s ease-in-out infinite;box-shadow:inset 0 0 40px #ff444422}
@keyframes nukePulse{0%,100%{opacity:.4}50%{opacity:1}}
.nuke-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:'Courier New',monospace}
.nuke-main{font-size:28px;font-weight:900;letter-spacing:10px;color:#ff4444;text-shadow:0 0 40px #ff4444;animation:nukePulse .5s infinite}
.nuke-timer{font-size:52px;font-weight:900;color:#fff;letter-spacing:8px}

/* Boss Fight HUD */
#bossHUD{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);display:none;pointer-events:none;z-index:16;width:500px;font-family:'Courier New',monospace;text-align:center}
.boss-name{font-size:12px;letter-spacing:6px;color:#ff0000;margin-bottom:6px;text-shadow:0 0 20px #ff0000}
.boss-bar-wrap{height:16px;background:#ffffff18;border-radius:2px;overflow:hidden;border:1px solid #ff000044}
.boss-bar-fill{height:100%;background:linear-gradient(90deg,#cc0000,#ff4400,#ff8800);transition:width .3s;border-radius:2px}
.boss-phase{font-size:8px;letter-spacing:4px;color:#ff444488;margin-top:4px}

/* Night Ops vignette */
#nightOpsOverlay{position:fixed;inset:0;background:radial-gradient(ellipse 40% 50% at 50% 50%,transparent,rgba(0,0,5,.96));pointer-events:none;z-index:11;display:none}

/* Ranked panel */
#rankedPanel{position:fixed;top:50%;right:0;transform:translateY(-50%);display:none;pointer-events:none;z-index:16;background:rgba(0,0,0,.8);padding:12px;border-radius:3px 0 0 3px;border:1px solid #ffaa0044;font-family:'Courier New',monospace;border-right:none}
.ranked-rank{font-size:9px;letter-spacing:3px;color:#ffaa0088;margin-bottom:4px}
.ranked-points{font-size:22px;font-weight:900;color:#ffaa00;letter-spacing:4px}
.ranked-change{font-size:10px;letter-spacing:2px;color:#00ff88}

/* Dynamic voice announcement overlay */
#voiceAnnounce{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:23;text-align:center;display:none}
.va-text{font-size:20px;font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 20px #fff,0 0 40px #00ff8888;animation:vaAnim 2.2s ease-out forwards}
@keyframes vaAnim{0%{opacity:0;transform:scale(.8) translateY(-10px)}12%{opacity:1;transform:scale(1.02) translateY(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

/* Tactical compass */
#compass{position:fixed;top:14px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:16;font-family:'Courier New',monospace;display:none}
.compass-bar{font-size:11px;letter-spacing:4px;color:#ffffff88;text-shadow:0 0 8px #00ff8866}
.compass-dir{color:#00ff88;font-weight:700}

/* Smoke/fire/weather overlay */
#weatherOverlay{position:fixed;inset:0;pointer-events:none;z-index:9;display:none;mix-blend-mode:screen}

/* ═══ ADMIN / DEV PANEL ═══ */
#adminPanel{position:fixed;inset:0;background:rgba(0,2,8,.97);display:none;z-index:999;pointer-events:all;font-family:'Courier New',monospace;overflow:hidden}
#adminPanel.open{display:block}

/* Admin panel animated background */
.admin-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.admin-grid-line{position:absolute;background:linear-gradient(transparent,#00ff8806,transparent);animation:gridScroll 4s linear infinite}
@keyframes gridScroll{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}

/* Admin header */
.admin-header{position:relative;padding:16px 24px;border-bottom:1px solid #00ff8822;display:flex;align-items:center;justify-content:space-between;background:rgba(0,255,136,.03)}
.admin-logo{display:flex;align-items:center;gap:14px}
.admin-logo-icon{width:44px;height:44px;border:1px solid #00ff8844;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,255,136,.06);box-shadow:0 0 12px #00ff8822;animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{box-shadow:0 0 12px #00ff8822}50%{box-shadow:0 0 24px #00ff8844}}
.admin-logo-text{font-size:18px;font-weight:900;letter-spacing:8px;color:#00ff88;text-shadow:0 0 20px #00ff8888}
.admin-logo-sub{font-size:8px;letter-spacing:5px;color:#00ff8866;margin-top:2px}
.admin-status{display:flex;align-items:center;gap:20px}
.admin-badge{padding:4px 12px;border-radius:2px;font-size:8px;letter-spacing:3px;font-weight:700;border:1px solid}
.admin-badge.level-dev{color:#ff00ff;border-color:#ff00ff44;background:#ff00ff08;animation:badgePulse 2s ease-in-out infinite}
.admin-badge.level-admin{color:#ffaa00;border-color:#ffaa0044;background:#ffaa0008}
@keyframes badgePulse{0%,100%{box-shadow:0 0 8px #ff00ff22}50%{box-shadow:0 0 16px #ff00ff44}}
.admin-clock{font-size:10px;letter-spacing:3px;color:#00ff8888}
.admin-close{background:rgba(255,0,0,.08);border:1px solid #ff000044;color:#ff4444;cursor:pointer;font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;padding:7px 16px;border-radius:2px;transition:all .2s}
.admin-close:hover{background:#ff000022;border-color:#ff4444}

/* Admin tabs */
.admin-tabs{display:flex;padding:0 24px;border-bottom:1px solid #00ff8811;background:rgba(0,0,0,.3);overflow-x:auto}
.admin-tab{padding:11px 20px;font-size:9px;letter-spacing:3px;color:#ffffff33;cursor:pointer;border:none;background:none;font-family:inherit;transition:all .2s;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.admin-tab:hover{color:#ffffff88}
.admin-tab.active{color:#00ff88;border-bottom-color:#00ff88;background:rgba(0,255,136,.04)}
.admin-tab-icon{font-size:12px}

/* Admin body */
.admin-body{display:flex;height:calc(100vh - 120px);overflow:hidden}
.admin-sidebar{width:200px;border-right:1px solid #00ff8811;padding:16px;overflow-y:auto;flex-shrink:0}
.admin-main{flex:1;padding:20px 24px;overflow-y:auto}
.admin-logs{width:260px;border-left:1px solid #00ff8811;display:flex;flex-direction:column;flex-shrink:0}

/* Admin sidebar */
.adm-section-title{font-size:7px;letter-spacing:4px;color:#00ff8855;margin:14px 0 6px}
.adm-quick-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #ffffff08;border-radius:3px;cursor:pointer;background:none;font-family:inherit;color:#ffffff66;font-size:9px;letter-spacing:2px;margin-bottom:4px;width:100%;transition:all .18s;text-align:left}
.adm-quick-btn:hover{border-color:#00ff8844;color:#00ff88;background:#00ff8808}
.adm-quick-btn.danger{color:#ff444466}
.adm-quick-btn.danger:hover{border-color:#ff444466;color:#ff4444;background:#ff444408}
.adm-quick-btn.active{border-color:#00ff88;color:#00ff88;background:#00ff8811}
.adm-quick-btn .qb-icon{font-size:14px;width:18px;text-align:center}
.adm-quick-btn .qb-key{margin-left:auto;font-size:7px;color:#ffffff22;background:#ffffff08;padding:1px 4px;border-radius:1px}

/* Admin control card */
.adm-card{background:rgba(255,255,255,.02);border:1px solid #00ff8811;border-radius:4px;padding:16px;margin-bottom:14px}
.adm-card-title{font-size:9px;letter-spacing:4px;color:#00ff8888;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.adm-card-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#00ff8822,transparent)}
.adm-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff06}
.adm-row:last-child{border-bottom:none}
.adm-label{font-size:10px;letter-spacing:2px;color:#ffffff88}
.adm-sub{font-size:8px;color:#ffffff33;letter-spacing:1px;margin-top:2px}
.adm-toggle{width:42px;height:22px;border-radius:11px;background:#ffffff15;border:1px solid #ffffff22;cursor:pointer;position:relative;transition:all .25s;flex-shrink:0}
.adm-toggle.on{background:linear-gradient(90deg,#00cc66,#00ff88);border-color:#00ff88;box-shadow:0 0 8px #00ff8844}
.adm-toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .25s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.adm-toggle.on::after{left:22px}
.adm-slider-wrap{display:flex;align-items:center;gap:10px}
.adm-slider{width:120px;accent-color:#00ff88;cursor:pointer}
.adm-slider-val{font-size:10px;color:#00ff88;min-width:36px;text-align:right;letter-spacing:1px;font-weight:700}
.adm-input{background:#ffffff08;border:1px solid #00ff8833;color:#00ff88;font-family:'Courier New',monospace;font-size:11px;padding:5px 10px;border-radius:2px;width:100px;letter-spacing:2px}
.adm-input:focus{outline:none;border-color:#00ff88;box-shadow:0 0 8px #00ff8822}
.adm-btn{padding:6px 16px;background:transparent;border:1px solid #00ff8844;color:#00ff88;font-family:'Courier New',monospace;font-size:9px;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .2s;white-space:nowrap}
.adm-btn:hover{background:#00ff8811;border-color:#00ff88;box-shadow:0 0 10px #00ff8822}
.adm-btn.red{border-color:#ff444444;color:#ff4444}
.adm-btn.red:hover{background:#ff444411;border-color:#ff4444}
.adm-btn.yellow{border-color:#ffaa0044;color:#ffaa00}
.adm-btn.yellow:hover{background:#ffaa0011;border-color:#ffaa00}
.adm-btn.purple{border-color:#ff00ff44;color:#ff00ff}
.adm-btn.purple:hover{background:#ff00ff11;border-color:#ff00ff}
.adm-btn-group{display:flex;gap:6px;flex-wrap:wrap}

/* Weapon builder */
.adm-weapon-card{background:rgba(0,255,136,.03);border:1px solid #00ff8822;border-radius:3px;padding:12px;margin-bottom:8px}
.adm-weapon-name{font-size:12px;letter-spacing:4px;color:#00ff88;font-weight:700;margin-bottom:10px}
.adm-weapon-stat{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.adm-weapon-stat-label{font-size:8px;letter-spacing:2px;color:#ffffff55;width:80px}
.adm-weapon-stat-bar{flex:1;height:4px;background:#ffffff15;border-radius:2px;overflow:hidden}
.adm-weapon-stat-fill{height:100%;border-radius:2px;transition:width .3s}
.adm-weapon-stat-val{font-size:9px;color:#00ff88;min-width:28px;text-align:right}

/* NPC Spawner grid */
.adm-npc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adm-npc-card{padding:10px;border:1px solid #ffffff15;border-radius:3px;text-align:center;cursor:pointer;transition:all .2s;font-size:8px;letter-spacing:1px;color:#ffffff66}
.adm-npc-card:hover{border-color:#00ff8844;color:#00ff88;background:#00ff8808}
.adm-npc-icon{font-size:24px;margin-bottom:6px}

/* Map control */
.adm-map-mini{width:100%;height:160px;background:#050d05;border:1px solid #00ff8822;border-radius:3px;position:relative;overflow:hidden;margin-bottom:10px;cursor:crosshair}
.adm-map-player{position:absolute;width:8px;height:8px;background:#00ff88;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px #00ff88;transition:all .1s}
.adm-map-grid{position:absolute;inset:0;background-image:linear-gradient(#00ff8808 1px,transparent 1px),linear-gradient(90deg,#00ff8808 1px,transparent 1px);background-size:40px 40px}

/* Admin logs panel */
.admin-logs-header{padding:12px 14px;border-bottom:1px solid #00ff8811;font-size:8px;letter-spacing:4px;color:#00ff8877;display:flex;align-items:center;justify-content:space-between}
.admin-logs-body{flex:1;overflow-y:auto;padding:8px}
.log-entry{font-size:9px;letter-spacing:1px;padding:4px 8px;border-left:2px solid;margin-bottom:3px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.02)}
.log-entry.info{border-color:#00ff8844;color:#00ff8888}
.log-entry.warn{border-color:#ffaa0044;color:#ffaa0088}
.log-entry.error{border-color:#ff444444;color:#ff444488}
.log-entry.action{border-color:#4488ff44;color:#4488ff88}
.log-entry.system{border-color:#ff00ff44;color:#ff00ff88}
.log-time{color:#ffffff33;margin-right:6px}
.admin-logs-clear{background:none;border:1px solid #ffffff18;color:#ffffff44;font-family:inherit;font-size:8px;letter-spacing:2px;cursor:pointer;padding:3px 8px;border-radius:2px;transition:all .2s}
.admin-logs-clear:hover{border-color:#ff4444;color:#ff4444}

/* Special effect buttons */
.adm-fx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adm-fx-btn{padding:12px 8px;border:1px solid #00ff8822;border-radius:4px;background:rgba(0,255,136,.03);cursor:pointer;font-family:inherit;color:#00ff88;font-size:8px;letter-spacing:2px;text-align:center;transition:all .22s}
.adm-fx-btn:hover{border-color:#00ff88;background:#00ff8811;transform:translateY(-2px);box-shadow:0 6px 16px #00ff8822}
.adm-fx-btn:active{transform:translateY(0)}
.adm-fx-icon{font-size:20px;display:block;margin-bottom:6px}
.adm-fx-btn.red-fx{border-color:#ff444422;color:#ff4444}
.adm-fx-btn.red-fx:hover{border-color:#ff4444;background:#ff444411;box-shadow:0 6px 16px #ff444422}
.adm-fx-btn.yellow-fx{border-color:#ffaa0022;color:#ffaa00}
.adm-fx-btn.yellow-fx:hover{border-color:#ffaa00;background:#ffaa0011;box-shadow:0 6px 16px #ffaa0022}
.adm-fx-btn.purple-fx{border-color:#ff00ff22;color:#ff00ff}
.adm-fx-btn.purple-fx:hover{border-color:#ff00ff;background:#ff00ff11;box-shadow:0 6px 16px #ff00ff22}

/* Holographic scanner effect */
.adm-scanner{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00ff88,transparent);animation:scannerMove 3s ease-in-out infinite;opacity:.4}
@keyframes scannerMove{0%,100%{transform:translateY(0)}50%{transform:translateY(-200px)}}

/* Permission rank display */
.adm-rank-card{padding:12px;border:1px solid;border-radius:4px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.adm-rank-card.dev{border-color:#ff00ff44;background:#ff00ff06}
.adm-rank-card.admin{border-color:#ffaa0044;background:#ffaa0006}
.adm-rank-card.mod{border-color:#4488ff44;background:#4488ff06}
.adm-rank-icon{font-size:22px}
.adm-rank-name{font-size:11px;letter-spacing:3px;font-weight:700}
.adm-rank-perms{font-size:8px;letter-spacing:1px;color:#ffffff44;margin-top:2px}
.adm-rank-active{font-size:7px;letter-spacing:2px;padding:2px 6px;border-radius:2px}

/* Floating particles background */
@keyframes floatParticle{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:.4}90%{opacity:.2}100%{transform:translateY(-20px) rotate(720deg);opacity:0}}
.admin-particle{position:absolute;border-radius:50%;pointer-events:none;animation:floatParticle linear infinite}

/* Teleport grid */
.adm-tp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.adm-tp-btn{padding:8px 4px;border:1px solid #ffffff15;border-radius:3px;cursor:pointer;background:none;font-family:inherit;color:#ffffff66;font-size:8px;letter-spacing:1px;text-align:center;transition:all .2s}
.adm-tp-btn:hover{border-color:#00ff8866;color:#00ff88;background:#00ff8808}

/* Experimental weapon forge */
.adm-forge{background:linear-gradient(135deg,rgba(255,0,255,.04),rgba(0,255,136,.03));border:1px solid #ff00ff22;border-radius:6px;padding:18px;margin-bottom:14px}
.adm-forge-title{font-size:12px;letter-spacing:5px;color:#ff00ff;margin-bottom:14px;text-align:center;text-shadow:0 0 20px #ff00ff88}
.adm-forge-input{background:#ffffff06;border:1px solid #ff00ff22;color:#ff00ff;font-family:inherit;padding:7px 12px;border-radius:2px;width:100%;letter-spacing:2px;font-size:10px;margin-bottom:8px}
.adm-forge-input:focus{outline:none;border-color:#ff00ff}

/* Kill feed in admin */
.adm-live-kf{max-height:160px;overflow-y:auto}
.adm-kf-item{font-size:9px;letter-spacing:1px;color:#ffffff66;padding:3px 6px;border-bottom:1px solid #ffffff06}
.adm-kf-item .kf-name{color:#fff}
.adm-kf-item .kf-victim{color:#ff4444}
.adm-kf-item .kf-weapon{color:#ffaa00}

/* Admin panel scrollbar */
.admin-body *::-webkit-scrollbar{width:3px}
.admin-body *::-webkit-scrollbar-track{background:#00ff8806}
.admin-body *::-webkit-scrollbar-thumb{background:#00ff8833;border-radius:2px}

/* Cinematic black bars */
#cinematicBars{position:fixed;inset:0;pointer-events:none;z-index:95;display:none}
.cin-bar{position:absolute;left:0;right:0;height:80px;background:#000}
.cin-bar.top{top:0}
.cin-bar.bot{bottom:0}

/* Mode announcement splash */
#modeSplash{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:88;pointer-events:none}
#modeSplash.show{display:flex;animation:splashIn .4s ease-out}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
.splash-content{text-align:center}
.splash-mode{font-size:48px;font-weight:900;letter-spacing:12px;color:#fff;text-shadow:0 0 60px #00ff88;margin-bottom:8px}
.splash-sub{font-size:12px;letter-spacing:8px;color:#00ff8888}


</head>
<body>
<!-- LOADING SCREEN -->
<div id="loadScreen">
  <div class="load-title">VORTEX</div>
  <div class="load-sub">TACTICAL WARFARE V4 — WAR MAP CARREGANDO</div>
  <div class="load-bar-wrap"><div class="load-bar-fill" id="loadBar"></div></div>
  <div class="load-status" id="loadStatus">INICIALIZANDO...</div>
</div>

<canvas id="gameCanvas"></canvas>

<!-- CROSSHAIR -->
<div id="crosshair">
  <div class="ch-line" id="ch-t"></div>
  <div class="ch-line" id="ch-b"></div>
  <div class="ch-line" id="ch-l"></div>
  <div class="ch-line" id="ch-r"></div>
  <div class="ch-line" id="ch-dot"></div>
</div>

<!-- SCOPE -->
<div id="scopeOverlay">
  <div id="scopeRing">
    <div class="scope-line" id="sl-h"></div>
    <div class="scope-line" id="sl-v"></div>
  </div>
</div>

<!-- MUZZLE -->
<div id="muzzleFlash"></div>

<!-- EFFECTS -->
<div id="dmgVignette"></div>
<div id="lowHpVignette"></div>
<div id="screenFlash"></div>

<!-- GRENADE WARN -->
<div id="grenWarn">⚠ GRANADA EM VOO</div>

<!-- INTERACT PROMPT -->
<div id="interactPrompt">
  <div class="interact-key">E</div>
  <span class="interact-label" id="interactLabel">INTERAGIR</span>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-top">
    <div class="score-wrap">
      <div class="score-item"><span class="score-num" id="killsNum">0</span><span class="score-label">KILLS</span></div>
      <div class="score-item"><span class="score-num" id="deathsNum">0</span><span class="score-label">MORTES</span></div>
    </div>
    <div style="text-align:center">
      <div class="round-timer" id="roundTimer">05:00</div>
      <div class="round-mode" id="roundMode">MATA-MATA</div>
    </div>
    <div class="score-wrap">
      <div class="score-item"><span class="score-num" id="pingVal">--</span><span class="score-label">PING</span></div>
      <div class="score-item"><span class="score-num" id="playersOnline">1</span><span class="score-label">ONLINE</span></div>
    </div>
  </div>
  <div class="hud-bottom">
    <div class="health-wrap">
      <div class="hp-label">VIDA</div>
      <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
      <div class="hp-num" id="hpNum">100</div>
      <div class="armor-bar"><div class="armor-fill" id="armorFill" style="width:75%"></div></div>
    </div>
    <div class="ammo-wrap">
      <div class="ammo-label" id="ammoLabel">RIFLE DE ASSALTO</div>
      <div><span class="ammo-main" id="ammoMain">30</span><span class="ammo-sep">/</span><span class="ammo-res" id="ammoRes">90</span></div>
      <div class="weapon-name" id="weaponNameHUD">M4A1-S</div>
    </div>
  </div>
</div>

<!-- MINIMAP -->
<div id="minimapWrap">
  <canvas id="minimapCanvas" width="160" height="160"></canvas>
  <div class="mm-label">MINIMAPA</div>
</div>

<!-- WEAPON BAR -->
<div id="weaponBar" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;z-index:15">
  <div class="w-slot active" id="ws0"><div class="w-icon">🔫</div><div>M4A1</div></div>
  <div class="w-slot" id="ws1"><div class="w-icon">🎯</div><div>AWP</div></div>
  <div class="w-slot" id="ws2"><div class="w-icon">💥</div><div>SPAS</div></div>
  <div class="w-slot" id="ws3"><div class="w-icon">🔧</div><div>DESERT</div></div>
  <div class="w-slot" id="ws4"><div class="w-icon">💣</div><div>RPG</div></div>
  <div class="w-slot" id="ws5" style="border-color:#ff00ff44;color:#ff00ff66;font-size:7px"><div class="w-icon">🔒</div><div>SECRET</div></div>
</div>

<!-- KILL FEED -->
<div id="killFeed"></div>

<!-- CHAT -->
<div id="chatBox"></div>

<!-- VEHICLE HUD -->
<div id="vehicleHUD">
  <div class="vhud-speed" id="vhudSpeed">0</div>
  <div class="vhud-label">KM/H</div>
  <div class="vhud-name" id="vhudName">JEEP MILITAR</div>
</div>

<!-- ZOMBIE MODE -->
<div id="zombieWave">🧟 WAVE 1 — 10 ZUMBIS</div>
<div id="zombiePanel">
  <div class="zombie-stat" id="zombieWaveStat">WAVE: 1</div>
  <div class="zombie-stat" id="zombieKillStat">ZUMBIS: 0 / 10</div>
  <div class="zombie-stat" id="zombieAliveCount">RESTANDO: 10</div>
</div>
<div id="downedScreen">
  <div class="downed-title">☠ VOCÊ CAIU ☠</div>
  <div class="downed-hp" id="downedHP">SANGRAMENTO: 100</div>
  <div class="downed-hint">PRESSIONE ESPAÇO PARA ATIRAR COM PISTOLA</div>
  <div class="downed-hint">AGUARDE UM ALIADO PARA REVIVER</div>
</div>
<div id="inventoryPanel">
  <div class="inv-header">
    <div class="inv-title">🎒 INVENTÁRIO — CASA SEGURA</div>
    <button style="background:none;border:none;color:#ff4444;cursor:pointer;font-size:16px;font-family:inherit" onclick="closeInventory()">✕</button>
  </div>
  <div style="padding:0 14px;font-size:9px;letter-spacing:3px;color:#00ff8877;margin-bottom:4px">CLIQUE EM UM ITEM PARA EQUIPAR / USAR</div>
  <div class="inv-grid" id="inventoryGrid"></div>
</div>
<!-- RESPAWN -->

<div id="respawnScreen">
  <div class="respawn-title">VOCÊ FOI ELIMINADO</div>
  <div class="respawn-num" id="respawnNum">5</div>
  <div style="font-size:10px;letter-spacing:4px;color:#ffffff44">RENASCENDO...</div>
</div>

<!-- MOD MENU -->
<div id="modMenu">
  <div class="mm-header">
    <div class="mm-title">MOD MENU</div>
    <button class="mm-close" onclick="toggleModMenu()">✕ FECHAR</button>
  </div>
  <div class="mm-tabs">
    <button class="mm-tab active" onclick="setMMTab(this,'combat')">COMBATE</button>
    <button class="mm-tab" onclick="setMMTab(this,'visual')">VISUAL</button>
    <button class="mm-tab" onclick="setMMTab(this,'player')">JOGADOR</button>
    <button class="mm-tab" onclick="setMMTab(this,'misc')">MISC</button>
  </div>
  <div class="mm-content" id="mmContent"></div>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen">
  <div class="ms-inner">
    <div class="ms-title">VORTEX</div>
    <div class="ms-sub">TACTICAL WARFARE V4 — WAR MAP 800x800</div>
    <div class="ms-players"><div class="ms-pl-title">JOGADORES NA SALA</div><div id="msPlayerList"></div></div>
    <button class="ms-btn" onclick="openGameModeSelector()">🎮 SELECIONAR MODO DE JOGO</button>
    <button class="ms-btn" onclick="startGame()">▶ ENTRAR NA PARTIDA (DEATHMATCH)</button>
    <button class="ms-btn" style="border-color:#aa000066;color:#ff4444" onclick="startZombieMode()">🧟 MODO APOCALIPSE ZUMBI</button>
    <button class="ms-btn" style="border-color:#4488ff66;color:#4488ff" onclick="openRoomScreen()">🏠 SALAS PERSONALIZADAS</button>
    <button class="ms-btn" style="border-color:#ffaa0066;color:#ffaa00" onclick="startSandbox()">🔧 MODO SANDBOX</button>
    <button class="ms-btn" style="border-color:#ff00ff66;color:#ff00ff;font-size:9px" onclick="openLoadout()">⚙ CONFIGURAR LOADOUT / PERKS</button>
    <button class="ms-btn sec" onclick="document.querySelector('.controls-panel').style.display=document.querySelector('.controls-panel').style.display==='block'?'none':'block'">CONTROLES</button>
    <div class="controls-panel">
      WASD — MOVER &nbsp;|&nbsp; MOUSE — MIRAR<br>
      CLIQUE ESQ — ATIRAR &nbsp;|&nbsp; CLIQUE DIR — MIRA<br>
      R — RECARREGAR &nbsp;|&nbsp; G — GRANADA<br>
      1-5 — TROCAR ARMA &nbsp;|&nbsp; E — INTERAGIR/ENTRAR CASA<br>
      SHIFT — CORRER &nbsp;|&nbsp; CTRL — AGACHAR<br>
      F — ENTRAR/SAIR VEÍCULO &nbsp;|&nbsp; P — MOD MENU<br>
      TAB — PLACAR &nbsp;|&nbsp; ESC — MENU<br>
      <span style="color:#ff00ff">HOME — PAINEL ADMIN (RESTRITO)</span>
    </div>
  </div>
</div>

<!-- ROOM SCREEN -->
<div id="roomScreen">
  <div class="room-inner">
    <div class="room-title">VORTEX</div>
    <div class="room-sub">SALAS PERSONALIZADAS</div>
    <div class="room-tabs">
      <button class="room-tab active" onclick="setRoomTab(this,'join')">ENTRAR EM SALA</button>
      <button class="room-tab" onclick="setRoomTab(this,'create')">CRIAR SALA</button>
    </div>
    <div id="roomJoinPanel">
      <div style="font-size:9px;letter-spacing:3px;color:#ffffff44;margin-bottom:8px">SALAS DISPONÍVEIS</div>
      <div class="room-list" id="roomList"><div style="padding:12px;color:#ffffff33;font-size:10px;letter-spacing:2px">Carregando salas...</div></div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input class="room-input" id="roomCodeInput" placeholder="CÓDIGO DA SALA" style="margin:0;flex:1">
        <button class="ms-btn" style="width:auto;padding:7px 14px;margin:0;font-size:10px" onclick="joinRoomByCode()">ENTRAR</button>
      </div>
    </div>
    <div id="roomCreatePanel" style="display:none">
      <div class="room-create">
        <div class="room-create-title">CONFIGURAR SALA</div>
        <input class="room-input" id="roomNameInput" placeholder="NOME DA SALA (ex: GUERRA_BR)">
        <div style="font-size:9px;letter-spacing:3px;color:#ffffff44;margin-bottom:6px">MODO DE JOGO</div>
        <div class="room-mode-sel">
          <button class="room-mode-btn sel" id="rm_dm" onclick="selRoomMode('dm',this)">DEATHMATCH</button>
          <button class="room-mode-btn" id="rm_tdm" onclick="selRoomMode('tdm',this)">TIME vs TIME</button>
          <button class="room-mode-btn" id="rm_ctf" onclick="selRoomMode('ctf',this)">DOMINATION</button>
        </div>
        <div style="font-size:9px;letter-spacing:3px;color:#ffffff44;margin-bottom:6px" id="teamSelLabel" style="display:none">SEU TIME</div>
        <div class="room-team-sel" id="teamSelWrap" style="display:none">
          <button class="room-team-btn blue-sel" id="tb_blue" onclick="selTeam('blue',this)">🔵 TIME AZUL</button>
          <button class="room-team-btn" id="tb_red" onclick="selTeam('red',this)">🔴 TIME VERMELHO</button>
        </div>
        <input class="room-input" id="roomPassInput" placeholder="SENHA (opcional)">
        <button class="ms-btn" style="width:100%;margin:0;font-size:11px" onclick="createRoom()">▶ CRIAR E ENTRAR</button>
      </div>
    </div>
    <button class="ms-btn sec" style="width:100%;margin-top:4px" onclick="closeRoomScreen()">✕ VOLTAR</button>
  </div>
</div>

<!-- TEAM BAR -->
<div id="teamBar" style="display:none">
  <span class="team-score blue" id="teamBlueScore">0</span>
  <span class="team-sep">vs</span>
  <span class="team-score red" id="teamRedScore">0</span>
  <span style="font-size:9px;letter-spacing:3px;color:#ffffff44;margin-left:8px" id="teamModeLabel">TDM</span>
</div>

<!-- STAT PANEL -->
<div id="statPanel" style="display:block;position:fixed;bottom:160px;right:16px;pointer-events:none;z-index:15;text-align:right">
  <div class="stat-line">DMG TOTAL <span id="totalDmgVal">0</span></div>
  <div class="stat-line">HEADSHOTS <span id="headshotVal">0</span></div>
  <div class="stat-line">PRECISÃO <span id="accuracyVal">--%</span></div>
</div>

<!-- INSIDE LABEL -->
<div id="insideLabel">INTERIOR</div>

<!-- TURRET HUD -->
<div id="turretHUD">
  <div id="turretCrosshair"></div>
  <div class="turret-label">⚙ TORRETA — [CLICK] ATIRAR · [E] SAIR</div>
</div>

<!-- SECRET WEAPON PULSE -->
<div id="secretWeaponPulse">
  <div class="sw-label">⬛ MINIGUN-X · ARMA SECRETA ATIVA ⬛</div>
</div>

<!-- SPEED LINES (car effect) -->
<div id="speedLines" id="speedLines"></div>

<!-- SANDBOX PANEL -->
<div id="sandboxPanel">
  <div class="sb-header">
    <div class="sb-title">🔧 MODO SANDBOX</div>
    <button class="sb-close" onclick="toggleSandbox()">✕ FECHAR</button>
  </div>

  <div class="sb-section">🚗 SPAWNAR VEÍCULO</div>
  <div class="sb-grid">
    <button class="sb-btn" onclick="sbSpawnVehicle('jeep')">🚙 Jeep Militar</button>
    <button class="sb-btn" onclick="sbSpawnVehicle('tank')">🛡️ Tanque T-90</button>
    <button class="sb-btn" onclick="sbSpawnVehicle('truck')">🚚 Caminhão</button>
    <button class="sb-btn red" onclick="sbRemoveAllVehicles()">✕ Remover Todos</button>
  </div>

  <div class="sb-section">🎯 SPAWNAR INIMIGO</div>
  <div class="sb-grid">
    <button class="sb-btn red" onclick="sbSpawnEnemy(1)">+ 1 Inimigo</button>
    <button class="sb-btn red" onclick="sbSpawnEnemy(5)">+ 5 Inimigos</button>
    <button class="sb-btn red" onclick="sbSpawnEnemy(10)">+ 10 Inimigos</button>
    <button class="sb-btn" onclick="sbClearEnemies()">✕ Limpar Inimigos</button>
  </div>

  <div class="sb-section">💣 EFEITOS & AÇÕES</div>
  <div class="sb-grid">
    <button class="sb-btn blue" onclick="sbExplosion()">💥 Explosão Aqui</button>
    <button class="sb-btn blue" onclick="sbNuke()">☢️ Nuke (Área)</button>
    <button class="sb-btn green" onclick="sbRefillAll()">❤️ Vida + Munição</button>
    <button class="sb-btn green" onclick="sbToggleFlying()">✈️ Voar ON/OFF</button>
  </div>

  <div class="sb-section">⚙️ MUNDO</div>
  <div class="sb-grid">
    <button class="sb-btn" onclick="sbDayNight(true)">☀️ Dia</button>
    <button class="sb-btn" onclick="sbDayNight(false)">🌙 Noite</button>
    <button class="sb-btn blue" onclick="sbToggleGravity()">🌀 Gravidade x0</button>
    <button class="sb-btn" onclick="sbSlowMo()">⏱️ Slow Motion</button>
  </div>

  <div class="sb-section">📍 TELEPORTE</div>
  <div class="sb-grid">
    <button class="sb-btn" onclick="sbTeleport(0,0)">📍 Centro (0,0)</button>
    <button class="sb-btn" onclick="sbTeleport(140,130)">🚢 Porto</button>
    <button class="sb-btn" onclick="sbTeleport(0,-80)">⚔️ Base Aliada</button>
    <button class="sb-btn" onclick="sbTeleport(100,0)">✈️ Aeroporto</button>
    <button class="sb-btn" onclick="sbTeleport(-80,-30)">🔬 Lab Secreto</button>
    <button class="sb-btn" onclick="sbTeleport(180,180)">💀 Base Inimiga</button>
    <button class="sb-btn" onclick="sbTeleport(120,100)">🏚️ Cidade Destruída</button>
    <button class="sb-btn" onclick="sbTeleport(-150,60)">🏘️ Favela West</button>
  </div>

    const bar2=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,.2,8),darkMetal);bar2.rotation.x=Math.PI/2;bar2.position.set(.132,-.10,-.47);weapGroup.add(bar2);
    // Guardamão madeira
    const fore=new THREE.Mesh(new THREE.BoxGeometry(.075,.06,.16),shotMat);fore.position.set(.14,-.10,-.42);weapGroup.add(fore);
    // Coronha dobrada
    const stockL=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.15,6),darkMetal);stockL.rotation.x=Math.PI/2*0.3;stockL.position.set(.155,-.085,-.07);weapGroup.add(stockL);
    const stockR=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.15,6),darkMetal);stockR.rotation.x=Math.PI/2*0.3;stockR.position.set(.125,-.085,-.07);weapGroup.add(stockR);
    // Carregador tubular

    const grip=new THREE.Mesh(new THREE.BoxGeometry(.04,.11,.05),gripMat);grip.position.set(.14,-.185,-.22);weapGroup.add(grip);

  }else if(idx===3){ // Desert Eagle — Pistola
    const eagleMat=matTex(55,50,40,0.45,0.92);
    const body=new THREE.Mesh(new THREE.BoxGeometry(.06,.095,.22),eagleMat);body.position.set(.14,-.10,-.25);weapGroup.add(body);
    // Slide
    const slide=new THREE.Mesh(new THREE.BoxGeometry(.055,.065,.20),darkMetal);slide.position.set(.14,-.08,-.25);weapGroup.add(slide);
    // Cano
    const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.14,8),darkMetal);barrel.rotation.x=Math.PI/2;barrel.position.set(.14,-.10,-.37);weapGroup.add(barrel);
    // Guarda-gatilho
    const guard=new THREE.Mesh(new THREE.TorusGeometry(.025,.004,6,8,Math.PI),darkMetal);guard.rotation.x=Math.PI/2;guard.position.set(.14,-.148,-.25);weapGroup.add(guard);
    // Grip
    const grip=new THREE.Mesh(new THREE.BoxGeometry(.05,.12,.06),gripMat);grip.position.set(.14,-.183,-.19);weapGroup.add(grip);
    // Mira
    const sightF=new THREE.Mesh(new THREE.BoxGeometry(.006,.016,.006),darkMetal);sightF.position.set(.14,-.052,-.34);weapGroup.add(sightF);
    const sightB=new THREE.Mesh(new THREE.BoxGeometry(.025,.012,.006),darkMetal);sightB.position.set(.14,-.052,-.16);weapGroup.add(sightB);

  }else if(idx===5){ // MINIGUN-X — Arma Secreta
    const mg1=matTex(80,0,80,0.3,0.95);
    const mg2=matTex(40,0,60,0.4,0.9);
    // Corpo central
    const body=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.38,8),mg1);body.rotation.x=Math.PI/2;body.position.set(.14,-.09,-.32);weapGroup.add(body);
    // 6 canos rotativos
    for(let i=0;i<6;i++){
      const a=(i/6)*Math.PI*2;
      const r=0.038;
      const brl=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.38,6),mg2);
      brl.rotation.x=Math.PI/2;
      brl.position.set(.14+Math.cos(a)*r,-.09+Math.sin(a)*r,-.32);
      brl.userData.mgBarrel=true;
      brl.userData.mgAngleOffset=a;
      weapGroup.add(brl);
    }
    // Caixa de munição
    const box=new THREE.Mesh(new THREE.BoxGeometry(.06,.1,.06),mg2);box.position.set(.14,-.17,-.28);weapGroup.add(box);
    // Punho
    const grip=new THREE.Mesh(new THREE.BoxGeometry(.04,.1,.05),new THREE.MeshStandardMaterial({color:0x220022,roughness:.9,metalness:.1}));
    grip.position.set(.14,-.18,-.22);weapGroup.add(grip);
    // Brilho roxo
    const glow=new THREE.PointLight(0xff00ff,1.5,1.2);glow.position.set(.14,-.09,-.45);weapGroup.add(glow);
  }else{ // RPG-7
    const rpgMat=matTex(52,64,40,0.8,0.5);
    // Tubo principal
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(.038,.038,.54,10),rpgMat);tube.rotation.x=Math.PI/2;tube.position.set(.14,-.09,-.32);weapGroup.add(tube);
    // Bocal traseiro (clapeta)
    const backFlare=new THREE.Mesh(new THREE.CylinderGeometry(.055,.038,.06,10),rpgMat);backFlare.rotation.x=Math.PI/2;backFlare.position.set(.14,-.09,-.06);weapGroup.add(backFlare);
    // Míssil saindo na frente
    const rocket=new THREE.Mesh(new THREE.CylinderGeometry(.032,.032,.25,8),matTex(80,65,25,0.7,0.6));rocket.rotation.x=Math.PI/2;rocket.position.set(.14,-.09,-.65);weapGroup.add(rocket);
    // Ponta ogiva
    const tip=new THREE.Mesh(new THREE.ConeGeometry(.032,.1,8),matTex(100,80,30,0.6,0.7));tip.rotation.x=-Math.PI/2;tip.position.set(.14,-.09,-.81);weapGroup.add(tip);
    // Alça de mira
    const sight=new THREE.Mesh(new THREE.BoxGeometry(.006,.06,.04),darkMetal);sight.position.set(.14,-.03,-.28);weapGroup.add(sight);
    // Punho traseiro
    const grip=new THREE.Mesh(new THREE.BoxGeometry(.04,.1,.05),gripMat);grip.position.set(.14,-.175,-.18);weapGroup.add(grip);
    // Punho frontal
    const grip2=new THREE.Mesh(new THREE.BoxGeometry(.04,.09,.05),gripMat);grip2.position.set(.14,-.165,-.40);weapGroup.add(grip2);
    // Aletas estabilizadoras
    for(let a=0;a<4;a++){
      const fin=new THREE.Mesh(new THREE.BoxGeometry(a%2===0?.001:.06,.06,a%2===0?.06:.001),matTex(70,55,20,0.7,0.5));
      fin.position.set(.14+(a%2===0?.0:.04*(a<2?1:-1)),-.09+.03,-.08);weapGroup.add(fin);
    }
  }
}

function setLoad(pct,msg){
  const bar=document.getElementById('loadBar');
  const status=document.getElementById('loadStatus');
  if(bar)bar.style.width=pct+'%';
  if(status)status.textContent=msg;
}
function loadStep(fn,pct,msg){
  return new Promise(res=>setTimeout(()=>{setLoad(pct,msg);fn();res()},20));
}

// MAP BUILDER — LARGE MAP 400x400
// ═══════════════════════════════════════════════
const collidables=[];
const interactables=[];

function mat(color,emit=0){
  const c=(color===undefined||color===null)?0x222222:color;
  return new THREE.MeshLambertMaterial({color:c,emissive:emit?c:0,emissiveIntensity:emit?0.3:0});
}

function addBox(x,y,z,w,h,d,color,castShadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
  m.position.set(x,y,z);
  m.castShadow=castShadow;
  m.receiveShadow=true;
  scene.add(m);
  return m;
}

function registerWall(x,z,w,d,offset=0){
  collidables.push({min:{x:x-w/2+offset,z:z-d/2+offset},max:{x:x+w/2-offset,z:z+d/2-offset}});
}

function buildBuilding(x,z,w,h,d,color=0x2a3050){
  const mesh=addBox(x,h/2,z,w,h,d,color);
  registerWall(x,z,w,d);
  // windows
  const sides=[[0,z+d/2+.01,w*.6,h*.6,0],[0,z-d/2-.01,w*.6,h*.6,Math.PI],[w/2+.01,0,d*.6,h*.6,Math.PI/2],[-w/2-.01,0,d*.6,h*.6,-Math.PI/2]];
  sides.forEach(([ox,oz,ww,hh,ry])=>{
    if(Math.random()>.3){
      const wm=new THREE.Mesh(new THREE.PlaneGeometry(Math.min(ww*.4,3),Math.min(hh*.5,2.5)),new THREE.MeshLambertMaterial({color:0x2244aa,emissive:0x112244,transparent:true,opacity:.75}));
      wm.position.set(x+ox,h*.35+Math.random()*h*.3,z+oz);
      wm.rotation.y=ry;
      scene.add(wm);
    }
  });
  return mesh;
}

function addDoor(x,y,z,ry,label='PORTA'){
  const doorGroup=new THREE.Group();
  doorGroup.position.set(x,y,z);
  doorGroup.rotation.y=ry;
  const doorMesh=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.4,.08),new THREE.MeshLambertMaterial({color:0x4a3010}));
  doorMesh.position.set(.6,1.2,0);
  doorMesh.castShadow=true;
  doorGroup.add(doorMesh);
  const frame=new THREE.Mesh(new THREE.BoxGeometry(1.3,2.6,.04),new THREE.MeshLambertMaterial({color:0x2a1a00}));
  frame.position.set(.6,1.3,-.06);
  doorGroup.add(frame);
  scene.add(doorGroup);
  const id='door_'+Date.now()+'_'+Math.random();
  doorAnims[id]={group:doorGroup,open:false,angle:0,targetAngle:0,pivot:{x,z},label};
  interactables.push({type:'door',id,x,z,range:2.5,label:'ABRIR '+label,labelClose:'FECHAR '+label});
  return doorGroup;
}

function addVehicle(x,z,type='jeep'){
  const g=new THREE.Group();
  g.position.set(x,0,z);

  const mBody=new THREE.MeshStandardMaterial({roughness:0.45,metalness:0.7});
  const mGlass=new THREE.MeshStandardMaterial({color:0x335566,roughness:0.05,metalness:0.1,transparent:true,opacity:0.55});
  const mTire=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.95,metalness:0.0});
  const mRim=new THREE.MeshStandardMaterial({color:0x888888,roughness:0.3,metalness:0.85});
  const mInterior=new THREE.MeshStandardMaterial({color:0x1a1510,roughness:0.9,metalness:0.05});
  const mBlack=new THREE.MeshStandardMaterial({color:0x080808,roughness:0.7,metalness:0.3});
  const mLight=new THREE.MeshStandardMaterial({color:0xffffaa,roughness:0.1,metalness:0.0,emissive:0xffffaa,emissiveIntensity:0.5});

  // Configuração por tipo
  const cfg={
    jeep:   {color:0x3a5a2a,W:2.2,H:1.0,L:4.2,wheelR:.38,wheelH:4,axles:[[-1.35,0],[1.35,0]],cab:true,turret:false},
    tank:   {color:0x4a5a2a,W:3.2,H:1.0,L:5.8,wheelR:.50,wheelH:6,axles:[[-2.0,0],[-0.7,0],[0.7,0],[2.0,0]],cab:false,turret:true},
    truck:  {color:0x2a2a3a,W:2.4,H:1.3,L:6.0,wheelR:.50,wheelH:4,axles:[[-2.2,0],[2.0,0]],cab:true,turret:false},
    humvee: {color:0x4a4a35,W:2.3,H:1.1,L:4.6,wheelR:.42,wheelH:4,axles:[[-1.5,0],[1.5,0]],cab:true,turret:true},
    apc:    {color:0x3a4a3a,W:2.8,H:1.4,L:5.0,wheelR:.46,wheelH:6,axles:[[-1.8,0],[0,0],[1.8,0]],cab:false,turret:true},
  };
  const c=cfg[type]||cfg.jeep;
  mBody.color.setHex(c.color);

  const bodyH=c.H;
  const baseY=c.wheelR*0.9;

  // ── CASCO / HULL ──
  const hull=new THREE.Mesh(new THREE.BoxGeometry(c.W,bodyH,c.L),mBody);
  hull.position.y=baseY+bodyH/2; hull.castShadow=true; hull.receiveShadow=true; g.add(hull);

  // Chanfros nos cantos do hull (detail boxes)
  [[c.W/2,0,0],[-(c.W/2),0,0],[0,0,c.L/2],[0,0,-(c.L/2)]].forEach(([dx,dy,dz],i)=>{
    const bevel=new THREE.Mesh(new THREE.BoxGeometry(
      i<2?.04:c.W*.9, bodyH*.98, i<2?c.L*.95:.04
    ),mBody);
    bevel.position.set(dx,baseY+bodyH/2,dz); g.add(bevel);
  });

  if(type==='tank'||type==='apc'){
    // Blindagem lateral
    [-1,1].forEach(side=>{
      const skirt=new THREE.Mesh(new THREE.BoxGeometry(.08,bodyH*.6,c.L*.95),mBody);
      skirt.position.set(side*(c.W/2+.04),baseY+bodyH*.3,0); g.add(skirt);
    });
    // Torreta giratória
    const turretBase=new THREE.Mesh(new THREE.CylinderGeometry(.9,.95,.55,14),mBody);
    turretBase.position.y=baseY+bodyH+.27; g.add(turretBase);
    const turretBody=new THREE.Mesh(new THREE.BoxGeometry(1.4,.5,1.8),mBody);
    turretBody.position.y=baseY+bodyH+.55; g.add(turretBody);
    const cannon=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,type==='tank'?3.2:2.0,10),mBlack);
    cannon.rotation.x=Math.PI/2; cannon.position.set(0,baseY+bodyH+.55,-(type==='tank'?2.2:1.5)); g.add(cannon);
    const cannonMount=new THREE.Mesh(new THREE.BoxGeometry(.22,.18,.4),mBlack);
    cannonMount.position.set(0,baseY+bodyH+.6,-.6); g.add(cannonMount);
  }

  if(c.cab){
    // Cabine com teto
    const cabW=type==='truck'?c.W:c.W*.9;
    const cabL=type==='truck'?2.2:c.L*.42;
    const cabZ=type==='truck'?c.L*.25:0;
    const cab=new THREE.Mesh(new THREE.BoxGeometry(cabW,bodyH*.75,cabL),mBody);
    cab.position.set(0,baseY+bodyH+bodyH*.375,cabZ); g.add(cab);
    // Teto
    const roof=new THREE.Mesh(new THREE.BoxGeometry(cabW*.92,bodyH*.12,cabL*.9),mBody);
    roof.position.set(0,baseY+bodyH*1.82,cabZ); g.add(roof);
    // Para-brisa
    const windAngle=-.35;
    const wind=new THREE.Mesh(new THREE.PlaneGeometry(cabW*.82,bodyH*.65),mGlass);
    wind.rotation.x=windAngle; wind.position.set(0,baseY+bodyH*1.3,cabZ+(cabL*.5-.1)); g.add(wind);
    const windR=new THREE.Mesh(new THREE.PlaneGeometry(cabW*.82,bodyH*.65),mGlass);
    windR.rotation.x=-windAngle; windR.position.set(0,baseY+bodyH*1.3,cabZ-(cabL*.5-.1)); g.add(windR);
    // Janelas laterais
    [-1,1].forEach(side=>{
      const win=new THREE.Mesh(new THREE.PlaneGeometry(cabL*.6,bodyH*.55),mGlass);
      win.rotation.y=Math.PI/2; win.position.set(side*(cabW*.5+.01),baseY+bodyH*1.3,cabZ); g.add(win);
    });
    // Portas (painéis laterais)
    [-1,1].forEach(side=>{
      const door=new THREE.Mesh(new THREE.BoxGeometry(.04,bodyH*.9,cabL*.82),mBody);
      door.position.set(side*(cabW*.5+.02),baseY+bodyH*.95,cabZ); g.add(door);
      // Maçaneta
      const handle=new THREE.Mesh(new THREE.BoxGeometry(.04,.04,.18),mRim);
      handle.position.set(side*(cabW*.5+.04),baseY+bodyH*.85,cabZ+.1); g.add(handle);
    });
  }

  // ── RODAS ULTRA DETALHADAS ──
  c.axles.forEach(([az])=>{
    [-1,1].forEach(side=>{
      const wx=side*(c.W/2+.12);
      // Pneu — marcado para animação de giro
      const tire=new THREE.Mesh(new THREE.TorusGeometry(c.wheelR*.72,c.wheelR*.28,10,c.wheelH),mTire);
      tire.rotation.x=Math.PI/2; tire.position.set(wx,c.wheelR,az); tire.userData.isWheel=true; g.add(tire);
      // Grupo de roda (aro+raios+hub giram juntos)
      const wheelGroup2=new THREE.Group();
      wheelGroup2.position.set(wx,c.wheelR,az);
      wheelGroup2.userData.isWheel=true;
      // Aro
      const rim=new THREE.Mesh(new THREE.CylinderGeometry(c.wheelR*.58,c.wheelR*.58,.08,c.wheelH),mRim);
      rim.rotation.z=Math.PI/2; wheelGroup2.add(rim);
      // Raios (5 raios)
      for(let spoke=0;spoke<5;spoke++){
        const angle=spoke/5*Math.PI*2;
        const sp=new THREE.Mesh(new THREE.BoxGeometry(.03,.03,c.wheelR*.54),mRim);
        sp.rotation.x=Math.PI/2; sp.rotation.z=angle;
        wheelGroup2.add(sp);
      }
      // Centro do aro (hub)
      const hub=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.12,8),mBlack);
      hub.rotation.z=Math.PI/2; wheelGroup2.add(hub);
      // Parafusos do aro
      for(let bolt=0;bolt<5;bolt++){
        const ba=bolt/5*Math.PI*2;
        const boltM=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.14,5),mRim);
        boltM.rotation.z=Math.PI/2;
        boltM.position.set(0,Math.sin(ba)*.18,Math.cos(ba)*.18); wheelGroup2.add(boltM);
      }
      g.add(wheelGroup2);
    });
  });

  // ── FARÓIS / LUZES ──
  [[c.L/2-.15,baseY+bodyH*.6,.04],[c.L/2-.15,baseY+bodyH*.6,-.04]].forEach(([lz,ly,lx_off])=>{
    const headlight=new THREE.Mesh(new THREE.CircleGeometry(.1,10),mLight);
    headlight.rotation.y=Math.PI; headlight.position.set(lx_off,ly,lz); g.add(headlight);
    const hlens=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.06,10),mGlass);
    hlens.rotation.x=Math.PI/2; hlens.position.set(lx_off,ly,lz+.03); g.add(hlens);
  });
  // Lanternas traseiras
  [[-(c.L/2)+.12,baseY+bodyH*.5],[-(c.L/2)+.12,baseY+bodyH*.5]].forEach(([lz,ly],i)=>{
    const tail=new THREE.Mesh(new THREE.CircleGeometry(.08,8),
      new THREE.MeshStandardMaterial({color:0xff2200,emissive:0xff2200,emissiveIntensity:.4,roughness:.1}));
    tail.rotation.y=0; tail.position.set(i===0?.18:-.18,ly,lz); g.add(tail);
  });

  // ── INTERIOR DO CARRO ──
  // Painel / dashboard
  const dash=new THREE.Mesh(new THREE.BoxGeometry(c.W*.7,.1,0.35),mInterior);
  dash.position.set(0,baseY+bodyH*.9,c.type==='truck'?c.L*.35:0.4); g.add(dash);
  // Bancos
  [-1,0].forEach((side,i)=>{
    if(i>0&&type==='truck')return;
    const seat=new THREE.Mesh(new THREE.BoxGeometry(.52,.08,.42),mInterior);
    seat.position.set(side*.28,baseY+bodyH*.4,i===0?.1:.1); g.add(seat);
    const seatBack=new THREE.Mesh(new THREE.BoxGeometry(.52,.45,.06),mInterior);
    seatBack.position.set(side*.28,baseY+bodyH*.64,i===0?-.1:-.1); g.add(seatBack);
  });

  // ── VOLANTE (visível, será referenciado para animação) ──
  const wheelGroup=new THREE.Group();
  const steerRim=new THREE.Mesh(new THREE.TorusGeometry(.2,.025,8,16),mBlack);
  wheelGroup.add(steerRim);
  for(let sp=0;sp<3;sp++){
    const sAngle=sp/3*Math.PI*2;
    const spoke=new THREE.Mesh(new THREE.BoxGeometry(.015,.015,.18),mBlack);
    spoke.rotation.z=sAngle; wheelGroup.add(spoke);
  }
  const hub2=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.04,8),mBlack);
  hub2.rotation.x=Math.PI/2; wheelGroup.add(hub2);
  // Posição do volante dentro do carro
  wheelGroup.position.set(.32,baseY+bodyH*.92,0.38);
  wheelGroup.rotation.x=-Math.PI*.25;
  g.add(wheelGroup);

  // ── ESPELHOS RETROVISORES ──
  [-1,1].forEach(side=>{
    const mirror=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,.025),
      new THREE.MeshStandardMaterial({color:0x888888,roughness:0.1,metalness:.8}));
    mirror.position.set(side*(c.W/2+.14),baseY+bodyH*1.7,c.L*.3); g.add(mirror);
    const mArm=new THREE.Mesh(new THREE.BoxGeometry(.04,.04,.12),mBlack);
    mArm.position.set(side*(c.W/2+.08),baseY+bodyH*1.7,c.L*.3); g.add(mArm);
  });

  // ── ANTENA ──
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(.006,.004,.8,5),mBlack);
  ant.position.set(-c.W*.3,baseY+bodyH*1.9,-c.L*.3); g.add(ant);

  // ── DETALHES EXTRAS (grade, para-choque) ──
  const grill=new THREE.Mesh(new THREE.BoxGeometry(c.W*.8,.35,0.05),mBlack);
  grill.position.set(0,baseY+bodyH*.35,c.L/2+.02); g.add(grill);
  for(let gi=0;gi<5;gi++){
    const bar=new THREE.Mesh(new THREE.BoxGeometry(.04,.3,.06),mBlack);
    bar.position.set(-c.W*.3+gi*.15,baseY+bodyH*.35,c.L/2+.02); g.add(bar);
  }
  const bumper=new THREE.Mesh(new THREE.BoxGeometry(c.W*.95,.12,.25),mBlack);
  bumper.position.set(0,baseY+bodyH*.18,c.L/2+.1); g.add(bumper);

  scene.add(g);
  const vid='veh_'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
  // Coletar referências das rodas para animação de giro
  const wheelMeshes=[];
  g.traverse(child=>{if(child.userData&&child.userData.isWheel)wheelMeshes.push(child);});
  vehicleObjects[vid]={group:g,steeringWheel:wheelGroup,type,speed:0,yaw:0,x,z,occupied:false,wheelR:c.wheelR,axles:c.axles,wheels:wheelMeshes};
  vehicleSpeeds[vid]=0;
  const labels={jeep:'JEEP MILITAR',tank:'TANQUE T-90',truck:'CAMINHÃO BLINDADO',humvee:'HUMVEE',apc:'APC BLINDADO'};
  interactables.push({type:'vehicle',id:vid,x,z,range:3.5,label:'[E] ENTRAR — '+(labels[type]||type.toUpperCase()),labelClose:'[E] SAIR DO VEÍCULO'});
  return g;
}


async function buildMap(){
  await loadStep(()=>{}, 5, 'PREPARANDO CENA...');

  await loadStep(()=>{
  // GROUND — GIGANTESCO 800x800
  const floorGeo=new THREE.PlaneGeometry(800,800,120,120);
  const floor=new THREE.Mesh(floorGeo,mat(0x111510));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;
  scene.add(floor);
  // Segundo plano (área de terra batida central)

// RAIN
const rainLines=[];
function buildRain(){
  for(let i=0;i<500;i++){
    const g=new THREE.BufferGeometry();
    const p=new Float32Array(6);
    p[0]=Math.random()*180-90;p[1]=Math.random()*25+2;p[2]=Math.random()*180-90;
    p[3]=p[0];p[4]=p[1]-.6;p[5]=p[2];
    g.setAttribute('position',new THREE.BufferAttribute(p,3));
    const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x3366aa,transparent:true,opacity:.35}));
    scene.add(l);rainLines.push({mesh:l,spd:.25+Math.random()*.35});
  }
}
function updateRain(){
  if(!mods.rainToggle)return;
  rainLines.forEach(r=>{
    const p=r.mesh.geometry.attributes.position;
    const cx=camera.position.x,cz=camera.position.z;
    p.array[1]-=r.spd;p.array[4]-=r.spd;
    if(p.array[1]<0){p.array[0]=cx+Math.random()*80-40;p.array[1]=22+Math.random()*5;p.array[2]=cz+Math.random()*80-40;p.array[3]=p.array[0];p.array[4]=p.array[1]-.6;p.array[5]=p.array[2];}
    p.needsUpdate=true;
  });
}
