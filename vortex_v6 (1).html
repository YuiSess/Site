function makePBR(hexColor, roughness=0.6, metalness=0.1, emissiveHex=0, emissiveInt=0){
  return new THREE.MeshStandardMaterial({
    color:hexColor, roughness, metalness,
    emissive:emissiveHex, emissiveIntensity:emissiveInt,
    envMapIntensity:1.2
  });
}

function makeProceduralSkin(){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
  const cx=cv.getContext('2d');
  // Base skin tone
  const grad=cx.createLinearGradient(0,0,128,128);
  grad.addColorStop(0,'#c8855a'); grad.addColorStop(.4,'#bf7a52'); grad.addColorStop(1,'#b87050');
  cx.fillStyle=grad; cx.fillRect(0,0,128,128);
  // Poros e micro-detalhes
  for(let i=0;i<600;i++){
    const x=Math.random()*128,y=Math.random()*128;
    const r=Math.random()*1.2;
    cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2);
    cx.fillStyle=`rgba(${80+Math.random()*40},${40+Math.random()*30},${20+Math.random()*20},${0.08+Math.random()*0.12})`;
    cx.fill();
  }
  // Veias sutis
  for(let i=0;i<8;i++){
    cx.strokeStyle=`rgba(120,60,60,${0.04+Math.random()*0.06})`;
    cx.lineWidth=0.5+Math.random();
    cx.beginPath(); cx.moveTo(Math.random()*128,Math.random()*128);
    cx.quadraticCurveTo(Math.random()*128,Math.random()*128,Math.random()*128,Math.random()*128);
    cx.stroke();
  }
  return new THREE.CanvasTexture(cv);
}

function makeTacticalFabric(r,g,b){
  const cv=document.createElement('canvas'); cv.width=64; cv.height=64;
  const cx=cv.getContext('2d');
  cx.fillStyle=`rgb(${r},${g},${b})`; cx.fillRect(0,0,64,64);
  // Padrão de tecido tático
  for(let i=0;i<64;i+=3){
    cx.strokeStyle=`rgba(${r*0.7},${g*0.7},${b*0.7},0.4)`;
    cx.lineWidth=0.5; cx.beginPath(); cx.moveTo(i,0); cx.lineTo(i,64); cx.stroke();
    cx.beginPath(); cx.moveTo(0,i); cx.lineTo(64,i); cx.stroke();
  }
  // MOLLE webbing dots
  for(let xi=4;xi<64;xi+=8)for(let yi=4;yi<64;yi+=8){
    cx.fillStyle=`rgba(${r*0.5},${g*0.5},${b*0.5},0.5)`;
    cx.fillRect(xi,yi,2,2);
  }
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3);
  return t;
}

const tracerLines=[];

function spawnTracerLine(fromPos, toPos, w){
  let tracerColor = 0xffee44;
  if(w.explosive) tracerColor = 0xff6600;
  else if(w.pellets) tracerColor = 0xff9944;
  else if(w.scope) tracerColor = 0x88ffcc;

  // Linha principal brilhante
  const points=[fromPos.clone(), toPos.clone()];
  const geo=new THREE.BufferGeometry().setFromPoints(points);
  const mat=new THREE.LineBasicMaterial({color:tracerColor,transparent:true,opacity:0.9,linewidth:2});
  const line=new THREE.Line(geo,mat);
  scene.add(line);

  // Linha de brilho mais larga (simulada com linha paralela levemente offset)
  const geo2=new THREE.BufferGeometry().setFromPoints([
    fromPos.clone().add(new THREE.Vector3(0,.01,0)),
    toPos.clone().add(new THREE.Vector3(0,.01,0))
  ]);
  const mat2=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.5});
  const glow=new THREE.Line(geo2,mat2);
  scene.add(glow);

  tracerLines.push({line, mat, glow, mat2, life:18, maxLife:18});
}

function updateTracers(){
  for(let i=tracerLines.length-1;i>=0;i--){
    const t=tracerLines[i];
    t.life--;
    const pct=t.life/t.maxLife;
    t.mat.opacity=pct*0.9;
    t.mat2.opacity=pct*0.4;
    if(t.life<=0){
      scene.remove(t.line);scene.remove(t.glow);
      t.line.geometry.dispose();t.mat.dispose();
      t.glow.geometry.dispose();t.mat2.dispose();
      tracerLines.splice(i,1);
    }
  }
}

function shoot(){
  const w=WEAPONS[currentWeapon];
  if(!canShoot||isReloading||!gameActive||health<=0)return;
  if(inVehicle)return;
  if(wAmmo[currentWeapon]<=0){if(wReserve[currentWeapon]>0)reload();return;}
  if(!mods.infiniteAmmo)wAmmo[currentWeapon]--;
  updateAmmoUI();
  canShoot=false;
  weaponRecoil=mods.noRecoil?0:1;

  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const spread=isAiming&&w.scope?w.spread*.1:w.spread;
  const pellets=w.pellets||1;
  // Shotgun: máx 2 pellets com bala visual, resto só raycast (com traçante)
  const visualPellets=w.pellets?Math.min(pellets,2):1;
  for(let p=0;p<pellets;p++){
    const d=dir.clone();
    d.x+=(Math.random()-.5)*spread*(1+p*.5);
    d.y+=(Math.random()-.5)*spread;
    d.normalize();
    if(p<visualPellets) spawnBullet(camera.position.clone().add(d.clone().multiplyScalar(.5)),d,w);
    doRaycast(d,w,p); // traçante agora é spawned dentro do doRaycast
  }
  // 1 muzzle flash por disparo
  doMuzzleFlash();
  pitch-=(mods.noRecoil?0:(.01+Math.random()*.008));
  setTimeout(()=>canShoot=true,w.rate);
  if(wAmmo[currentWeapon]<=0&&wReserve[currentWeapon]>0)setTimeout(reload,400);
  // ═══ SINCRONIZAR TIRO VIA FIREBASE ═══
  if(db){
    const shootDir=new THREE.Vector3();camera.getWorldDirection(shootDir);
    db.ref('game/shots').push({
      by:playerId,
      name:playerName,
      x:playerPos.x,y:playerPos.y,z:playerPos.z,
      dx:shootDir.x,dy:shootDir.y,dz:shootDir.z,
      weapon:w.name,
      t:Date.now()
    }).then(ref=>ref.remove()); // remove logo após
  }
}

function doRaycast(dir,w,pelletIdx){
  const ray=new THREE.Raycaster(camera.position,dir,0.1,200);
  const meshArr=[];
  Object.values(playerMeshes).forEach(m=>m.visible&&meshArr.push(m));
  Object.values(vehicleObjects).forEach(v=>meshArr.push(v.group));
  const hits=ray.intersectObjects([...scene.children,...meshArr],true);

  const fromPos=camera.position.clone().add(dir.clone().multiplyScalar(.5));
  const hitPos=hits.length?hits[0].point:fromPos.clone().add(dir.clone().multiplyScalar(w.explosive?30:150));

  // Spawn tracer apenas para os pellets visuais (pelletIdx<visualPellets controlado no shoot)
  spawnTracerLine(fromPos, hitPos, w);

  if(!hits.length){
    // Em modo zumbi, mesmo sem hit de raycast normal, verificar zumbis
    if(zombieMode)checkZombieHits(camera.position,dir,w.dmg);
    return;
  }
  const hit=hits[0];
  const pos=hit.point;

  // Zumbi hit em modo zumbi
  if(zombieMode){
    if(checkZombieHits(camera.position,dir,w.dmg))return;
  }

  // Check if hit a remote player
  let hitPid=null;
  for(const[id,mesh]of Object.entries(playerMeshes)){
    if(isDescendant(hit.object,mesh)){hitPid=id;break;}
  }
  if(hitPid&&db){
    const dmg=w.explosive?w.dmg:Math.floor(w.dmg*(pelletIdx===0?1:.6));
    db.ref(`game/players/${hitPid}`).once('value',snap=>{
      const d=snap.val();
      if(d&&d.health>0){
        const nh=Math.max(0,d.health-dmg);
        db.ref(`game/players/${hitPid}`).update({health:nh,lastHitBy:playerId,lastHitDmg:dmg,lastHitTime:Date.now()});
        if(nh<=0){kills++;document.getElementById('killsNum').textContent=kills;addKillFeed(playerName,d.name||'?',true);}
        spawnBlood(pos);showHitMarker();
      }
    });
  }else{
    spawnDust(pos);
    if(w.explosive)spawnExplosion(pos);
  }
}

function isDescendant(obj,parent){
  let cur=obj;while(cur){if(cur===parent)return true;cur=cur.parent;}return false;
}

function showHitMarker(){

  el.innerHTML='<div style="position:absolute;top:50%;left:0;right:0;height:1px;background:#ff4444;margin-top:-.5px"></div><div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ff4444;margin-left:-.5px"></div>';

function reload(){

function throwGrenade(){
  if(!gameActive||health<=0)return;
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  dir.y+=.3;dir.normalize();
  const gpos=camera.position.clone().add(dir.clone().multiplyScalar(1.5));
  const gm=new THREE.Mesh(new THREE.SphereGeometry(.08,6,6),new THREE.MeshLambertMaterial({color:0x226622}));
  gm.position.copy(gpos);scene.add(gm);
  const gvel=dir.clone().multiplyScalar(.28);
  let bounces=0;
  const gInterval=setInterval(()=>{
    gvel.y-=.012;
    gm.position.add(gvel);
    if(gm.position.y<.1){gm.position.y=.1;gvel.y*=-.4;gvel.x*=.7;gvel.z*=.7;bounces++;}
  },16);
  document.getElementById('grenWarn').style.display='block';
  setTimeout(()=>{
    clearInterval(gInterval);scene.remove(gm);
    document.getElementById('grenWarn').style.display='none';
    spawnExplosion(gm.position);
    if(db&&playerId)db.ref(`game/explosions`).push({x:gm.position.x,y:gm.position.y,z:gm.position.z,by:playerId,t:Date.now()});
  },2500);
  addChat('',`💣 Granada lançada!`,true);
}

function enterVehicle(vid){
  if(inVehicle)return;
  const v=vehicleObjects[vid];
  if(!v||v.occupied)return;
  v.occupied=true;inVehicle=true;currentVehicle=vid;
  document.getElementById('vehicleHUD').style.display='block';
  document.getElementById('vhudName').textContent=v.type==='tank'?'TANQUE T-90':v.type==='truck'?'CAMINHÃO MILITAR':'JEEP MILITAR';
  camera.position.set(v.x,v.type==='tank'?2.5:2,v.z);
  addChat('',`🚗 Entrando no veículo!`,true);
}

function exitVehicle(){
  if(!inVehicle||!currentVehicle)return;
  const v=vehicleObjects[currentVehicle];
  if(v){v.occupied=false;playerPos.x=v.group.position.x+3;playerPos.z=v.group.position.z+3;}
  inVehicle=false;currentVehicle=null;
  document.getElementById('vehicleHUD').style.display='none';
  addChat('',`🚗 Saindo do veículo!`,true);
}

function updateVehicle(dt){
  if(!inVehicle||!currentVehicle)return;
  const v=vehicleObjects[currentVehicle];
  if(!v)return;
  const maxSpd=v.type==='tank'?.08:v.type==='truck'?.12:.18;
  const accel=.003,decel=.96;
  if(keys['KeyW']||keys['ArrowUp'])v.speed=Math.min(v.speed+accel,maxSpd*((mods.speedHack?3:1)));
  else if(keys['KeyS']||keys['ArrowDown'])v.speed=Math.max(v.speed-accel,-maxSpd*.5);
  else v.speed*=decel;
  if(keys['KeyA']||keys['ArrowLeft'])v.yaw+=.04*(v.speed>0?1:-1);
  if(keys['KeyD']||keys['ArrowRight'])v.yaw-=.04*(v.speed>0?1:-1);
  v.x-=Math.sin(v.yaw)*v.speed;v.z-=Math.cos(v.yaw)*v.speed;
  v.x=Math.max(-398,Math.min(398,v.x));v.z=Math.max(-398,Math.min(398,v.z));
  v.group.position.set(v.x,0,v.z);v.group.rotation.y=v.yaw;

  // ── RODAS GIRAM COM A VELOCIDADE ──
  if(v.wheels&&v.speed!==0){
    const wheelSpin=v.speed*2.5;
    v.wheels.forEach(w=>{w.rotation.x+=wheelSpin;});
  }
  // ── BODY ROLL SUAVE NAS CURVAS ──
  const turnInput=(keys['KeyA']||keys['ArrowLeft']?1:0)-(keys['KeyD']||keys['ArrowRight']?1:0);
  const targetRoll=turnInput*Math.abs(v.speed)*0.6;
  if(!v._bodyRoll)v._bodyRoll=0;
  v._bodyRoll+=(targetRoll-v._bodyRoll)*0.08;
  v.group.rotation.z=v._bodyRoll;

  yaw=v.yaw;
  // Sincronizar playerPos com o veículo para que o player "ande junto"
  playerPos.x=v.x;playerPos.z=v.z;playerPos.y=v.type==='tank'?2.8:2.2;
  camera.position.set(v.x,v.type==='tank'?2.8:2.2,v.z);
  camera.rotation.y=v.yaw;camera.rotation.x=pitch;
  // Inclinação lateral na curva (câmera roll)
  camera.rotation.z+=(turnInput*0.04*(Math.abs(v.speed)*10)-camera.rotation.z)*.1;
  const spd=Math.abs(v.speed)*500;
  document.getElementById('vhudSpeed').textContent=Math.round(spd);
  // Speed lines
  const speedEl=document.getElementById('speedLines');
  if(speedEl){speedEl.style.display=spd>80?'block':'none';speedEl.style.opacity=Math.min(1,(spd-80)/120);}
  // Vibração em alta velocidade
  if(spd>180&&Math.random()>.7)cameraShake(.03+spd*.0001);
  // update interactable position
  interactables.forEach(ia=>{if(ia.id===currentVehicle){ia.x=v.x;ia.z=v.z;}});
}

function addTurret(x,z,team,id){
  const g=new THREE.Group();
  g.position.set(x,0,z);
  const baseColor=team==='ally'?0x2255aa:team==='enemy'?0xaa2222:0x556633;
  const gunColor=team==='ally'?0x3366cc:team==='enemy'?0xcc3333:0x778844;

  // Base
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.5,.6,.4,8),new THREE.MeshLambertMaterial({color:baseColor}));
  base.position.y=.2;base.castShadow=true;g.add(base);
  // Pivô
  const pivot=new THREE.Group();pivot.position.y=.55;g.add(pivot);
  // Corpo da torreta
  const body=new THREE.Mesh(new THREE.BoxGeometry(.7,.35,.5),new THREE.MeshLambertMaterial({color:gunColor}));
  body.castShadow=true;pivot.add(body);
  // Dois canos
  const barrel1=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.7,6),new THREE.MeshLambertMaterial({color:0x111111}));
  barrel1.rotation.x=Math.PI/2;barrel1.position.set(.12,.05,-.6);pivot.add(barrel1);
  const barrel2=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.7,6),new THREE.MeshLambertMaterial({color:0x111111}));
  barrel2.rotation.x=Math.PI/2;barrel2.position.set(-.12,.05,-.6);pivot.add(barrel2);
  // Escudo protetor
  const shield=new THREE.Mesh(new THREE.BoxGeometry(.75,.5,.04),new THREE.MeshLambertMaterial({color:baseColor}));
  shield.position.set(0,.05,-.32);pivot.add(shield);
  // Luz indicadora
  const indicator=new THREE.PointLight(team==='ally'?0x0088ff:team==='enemy'?0xff2200:0xffaa00,1.5,3);
  indicator.position.y=.35;pivot.add(indicator);
  // Piscar da luz
  setInterval(()=>{indicator.intensity=indicator.intensity>.5?.2:1.5;},team==='enemy'?600:900);

  scene.add(g);
  const tid='turret_'+id;
  turretObjects[tid]={group:g,pivot,x,z,team,yaw:0,pitch:0,health:200,alive:true,
    ammo:999,lastShot:0,indicator};
  interactables.push({type:'turret',id:tid,x,z,range:2.5,label:'[E] OPERAR TORRETA'});
  collidables.push({min:{x:x-.5,z:z-.5},max:{x:x+.5,z:z+.5}});
  return g;
}

function enterTurret(tid){
  if(inTurret||inVehicle)return;
  const t=turretObjects[tid];
  if(!t||!t.alive)return;
  inTurret=true;currentTurret=tid;
  turretYaw=t.yaw;turretPitch=0;
  document.getElementById('turretHUD').style.display='block';
  document.getElementById('crosshair').style.display='none';
  addChat('','⚙ TORRETA OPERADA — Click: Atirar | E: Sair',true);
}

function exitTurret(){
  if(!inTurret)return;
  inTurret=false;currentTurret=null;
  document.getElementById('turretHUD').style.display='none';
  document.getElementById('crosshair').style.display='block';
  addChat('','⚙ Saiu da torreta',true);
}

function shootTurret(){
  if(!inTurret||turretCooldown)return;
  const t=turretObjects[currentTurret];
  if(!t||!t.alive)return;
  turretCooldown=true;
  setTimeout(()=>turretCooldown=false,120);

  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const from=new THREE.Vector3(t.x,1.8,t.z);
  // Tracer e raycast
  spawnTracerLine(from,from.clone().add(dir.clone().multiplyScalar(160)),{spread:0,scope:false});
  doRaycast(dir,{dmg:40,spread:0,explosive:false},0);

  // Flash visual
  const fl=new THREE.PointLight(0xffff44,15,8);fl.position.set(t.x,1.8,t.z);scene.add(fl);
  setTimeout(()=>scene.remove(fl),80);
  // Partícula de cano
  spawnDust(from.clone().add(dir.clone().multiplyScalar(1)));
}

function updateTurrets(){
  for(const tid in turretObjects){
    const t=turretObjects[tid];
    if(!t.alive)continue;
    if(inTurret&&currentTurret===tid){
      // Player controla — pivô segue câmera
      t.pivot.rotation.y=yaw-t.group.rotation.y;
      t.pivot.rotation.x=Math.max(-.4,Math.min(.4,pitch));
      // Camera fixa na torreta
      camera.position.set(t.x,2.2,t.z);
      playerPos.x=t.x;playerPos.z=t.z;playerPos.y=2.2;
    }
  }
}

// INTERACT SYSTEM
// ═══════════════════════════════════════════════
function checkInteractables(){
  let closest=null,closestDist=999;
  interactables.forEach(ia=>{
    const dx=playerPos.x-ia.x,dz=playerPos.z-ia.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<ia.range&&dist<closestDist){closest=ia;closestDist=dist;}
  });
  const prompt=document.getElementById('interactPrompt');
  const lbl=document.getElementById('interactLabel');
  if(closest){
    prompt.style.display='block';
    if(closest.type==='door'){
      const d=doorAnims[closest.id];
      lbl.textContent=d&&d.open?closest.labelClose:closest.label;
      nearDoor=closest.id;nearVehicle=null;nearTurret=null;
    }else if(closest.type==='vehicle'){
      lbl.textContent=inVehicle&&currentVehicle===closest.id?closest.labelClose:closest.label;
      nearVehicle=closest.id;nearDoor=null;nearTurret=null;
    }else if(closest.type==='turret'){
      lbl.textContent=inTurret&&currentTurret===closest.id?'[E] SAIR DA TORRETA':closest.label;
      nearTurret=closest.id;nearDoor=null;nearVehicle=null;
    }else if(closest.type==='zombieItem'){
      lbl.textContent=closest.label;
      nearDoor=null;nearVehicle=null;nearTurret=null;
    }else if(closest.type==='secretWeapon'){
      lbl.textContent=closest.label;
      nearDoor=null;nearVehicle=null;nearTurret=null;
      // auto-highlight: pulse the secret prompt
    }
  }else{
    prompt.style.display='none';
    nearDoor=null;nearVehicle=null;nearTurret=null;
  }
}

// ═══════════════════════════════════════════════
// MOVEMENT
// ═══════════════════════════════════════════════
function checkCollision(x,z,r){
  if(Math.abs(x)>398||Math.abs(z)>398)return true;
  for(const obj of collidables){
    if(x-r<obj.max.x&&x+r>obj.min.x&&z-r<obj.max.z&&z+r>obj.min.z)return true;
  }
  return false;
}

function updateMovement(){
  if(!gameActive||!isPointerLocked||inVehicle)return;
  const baseSp=mods.speedHack?.24:isSprinting?.13:isCrouching?.05:.08;
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const rgt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const mv=new THREE.Vector3();
  let moved=false;
  if(keys['KeyW']||keys['ArrowUp']){mv.add(fwd);moved=true;}
  if(keys['KeyS']||keys['ArrowDown']){mv.sub(fwd);moved=true;}
  if(keys['KeyA']||keys['ArrowLeft']){mv.sub(rgt);moved=true;}
  if(keys['KeyD']||keys['ArrowRight']){mv.add(rgt);moved=true;}
  if(mv.length()>0){
    mv.normalize().multiplyScalar(baseSp);
    if(!checkCollision(playerPos.x+mv.x,playerPos.z,0.35))playerPos.x+=mv.x;
    if(!checkCollision(playerPos.x,playerPos.z+mv.z,0.35))playerPos.z+=mv.z;
  }
  const ty=isCrouching?1.1:sbFlying?playerPos.y:1.7;
  if(!sbFlying)playerPos.y+=(ty-playerPos.y)*.18;
  // Voar com Space/Ctrl
  if(sbFlying){
    if(keys['Space'])playerPos.y+=0.15;
    if(keys['ControlLeft'])playerPos.y=Math.max(1.7,playerPos.y-0.15);
  }
  if(moved&&isSprinting)weaponBob+=.28;else if(moved)weaponBob+=.13;
  // Weapon bob — mais realismo ao andar
  const bobX=Math.sin(weaponBob*.5)*.007*(isSprinting?2.5:1);
  const bobY=Math.sin(weaponBob)*.014*(isSprinting?2.2:1);
  const bobZ=Math.cos(weaponBob*.25)*.004;
  weapGroup.position.y=isAiming?-.01:bobY;
  weapGroup.position.x=isAiming?.02:.14+bobX;
  weapGroup.position.z=isAiming?-.35:-.3+bobZ;
  // Sway lateral da arma ao girar câmera
  weapGroup.rotation.z+=(0-weapGroup.rotation.z)*.08;
  if(weaponRecoil>0){weaponRecoil*=.8;weapGroup.position.z-=weaponRecoil*.04;}
  if(reloadAnim>0){reloadAnim--;weapGroup.rotation.x=Math.sin(reloadAnim*.1)*.3;}
  else weapGroup.rotation.x+=(0-weapGroup.rotation.x)*.15;
  // Minigun-X barrel spin
  if(currentWeapon===5){
    weapGroup.children.forEach(c=>{if(c.userData&&c.userData.mgBarrel){c.userData.mgAngleOffset=(c.userData.mgAngleOffset||0)+.15;c.position.x=.14+Math.cos(c.userData.mgAngleOffset)*.038;c.position.y=-.09+Math.sin(c.userData.mgAngleOffset)*.038;}});
  }
  camera.position.set(playerPos.x,playerPos.y,playerPos.z);
  if(shakeAmt>0){
    camera.position.x+=(Math.random()-.5)*shakeAmt;
    camera.position.y+=(Math.random()-.5)*shakeAmt;
    shakeAmt*=.82;if(shakeAmt<.002)shakeAmt=0;
  }
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
  checkInteractables();
}

function cameraShake(a){shakeAmt=Math.max(shakeAmt,a);}

// ═══════════════════════════════════════════════
// DAMAGE / DEATH
// ═══════════════════════════════════════════════
function takeDamage(amount){
  if(mods.godMode)return;
  if(armor>0){const ab=Math.min(armor,amount*.5);armor=Math.max(0,armor-ab);amount-=ab;}
  health=Math.max(0,health-amount);
  document.getElementById('hpFill').style.width=health+'%';
  document.getElementById('hpNum').textContent=Math.ceil(health);
  document.getElementById('armorFill').style.width=armor+'%';
  document.getElementById('dmgVignette').classList.add('show');
  cameraShake(.18);
  setTimeout(()=>document.getElementById('dmgVignette').classList.remove('show'),200);
  document.getElementById('lowHpVignette').style.display=health<30?'block':'none';
  if(health<=0)die();
}

function die(){
  if(isDowned)return; // já está derrubado
  if(zombieMode){
    // Em modo zumbi: vai para estado derrubado primeiro
    health=0;
    document.getElementById('hpFill').style.width='0%';document.getElementById('hpNum').textContent='0';
    gameActive=false;
    if(inVehicle)exitVehicle();
    if(db&&playerRef)playerRef.update({health:0,alive:false,deaths});
    goDown();
    return;
  }
  health=0;deaths++;
  document.getElementById('deathsNum').textContent=deaths;
  document.getElementById('respawnScreen').style.display='flex';
  gameActive=false;
  if(inVehicle)exitVehicle();
  if(db&&playerRef)playerRef.update({health:0,alive:false,deaths});
  let t=5;document.getElementById('respawnNum').textContent=t;
  const iv=setInterval(()=>{t--;document.getElementById('respawnNum').textContent=t;if(t<=0){clearInterval(iv);respawn();}},1000);
}

function respawn(){
  health=100;armor=75;
  spawnIdx=(spawnIdx+1)%SPAWNS.length;
  // Usa spawn seguro — verifica colisão antes de posicionar
  const safe=getSafeSpawn();
  playerPos.x=safe.x;
  playerPos.z=safe.z;
  playerPos.y=1.7;
  camera.position.set(playerPos.x,playerPos.y,playerPos.z);
  wAmmo=WEAPONS.map(w=>w.ammo);wReserve=WEAPONS.map(w=>w.reserve);
  if(secretWeaponFound){wAmmo[5]=500;wReserve[5]=2000;}
  gameActive=true;
  document.getElementById('respawnScreen').style.display='none';
  document.getElementById('hpFill').style.width='100%';
  document.getElementById('hpNum').textContent='100';
  document.getElementById('armorFill').style.width='75%';
  document.getElementById('lowHpVignette').style.display='none';
  updateAmmoUI();
  if(db&&playerRef)playerRef.update({health:100,alive:true,x:playerPos.x,y:playerPos.y,z:playerPos.z});
}

function updateMinimap(){
  const cv=document.getElementById('minimapCanvas');
  const ctx=cv.getContext('2d');
  const S=160,scale=160/800,off=400;
  ctx.fillStyle='rgba(0,10,0,.85)';ctx.fillRect(0,0,S,S);
  // roads
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.fillRect(0,S*.5-2,S,4);ctx.fillRect(S*.5-2,0,4,S);
  // player
  const px=(playerPos.x+400)*scale,pz=(playerPos.z+400)*scale;
  ctx.save();ctx.translate(px,pz);ctx.rotate(yaw);
  ctx.fillStyle='#00ff88';
  ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(4,5);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();
  ctx.restore();
  // enemies
  for(const[id,p]of Object.entries(remotePlayers)){
    if(!p.alive)continue;
    const ex=(p.x+400)*scale,ez=(p.z+400)*scale;
    ctx.fillStyle='#4488ff';ctx.beginPath();ctx.arc(ex,ez,3,0,Math.PI*2);ctx.fill();
  }
  // zombies no minimapa
  if(zombieMode){
    activeZombies.forEach(z=>{
      if(!z.alive)return;
      const zx=(z.mesh.position.x+400)*scale,zz=(z.mesh.position.z+400)*scale;
      ctx.fillStyle=z.type==='giant'?'#ff8800':z.type==='fast'?'#ff00ff':'#ff2200';
      ctx.beginPath();ctx.arc(zx,zz,z.type==='giant'?5:2.5,0,Math.PI*2);ctx.fill();
    });
  }
  // vehicles
  for(const vid in vehicleObjects){
    const v=vehicleObjects[vid];
    const vx=(v.x+400)*scale,vz=(v.z+400)*scale;
    ctx.fillStyle=v.occupied?'#ffaa00':'#556633';
    ctx.fillRect(vx-4,vz-3,8,6);
  }
  ctx.strokeStyle='#00ff8433';ctx.strokeRect(0,0,S,S);
}

function addChat(sender,msg,system=false){
  const box=document.getElementById('chatBox');
  const el=document.createElement('div');
  el.className='chat-msg';
  el.innerHTML=system?`<span>${msg}</span>`:`<span class="sender">${sender}</span> ${msg}`;
  box.appendChild(el);
  if(box.children.length>7)box.removeChild(box.firstChild);
  setTimeout(()=>el.remove&&el.remove(),5000);
}

function switchWeapon(idx){
  if(idx===currentWeapon||isReloading)return;
  if(idx===5&&!secretWeaponFound){addChat('','🔒 MINIGUN-X não encontrada ainda! Procure nos locais secretos.',true);return;}
  currentWeapon=idx;
  buildWeaponModel(idx);
  updateAmmoUI();
  document.querySelectorAll('.w-slot').forEach((el,i)=>el.classList.toggle('active',i===idx));
  if(isAiming){isAiming=false;document.getElementById('scopeOverlay').style.display='none';camera.fov=mods.fov;camera.updateProjectionMatrix();}
  // Crosshair class
  const w=WEAPONS[idx];
  const ch=document.getElementById('crosshair');
  ch.className=w.explosive?'rpg':w.pellets?'shotgun':w.scope?'sniper':w.secret?'minigun':'';
  if(idx===5){document.getElementById('secretWeaponPulse').style.display='block';setTimeout(()=>document.getElementById('secretWeaponPulse').style.display='none',3000);}
}

function updateRoundTimer(){

  const m=Math.floor(roundTime/60),s=roundTime%60;
  document.getElementById('roundTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// FIREBASE — ULTRA SMOOTH MULTIPLAYER v6
// Interpolação real, client prediction, delta compression
// ═══════════════════════════════════════════════

// State for each remote player interpolation
const remotePlayerStates={};  // {id: {snapshots:[], renderPos, renderYaw, renderPitch}}
const NET_INTERP_DELAY=80;    // ms de buffer de interpolação
const NET_SEND_RATE=50;       // ms entre envios (20Hz)
const NET_EXTRAP_MAX=200;     // máx ms de extrapolação

let lastNetSend=0;
let pingStart=0;
let measuredPing=40;

function initFirebase(){
  const s1=document.createElement('script');
  s1.src='https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js';
  document.head.appendChild(s1);
  s1.onload=()=>{
    const s2=document.createElement('script');
    s2.src='https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js';
    document.head.appendChild(s2);
    s2.onload=()=>{
      try{
        if(!firebase.apps.length)firebase.initializeApp(FB);
        db=firebase.database();
        playerId='p_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
        playerRef=db.ref(`game/players/${playerId}`);

        // Escreve dado inicial do player
        const initData={
          name:playerName,
          x:playerPos.x,y:playerPos.y,z:playerPos.z,
          yaw:0,pitch:0,
          vx:0,vy:0,vz:0,       // velocidades para extrapolação
          state:'idle',          // idle,walk,run,crouch,jump,dead,downed
          weapon:currentWeapon,
          health:100,alive:true,
          kills:0,deaths:0,
          color:PCOLORS[Math.floor(Math.random()*PCOLORS.length)],
          ts:Date.now(),seq:0
        };
        playerRef.set(initData);
        playerRef.onDisconnect().remove();

        // ── LISTENER PRINCIPAL — snapshot diff ──
        db.ref('game/players').on('value',snap=>{
          const data=snap.val()||{};
          const list=document.getElementById('msPlayerList');
          if(list)list.innerHTML='';
          let online=0;

          for(const[id,p]of Object.entries(data)){
            online++;
            if(id===playerId)continue;

            // Criar mesh se não existir
            if(!playerMeshes[id]){
              const mesh=createPlayerMesh(p.color||0xff4444);
              scene.add(mesh);
              playerMeshes[id]=mesh;
              // Inicializar estado de interpolação
              remotePlayerStates[id]={
                snapshots:[],
                renderPos:new THREE.Vector3(p.x||0,0,p.z||0),
                renderYaw:p.yaw||0,
                renderPitch:p.pitch||0,
                lastSeq:-1,
                state:'idle'
              };
              addChat('',`${p.name||'?'} entrou na partida`,true);
            }

            // Só adicionar snapshot se for mais recente
            const rs=remotePlayerStates[id];
            if(rs&&p.seq>rs.lastSeq){
              rs.lastSeq=p.seq;
              rs.snapshots.push({
                ts:Date.now(),           // quando recebemos
                serverTs:p.ts||Date.now(),
                x:p.x||0,y:p.y||0,z:p.z||0,
                yaw:p.yaw||0,pitch:p.pitch||0,
                vx:p.vx||0,vy:p.vy||0,vz:p.vz||0,
                state:p.state||'idle',
                weapon:p.weapon||0,
                health:p.health||0,
                alive:p.alive!==false
              });
              // Manter buffer pequeno
              if(rs.snapshots.length>32)rs.snapshots.shift();
            }

            remotePlayers[id]=p;

            // Atualizar visibilidade wallhack
            if(playerMeshes[id])playerMeshes[id].visible=(p.alive!==false)||mods.wallhack;

            // Checar se alguém nos acertou
            if(p.lastHitBy===playerId&&p.lastHitTime&&(Date.now()-p.lastHitTime)<300&&p.health<=0){
              // Kill count já contado na função shoot
            }

            if(list){
              const item=document.createElement('div');item.className='ms-pl-item';
              item.innerHTML=`<div class="ms-pl-dot${p.alive===false?' e':''}"></div><span>${p.name||id.substr(0,10)}</span><span style="margin-left:auto;color:#ff4444aa;font-size:10px">❤ ${Math.ceil(p.health||0)}</span>`;
              list.appendChild(item);
            }
          }

          document.getElementById('playersOnline').textContent=online;

          // Remover players desconectados
          for(const id of Object.keys(playerMeshes)){
            if(!data[id]){
              scene.remove(playerMeshes[id]);
              delete playerMeshes[id];
              delete remotePlayers[id];
              delete remotePlayerStates[id];
            }
          }
        });

        // ── CHAT ──
        db.ref('game/chat').limitToLast(1).on('child_added',snap=>{
          const m=snap.val();if(m&&m.pid!==playerId)addChat(m.name,m.msg);
        });

        // ── EXPLOSÕES SINCRONIZADAS ──
        db.ref('game/explosions').limitToLast(1).on('child_added',snap=>{
          const e=snap.val();
          if(e&&e.by!==playerId&&(Date.now()-e.t)<3000)
            spawnExplosion(new THREE.Vector3(e.x,e.y,e.z));
        });

        // ── TIROS SINCRONIZADOS — visual only ──
        db.ref('game/shots').limitToLast(1).on('child_added',snap=>{
          const s=snap.val();
          if(!s||s.by===playerId)return;
          if(Date.now()-s.t>600)return;
          const from=new THREE.Vector3(s.x,s.y,s.z);
          const dir=new THREE.Vector3(s.dx,s.dy,s.dz).normalize();
          const to=from.clone().add(dir.clone().multiplyScalar(120));
          spawnTracerLine(from,to,{spread:.02,scope:false});
          const fl=new THREE.PointLight(0xffff44,6,5);fl.position.copy(from);scene.add(fl);
          setTimeout(()=>scene.remove(fl),100);
          spawnDust(to);
        });

        // ── PING MEASUREMENT ──
        pingStart=Date.now();
        db.ref('.info/connected').on('value',snap=>{
          if(snap.val()){
            measuredPing=Math.min(Date.now()-pingStart,999);
            document.getElementById('pingVal').textContent=measuredPing+'ms';
          }
        });

        addChat('','🌐 Firebase conectado! Multiplayer ULTRA SMOOTH v6 ativo.',true);
      }catch(e){addChat('','⚠ Modo offline',true);console.error(e);}
    };
  };
}

// ── INTERPOLAÇÃO DE PLAYERS REMOTOS (chamada a cada frame) ──
function updateRemotePlayers(){
  const now=Date.now();
  for(const[id,rs]of Object.entries(remotePlayerStates)){
    const mesh=playerMeshes[id];
    if(!mesh)continue;

    const renderTime=now-NET_INTERP_DELAY;
    const snaps=rs.snapshots;

    if(snaps.length===0)continue;

    let snap0=snaps[0],snap1=snaps[snaps.length-1];
    let found=false;

    // Achar dois snapshots que englobam renderTime
    for(let i=0;i<snaps.length-1;i++){
      if(snaps[i].ts<=renderTime&&snaps[i+1].ts>=renderTime){
        snap0=snaps[i];snap1=snaps[i+1];found=true;break;
      }
    }

    let tx,ty,tz,tyaw,tpitch;

    if(found){
      // Interpolação entre dois snapshots
      const span=snap1.ts-snap0.ts;
      const t=span>0?Math.max(0,Math.min(1,(renderTime-snap0.ts)/span)):1;
      tx=lerp(snap0.x,snap1.x,t);
      ty=lerp(snap0.y,snap1.y,t);
      tz=lerp(snap0.z,snap1.z,t);
      tyaw=lerpAngle(snap0.yaw,snap1.yaw,t);
      tpitch=lerp(snap0.pitch||0,snap1.pitch||0,t);
    }else{
      // Extrapolação suave do último snapshot
      const last=snaps[snaps.length-1];
      const dt=Math.min(now-last.ts,NET_EXTRAP_MAX)/1000;
      tx=last.x+(last.vx||0)*dt;
      ty=last.y+(last.vy||0)*dt;
      tz=last.z+(last.vz||0)*dt;
      tyaw=last.yaw;
      tpitch=last.pitch||0;
    }

    // Smoothing suave na posição renderizada
    const SMOOTH=0.22;
    rs.renderPos.x+=(tx-rs.renderPos.x)*SMOOTH;
    rs.renderPos.y+=(ty-rs.renderPos.y)*SMOOTH;
    rs.renderPos.z+=(tz-rs.renderPos.z)*SMOOTH;
    rs.renderYaw=lerpAngle(rs.renderYaw,tyaw,SMOOTH);

    mesh.position.copy(rs.renderPos);
    mesh.rotation.y=rs.renderYaw+Math.PI;

    // Update weapon visibility
    const last2=snaps[snaps.length-1];
    mesh.visible=(last2.alive!==false)||mods.wallhack;
  }
}

function lerp(a,b,t){return a+(b-a)*t;}
function lerpAngle(a,b,t){
  let diff=((b-a)%( Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
  return a+diff*t;
}

// ── ENVIO DE POSIÇÃO DO JOGADOR LOCAL (rate-limited, delta) ──
let lastSentState={x:null,y:null,z:null,yaw:null};
let netSeq=0;

function sendNetworkUpdate(){
  if(!db||!playerRef||!gameActive)return;
  const now=performance.now();
  if(now-lastNetSend<NET_SEND_RATE)return;
  lastNetSend=now;

  // Delta: só enviar se mudou algo
  const dx=Math.abs(playerPos.x-(lastSentState.x||0));
  const dz=Math.abs(playerPos.z-(lastSentState.z||0));
  const dyaw=Math.abs(yaw-(lastSentState.yaw||0));
  if(dx<0.005&&dz<0.005&&dyaw<0.005&&lastSentState.x!==null)return;

  // Calcular velocidade para extrapolação
  const vx=lastSentState.x!==null?(playerPos.x-lastSentState.x)/(NET_SEND_RATE/1000)*0.5:0;
  const vz=lastSentState.z!==null?(playerPos.z-lastSentState.z)/(NET_SEND_RATE/1000)*0.5:0;

  const state=isCrouching?'crouch':isSprinting?'run':
    (keys['KeyW']||keys['KeyS']||keys['KeyA']||keys['KeyD'])?'walk':'idle';

  netSeq++;
  playerRef.update({
    x:Math.round(playerPos.x*100)/100,
    y:Math.round(playerPos.y*100)/100,
    z:Math.round(playerPos.z*100)/100,
    yaw:Math.round(yaw*1000)/1000,
    pitch:Math.round(pitch*1000)/1000,
    vx:Math.round(vx*100)/100,
    vy:0,
    vz:Math.round(vz*100)/100,
    state,
    weapon:currentWeapon,
    health,
    alive:health>0&&!isDowned,
    ts:Date.now(),
    seq:netSeq
  });

  lastSentState={x:playerPos.x,z:playerPos.z,yaw};
  document.getElementById('pingVal').textContent=measuredPing+'ms';
}

let frame=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta()*sbSlowFactor;
  frame++;
  updateMovement();
  updateVehicle(dt);
  updateDoors();
  updateRain();
  updateTracers();
  updateTurrets();
  updateRemotePlayers();   // ← interpolação suave dos players remotos
  sendNetworkUpdate();     // ← envio de posição rate-limited
  if(zombieMode)updateZombies(dt);
  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.mesh.position.add(b.velocity);
    b.life--;
    if(b.life<=0){scene.remove(b.mesh);bullets.splice(i,1);}
  }
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.velocity.y-=(p.gravity||.005);
    p.mesh.position.add(p.velocity);
    if(p.scaleUp){const s=1+(.3*(1-p.life/80));p.mesh.scale.set(s,s,s);}
    if(p.mesh.material&&p.mesh.material.transparent){p.mesh.material.opacity=p.life/(p.type==='smoke'?200:40);}
    p.life--;
    if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}
  }
  if(frame%4===0)updateMinimap();
  // Muzzle light decay
  if(muzzleLightTimer>0){muzzleLightTimer--;if(muzzleLightTimer<=0)muzzleLight.intensity=0;}
  // FPS counter
  if(mods.showFPS){
    const now=performance.now();
    if(now-lastFPSTime>=500){fps=Math.round(1/dt);lastFPSTime=now;}
    document.getElementById('pingVal').textContent=fps+' FPS';
  }
  renderer.render(scene,camera);
}

document.addEventListener('keydown',e=>{

function createZombieMesh(type='normal'){
  const g=new THREE.Group();
  const isGiant=type==='giant';
  const isFast=type==='fast';
  const scale=isGiant?2.0:isFast?0.85:1.0;

  const skinColor=isGiant?0x3a7a2a:isFast?0x7a3a7a:0x4a7a3a;
  const clothColor=isGiant?0x223a22:isFast?0x3a1a3a:0x1a2a1a;

  const mSkin=new THREE.MeshLambertMaterial({color:skinColor});
  const mCloth=new THREE.MeshLambertMaterial({color:clothColor});
  const mEye=new THREE.MeshBasicMaterial({color:isGiant?0xff4400:0xff0000});

  // Corpo
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.5*scale,.7*scale,.3*scale),mCloth);
  torso.position.y=.95*scale;g.add(torso);
  // Cabeça
  const head=new THREE.Mesh(new THREE.SphereGeometry(.22*scale,8,8),mSkin);
  head.position.y=1.55*scale;g.add(head);
  // Olhos brilhando
  [-1,1].forEach(s=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.04*scale,5,5),mEye);
    eye.position.set(s*.09*scale,1.58*scale,.2*scale);g.add(eye);
  });
  // Pernas
  [-1,1].forEach(s=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.18*scale,.55*scale,.22*scale),mCloth);
    leg.position.set(s*.14*scale,.35*scale,0);g.add(leg);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(.2*scale,.1*scale,.28*scale),new THREE.MeshLambertMaterial({color:0x111111}));
    foot.position.set(s*.14*scale,.07*scale,.04*scale);g.add(foot);
  });
  // Braços estendidos (clássico zumbi)
  [-1,1].forEach(s=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.14*scale,.5*scale,.14*scale),mSkin);
    arm.position.set(s*.38*scale,.95*scale,.15*scale);
    arm.rotation.x=-0.7;
    g.add(arm);
  });

  g.castShadow=true;
  if(isGiant){
    // Luza ao redor do gigante
    const gl=new THREE.PointLight(0xff2200,1.5,4);gl.position.y=1.5;g.add(gl);
  }
  return g;
}

function spawnZombie(type='normal'){
  // Spawn longe do jogador
  let zx,zz;
  let attempts=0;
  do{
    const angle=Math.random()*Math.PI*2;
    const dist=20+Math.random()*30;
    zx=playerPos.x+Math.cos(angle)*dist;
    zz=playerPos.z+Math.sin(angle)*dist;
    attempts++;
  }while(attempts<20&&!isSafeSpawn(zx,zz));

  const mesh=createZombieMesh(type);
  mesh.position.set(zx,0,zz);
  scene.add(mesh);

  const isGiant=type==='giant';
  const isFast=type==='fast';

  const zombie={
    mesh,type,
    hp:isGiant?500:isFast?60:100,
    maxHp:isGiant?500:isFast?60:100,
    speed:isGiant?.025:isFast?.095:.042,
    dmg:isGiant?40:isFast?15:20,
    attackRange:isGiant?2.5:1.5,
    attackCooldown:0,
    alive:true,
    // Para animação de caminhada
    walkCycle:Math.random()*Math.PI*2,
    dead:false
  };
  activeZombies.push(zombie);
  return zombie;
}

function spawnZombieWave(waveNum){
  const baseCount=5+waveNum*3;
  const fastCount=Math.floor(waveNum/2);
  const giantCount=waveNum>=3?1:0;

  for(let i=0;i<baseCount;i++)spawnZombie('normal');
  for(let i=0;i<fastCount;i++)spawnZombie('fast');
  for(let i=0;i<giantCount;i++)spawnZombie('giant');

  zombiesTotal=baseCount+fastCount+giantCount;
  zombiesKilled=0;

  const wDiv=document.getElementById('zombieWave');
  wDiv.textContent=`🧟 WAVE ${waveNum} — ${zombiesTotal} ZUMBIS`;
  wDiv.style.display='block';
  setTimeout(()=>wDiv.style.display='none',3000);

  document.getElementById('zombiePanel').style.display='block';
  document.getElementById('zombieWaveStat').textContent=`WAVE: ${waveNum}`;
  updateZombieUI();
  addChat('',`🧟 WAVE ${waveNum} CHEGOU! ${zombiesTotal} zumbis atacando!`,true);
  if(giantCount>0)addChat('','⚠ GIGANTE DETECTADO! 500 HP — COORDENEM OS TIROS!',true);
}

function updateZombieUI(){
  document.getElementById('zombieKillStat').textContent=`MORTOS: ${zombiesKilled}/${zombiesTotal}`;
  document.getElementById('zombieAliveCount').textContent=`RESTANDO: ${activeZombies.filter(z=>z.alive).length}`;
}

function updateZombies(dt){
  if(!gameActive&&!isDowned)return;
  const now=Date.now();

  activeZombies.forEach(z=>{
    if(!z.alive)return;
    const mesh=z.mesh;
    const dx=playerPos.x-mesh.position.x;
    const dz=playerPos.z-mesh.position.z;
    const dist=Math.sqrt(dx*dx+dz*dz);

    // Rotação para o jogador
    mesh.rotation.y=Math.atan2(dx,dz);

    // Animação de caminhada (bob das pernas)
    z.walkCycle+=z.speed*8;
    mesh.position.y=Math.abs(Math.sin(z.walkCycle))*0.05;

    if(dist>0.5){
      // Mover em direção ao jogador
      const speed=mods.slowEnemies?z.speed*.3:z.speed;
      mesh.position.x+=dx/dist*speed;
      mesh.position.z+=dz/dist*speed;
    }

    // Atacar jogador
    if(dist<z.attackRange){
      if(!z.attackCooldown||now>z.attackCooldown){
        z.attackCooldown=now+(z.type==='giant'?1500:800);
        if(!isDowned){
          takeDamage(z.dmg);
          cameraShake(.15);
          if(z.type==='giant'){addChat('','⚠ O GIGANTE TE GOLPEOU!',true);}
        }else{
          // Sangramento mais rápido quando derrubado e próximo
          downedBleedTimer+=5;
        }
      }
    }
  });

  // Checar se todos os zumbis morreram
  const aliveZombies=activeZombies.filter(z=>z.alive);
  if(aliveZombies.length===0&&activeZombies.length>0){
    activeZombies=[];
    zombieWave++;
    addChat('','✅ WAVE ELIMINADA! Próxima wave em 10 segundos...',true);
    setTimeout(()=>{if(zombieMode)spawnZombieWave(zombieWave);},10000);
  }
}

function zombieHit(zombieIdx,dmg){
  const z=activeZombies[zombieIdx];
  if(!z||!z.alive)return;
  z.hp-=dmg;
  // Efeito de dano
  spawnBlood(z.mesh.position.clone().add(new THREE.Vector3(0,1,0)));

  if(z.hp<=0){
    z.alive=false;
    zombiesKilled++;
    // Animação de morte: deitar no chão
    z.mesh.rotation.z=Math.PI/2;
    z.mesh.position.y=-.2;
    setTimeout(()=>scene.remove(z.mesh),3000);
    updateZombieUI();
    if(z.type==='giant')addChat('','💀 GIGANTE ELIMINADO! Excelente trabalho, soldado!',true);
  }
}

// Checar se um tiro acertou algum zumbi
function checkZombieHits(origin,dir,dmg){
  const ray=new THREE.Raycaster(origin,dir,0.1,200);
  for(let i=0;i<activeZombies.length;i++){
    const z=activeZombies[i];
    if(!z.alive)continue;
    const hits=ray.intersectObject(z.mesh,true);
    if(hits.length>0){
      zombieHit(i,dmg);
      showHitMarker();
      return true;
    }
  }
  return false;
}

function openInventory(){
  const panel=document.getElementById('inventoryPanel');
  panel.style.display='block';
  if(isPointerLocked)document.exitPointerLock();
  renderInventoryGrid();
}

function closeInventory(){
  document.getElementById('inventoryPanel').style.display='none';
  if(gameActive)canvas.requestPointerLock();
}

function renderInventoryGrid(){
  const grid=document.getElementById('inventoryGrid');
  grid.innerHTML='';
  for(let i=0;i<16;i++){
    const slot=document.createElement('div');
    slot.className='inv-slot'+(playerInventory[i]?' filled':'');
    if(playerInventory[i]){
      const item=playerInventory[i];
      slot.innerHTML=`<div class="item-icon">${item.icon}</div><div>${item.name}</div><div class="item-count">${item.count}</div>`;
      slot.onclick=()=>useInventoryItem(i);
    }
    grid.appendChild(slot);
  }
}

function useInventoryItem(idx){
  const item=playerInventory[idx];
  if(!item)return;
  if(item.type==='heal'){health=Math.min(100,health+item.value);document.getElementById('hpFill').style.width=health+'%';document.getElementById('hpNum').textContent=Math.ceil(health);addChat('',`${item.icon} Usou ${item.name}: +${item.value} HP`,true);}
  else if(item.type==='ammo'){wReserve[currentWeapon]+=item.value;updateAmmoUI();addChat('',`${item.icon} Munição reabastecida!`,true);}
  else if(item.type==='armor'){armor=Math.min(100,armor+item.value);document.getElementById('armorFill').style.width=armor+'%';addChat('',`${item.icon} Colete equipado!`,true);}
  else if(item.type==='grenade'){throwGrenade();addChat('',`💣 Granada usada!`,true);}
  else if(item.type==='weapon'){switchWeapon(item.weaponIdx);addChat('',`${item.icon} ${item.name} equipado!`,true);}
  item.count--;
  if(item.count<=0)playerInventory.splice(idx,1);
  else playerInventory[idx]=item;
  renderInventoryGrid();
}

function collectZombieItem(iaId){
  const idx=interactables.findIndex(i=>i.id===iaId);
  if(idx<=-1)return;
  const ia=interactables[idx];
  if(!ia||!ia.item)return;
  // Adicionar ao inventário
  const existing=playerInventory.find(i=>i.name===ia.item.name);
  if(existing){existing.count+=ia.item.count;}
  else if(playerInventory.length<16){playerInventory.push({...ia.item});}
  else{addChat('','❌ Inventário cheio!',true);return;}
  // Remover do mundo
  scene.remove(ia.mesh);scene.remove(ia.light);
  interactables.splice(idx,1);
  addChat('',`✅ ${ia.item.icon} ${ia.item.name} coletado! (${ia.item.count}x)`,true);
  openInventory();
}

// ── SISTEMA DERRUBADO (DOWNED) ──
function goDown(){
  isDowned=true;
  health=0;
  document.getElementById('downedScreen').style.display='flex';
  document.getElementById('hud').style.display='none';
  downedBleedTimer=0;
  downedPistolAmmo=12;
  addChat('','☠ VOCÊ CAIU! Atire nos zumbis com ESPAÇO enquanto aguarda reviver!',true);

  // Agachar a câmera simulando o chão
  playerPos.y=0.4;

  // Sangramento progressivo
  const bleedIv=setInterval(()=>{
    if(!isDowned){clearInterval(bleedIv);return;}
    downedBleedTimer++;
    document.getElementById('downedHP').textContent=`SANGRAMENTO: ${Math.max(0,100-downedBleedTimer*5)}`;
    if(downedBleedTimer>=20){
      clearInterval(bleedIv);
      finalDie();
    }
  },1000);
}

function finalDie(){
  isDowned=false;deaths++;
  document.getElementById('downedScreen').style.display='none';
  document.getElementById('deathsNum').textContent=deaths;
  if(zombieMode){
    // Respawn na casa segura
    setTimeout(()=>{
      health=50;armor=0;
      playerPos.x=ZOMBIE_SAFE_HOUSE_POS.x;playerPos.z=ZOMBIE_SAFE_HOUSE_POS.z;playerPos.y=1.7;
      gameActive=true;isDowned=false;
      document.getElementById('hud').style.display='block';
      document.getElementById('hpFill').style.width='50%';document.getElementById('hpNum').textContent='50';
      addChat('','🔄 Renasceu na casa segura com 50 HP!',true);
    },3000);
  }else{
    document.getElementById('respawnScreen').style.display='flex';
    gameActive=false;
    let t=5;document.getElementById('respawnNum').textContent=t;
    const iv=setInterval(()=>{t--;document.getElementById('respawnNum').textContent=t;if(t<=0){clearInterval(iv);respawn();}},1000);
  }
}

function revivePlayer(){
  if(!isDowned)return;
  isDowned=false;health=50;
  document.getElementById('downedScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('hpFill').style.width='50%';document.getElementById('hpNum').textContent='50';
  playerPos.y=1.7;gameActive=true;
  addChat('','💉 REANIMADO! +50 HP',true);
  cameraShake(.3);
}

// Atirar com pistola quando derrubado (pressionar espaço)
function downedShoot(){
  if(!isDowned||downedPistolAmmo<=0)return;
  downedPistolAmmo--;
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  // Verificar hit em zumbi
  if(zombieMode){
    checkZombieHits(camera.position,dir,30);
  }
  doMuzzleFlash();
  addChat('','🔫 Pistola: '+downedPistolAmmo+' tiros restantes',true);
}

// Build game mode selector
function buildGameModeGrid(){
  const grid=document.getElementById('gmGrid');
  if(!grid)return;
  grid.innerHTML=GAME_MODES.map(m=>`
    <div class="gms-card${currentGameMode===m.id?' active-mode':''}" onclick="selectGameMode('${m.id}')">
      <div class="gms-card-tag tag-${m.tag}">${m.tagLabel}</div>
      <div class="gms-card-icon">${m.icon}</div>
      <div class="gms-card-name">${m.name}</div>
      <div class="gms-card-desc">${m.desc}</div>
    </div>
  `).join('');
}

function openGameModeSelector(){
  buildGameModeGrid();
  document.getElementById('gameModeSelector').classList.add('open');
  document.getElementById('mainScreen').style.display='none';
}
function closeGameModeSelector(){
  document.getElementById('gameModeSelector').classList.remove('open');
  document.getElementById('mainScreen').style.display='flex';
}

function selectGameMode(id){
  currentGameMode=id;
  closeGameModeSelector();
  const mode=GAME_MODES.find(m=>m.id===id);
  if(!mode)return;
  // Show loadout before starting most modes
  openLoadout(()=>launchGameMode(mode));
}

function launchGameMode(mode){
  document.getElementById('mainScreen').style.display='none';
  showModeSplash(mode.name,mode.desc);
  setTimeout(()=>{
    startGameWithMode(mode);
  },2200);
}

function showModeSplash(name,sub){
  const el=document.getElementById('modeSplash');
  document.getElementById('splashMode').textContent=name;
  document.getElementById('splashSub').textContent=sub;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
  // Cinematic bars
  const cb=document.getElementById('cinematicBars');
  cb.style.display='block';
  setTimeout(()=>cb.style.display='none',2000);
}

function startGameWithMode(mode){
  gameActive=true;
  document.getElementById('hud').style.display='block';
  document.getElementById('compass').style.display='block';
  gameModeScore={blue:0,red:0,player:0};
  killStreakCount=0;
  if(gameModeInterval)clearInterval(gameModeInterval);

  // Mode-specific setup
  applyModeHUD(mode);
  voiceAnnounce('COMBATE INICIADO — '+mode.name);

  if(mode.id==='br')startBattleRoyale(mode);
  else if(mode.id==='zombies'||mode.id==='survival'||mode.id==='boss')startCoopMode(mode);
  else if(mode.id==='nightops')startNightOps();
  else if(mode.id==='nuclear')startNuclearEvent();
  else if(mode.id==='hardcore'||mode.id==='tactical')applyHardcoreSettings(mode);
  else if(mode.id==='ranked')startRankedMode();
  else if(mode.id==='infection')startInfection();
  else if(mode.id==='juggernaut')startJuggernaut();
  else if(mode.id==='sandbox_chaos')startSandbox();

  // Timer
  gameModeTimer=mode.time||300;
  gameModeInterval=setInterval(()=>{
    gameModeTimer--;
    if(gameModeTimer<=0){clearInterval(gameModeInterval);onModeTimeOut(mode);}
    updateModeTimer(mode);
  },1000);

  // Random events
  scheduleRandomEvents(mode);
  addAdminLog('Modo iniciado: '+mode.name,'info');
}

function applyModeHUD(mode){
  document.getElementById('roundMode').textContent=mode.name;
  const m=mode;
  if(m.id==='tdm'||m.id==='ctf'){
    document.getElementById('teamBar').style.display='flex';
    document.getElementById('teamModeLabel').textContent=m.id.toUpperCase();
    playerTeam=Math.random()>.5?'blue':'red';
  }
  if(m.id==='dom'){
    document.getElementById('objPanel').style.display='block';
    document.getElementById('objTitle').textContent='PONTOS DE CONTROLE';
    document.getElementById('objRow1').textContent='[A] ABANDONADO  [B] ABANDONADO';
    document.getElementById('objRow2').textContent='[C] ABANDONADO';
  }
  if(m.id==='br'){
    document.getElementById('brZonePanel').style.display='block';
  }
  if(m.id==='survival'||m.id==='zombies'){
    document.getElementById('waveHUD').style.display='block';
    document.getElementById('zombieWave').style.display='block';
    document.getElementById('zombiePanel').style.display='block';
  }
  if(m.id==='boss'){
    document.getElementById('bossHUD').style.display='block';
  }
  if(m.id==='ranked'){
    document.getElementById('rankedPanel').style.display='block';
  }
  if(m.id==='nightops'){
    document.getElementById('nightOpsOverlay').style.display='block';
  }
}

function updateModeTimer(mode){
  const m=gameModeTimer;
  const mm=String(Math.floor(m/60)).padStart(2,'0');
  const ss=String(m%60).padStart(2,'0');
  document.getElementById('roundTimer').textContent=mm+':'+ss;
  if(mode.id==='nuclear'&&m<=30){
    document.getElementById('nuclearWarning').style.display='block';
    document.getElementById('nukeTimer').textContent=m;
  }
  if(mode.id==='br'&&m%30===0){
    brPlayersAlive=Math.max(1,brPlayersAlive-Math.floor(Math.random()*5+1));
    document.getElementById('brAlive').textContent=brPlayersAlive+' VIVOS';
    document.getElementById('brZoneTime').textContent=mm+':'+ss;
  }
}

// Killstreak system
function checkKillStreak(){
  const now=Date.now();
  if(now-lastKillTime<4000){killStreakCount++;}else{killStreakCount=1;}
  lastKillTime=now;
  const streaks=[
    {n:2,name:'DOUBLE KILL',pts:200},
    {n:3,name:'TRIPLE KILL',pts:400},
    {n:4,name:'QUAD KILL',pts:700},
    {n:5,name:'RAMPAGE',pts:1000},
    {n:7,name:'IMPARÁVEL',pts:1500},
    {n:10,name:'LENDÁRIO',pts:3000},
  ];
  const s=streaks.find(s=>s.n===killStreakCount);
  if(s){showKillstreak(s.name,'+'+s.pts+' PTS');}
  if(currentGameMode==='ranked'){
    const pts=killStreakCount*50;
    const cur=parseInt(document.getElementById('rankedPoints').textContent)||1240;
    document.getElementById('rankedPoints').textContent=cur+pts;
    document.getElementById('rankedChange').textContent='+'+pts+' RP';
  }
}

    const pct=(bossHP/bossMaxHP*100)+'%';
    document.getElementById('bossBar').style.width=pct;
    const phase=bossHP>3333?'FASE 1 — PATRULHA':bossHP>1666?'FASE 2 — FÚRIA':'FASE 3 — MODO BERSERK';
    document.getElementById('bossPhase').textContent=phase;
    if(bossHP<=0){
      clearInterval(dmgInterval);
      voiceAnnounce('BOSS ELIMINADO! VITÓRIA!');
      addKillFeed('EQUIPE','TITAN COMMANDER',false);
    }
  },500);
}

// Random events scheduler
function scheduleRandomEvents(mode){
  const events=[
    {msg:'☢️ CONTAMINAÇÃO QUÍMICA NA ZONA LESTE!',action:()=>cameraShake(.3)},
    {msg:'🚁 HELICÓPTERO INIMIGO DETECTADO!',action:()=>voiceAnnounce('AMEAÇA AÉREA DETECTADA')},
    {msg:'💣 BOMBARDEIO IMINENTE NA ÁREA CENTRAL!',action:()=>{cameraShake(.8);spawnExplosion(new THREE.Vector3(0,0,0));}},
    {msg:'📦 SUPRIMENTO LANÇADO — COORDENADA 120,80',action:()=>addKillFeed('DROP','SUPRIMENTO',false)},
    {msg:'🌩️ TEMPESTADE APROXIMANDO — VISIBILIDADE REDUZIDA',action:()=>{if(scene&&scene.fog)scene.fog.density=0.025;}},
    {msg:'💥 EMP ATIVADO — SISTEMAS TEMPORARIAMENTE OFFLINE',action:()=>{document.getElementById('hud').style.opacity='.3';setTimeout(()=>document.getElementById('hud').style.opacity='1',3000);}},
  ];
  const schedNext=()=>{
    const delay=30000+Math.random()*60000;
    setTimeout(()=>{
      if(!gameActive)return;
      const ev=events[Math.floor(Math.random()*events.length)];
      addChat('','⚡ EVENTO: '+ev.msg,true);
      ev.action();
      schedNext();
    },delay);
  };
  schedNext();
}

      <div class="lp-desc">${it.desc}</div>

function selectLoadoutItem(field,name){
  selectedLoadout[field]=name;
  buildLoadoutUI();

function confirmLoadout(){
  closeLoadout();
  const weapIdx=WEAPONS.findIndex(w=>w.name===selectedLoadout.weapon);
  if(weapIdx>=0)switchWeapon(weapIdx);
  addChat('','⚙ Loadout: '+selectedLoadout.weapon+' | Perk: '+selectedLoadout.perk1,true);
  if(window._loadoutCallback)window._loadoutCallback();
  window._loadoutCallback=null;
}

// Compass update
function updateCompass(){
  const dirs=['N','NE','E','SE','S','SO','O','NO'];
  const angle=((yaw%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const idx=Math.round(angle/(Math.PI*2/8))%8;
  document.getElementById('compassBar').textContent=dirs[idx];
}

// Drones
let activeDrones=[];
function deployDrone(type){
  const drone={id:Date.now(),type:type,battery:100};
  activeDrones.push(drone);
  updateDronePanel();
  addAdminLog('Drone '+type+' lançado','action');
  setTimeout(()=>{
    activeDrones=activeDrones.filter(d=>d.id!==drone.id);
    updateDronePanel();
  },30000);
}
function updateDronePanel(){
  const list=document.getElementById('droneList');
  if(!list)return;
  list.innerHTML=activeDrones.length?activeDrones.map(d=>`
    <div class="drone-item active">🚁 ${d.type} — ATIVO</div>
  `).join(''):'<div class="drone-item">Nenhum drone ativo</div>';
}

function openAdmin(){
  adminOpen=true;
  document.getElementById('adminPanel').classList.add('open');
  if(isPointerLocked)document.exitPointerLock();
  gameActive=false;
  setAdminTab('player');
  buildAdminBg();
  startAdminClock();
  addAdminLog('Painel DEV aberto por '+playerName,'system');
}
function closeAdmin(){
  adminOpen=false;
  document.getElementById('adminPanel').classList.remove('open');
  if(gameActive||document.getElementById('hud').style.display==='block'){
    canvas.requestPointerLock();
    gameActive=true;
  }
  addAdminLog('Painel DEV fechado','system');
}

function buildAdminBg(){
  const bg=document.getElementById('adminBg');
  bg.innerHTML='';
  for(let i=0;i<12;i++){
    const line=document.createElement('div');
    line.className='admin-grid-line';
    line.style.cssText=`left:${Math.random()*100}%;width:1px;height:${30+Math.random()*40}%;animation-delay:${Math.random()*4}s;animation-duration:${3+Math.random()*4}s`;
    bg.appendChild(line);
  }
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='admin-particle';
    const size=2+Math.random()*4;
    p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;background:#00ff88;opacity:0;animation-delay:${Math.random()*8}s;animation-duration:${8+Math.random()*12}s`;
    bg.appendChild(p);
  }
}

let adminClockInterval=null;
function startAdminClock(){
  if(adminClockInterval)clearInterval(adminClockInterval);
  adminClockInterval=setInterval(()=>{
    if(!adminOpen){clearInterval(adminClockInterval);return;}
    const now=new Date();
    document.getElementById('adminClock').textContent=
      String(now.getHours()).padStart(2,'0')+':'+
      String(now.getMinutes()).padStart(2,'0')+':'+
      String(now.getSeconds()).padStart(2,'0');
  },1000);
}

// Admin action functions
function adminAction(action){
  adminStates[action]=!adminStates[action];
  const state=adminStates[action];
  const qbMap={fly:'qbFly',noclip:'qbNoclip',invis:'qbInvis',god:'qbGod',superspeed:'qbSpeed',superjump:'qbJump',freecam:'qbFreecam',slowmo:'qbSlowmo'};
  const qb=document.getElementById(qbMap[action]);
  if(qb)qb.classList.toggle('active',state);

  // Apply effects
  if(action==='fly'){
    addAdminLog('Modo Voo: '+(state?'ON':'OFF'),'action');
    mods.godMode=state;
    if(state)voiceAnnounce('MODO VÔO ATIVADO');
  }else if(action==='god'){
    mods.godMode=state;
    addAdminLog('God Mode: '+(state?'ON':'OFF'),'action');
    if(state)addChat('','♾ GOD MODE ATIVADO',true);
  }else if(action==='superspeed'){
    mods.speedHack=state;
    addAdminLog('Super Velocidade: '+(state?'ON':'OFF'),'action');
  }else if(action==='slowmo'){
    addAdminLog('Slow Motion: '+(state?'ON':'OFF'),'action');
  }else if(action==='invis'){
    addAdminLog('Invisibilidade: '+(state?'ON':'OFF'),'action');
    if(state)addChat('','👻 Você está invisível para os NPCs!',true);
  }else if(action==='noclip'){
    addAdminLog('Noclip: '+(state?'ON':'OFF'),'action');
    if(state)addChat('','Noclip: Você pode atravessar paredes!',true);
  }
  // Re-render toggle state if tab is open
  if(currentAdminTab==='player')renderAdminTab('player');
}

function adminFX(fx){
  const logMap={
    explosion:'Explosão cinemática gerada',nuke:'NUKE ativado',airstrike:'Airstrike realizado',
    meteor:'Chuva de meteoros iniciada',quake:'Terremoto simulado',lightning:'Relâmpago gerado',
    laser:'Laser orbital disparado',emp:'Pulso EMP emitido',smoke:'Cortina de fumaça lançada',
    fog:'Névoa densa ativada',fire:'Incêndio de área iniciado',screen_shake:'Tremor de tela aplicado',
    anticrash:'Sistema anti-crash executado',killall:'Todos os NPCs eliminados',
    teleport_center:'Teleportado para o centro'
  };
  addAdminLog(logMap[fx]||fx,'action');
  if(fx==='explosion'){
    for(let i=0;i<5;i++)setTimeout(()=>spawnExplosion(new THREE.Vector3((Math.random()-.5)*20,0,(Math.random()-.5)*20)),i*200);
    voiceAnnounce('EXPLOSÃO CINEMATOGRÁFICA');
  }else if(fx==='nuke'){
    sbNuke();
    document.getElementById('nuclearWarning').style.display='block';
    document.getElementById('nukeTimer').textContent='BOOM';
    cameraShake(3);
    setTimeout(()=>document.getElementById('nuclearWarning').style.display='none',4000);
  }else if(fx==='meteor'){
    for(let i=0;i<10;i++)setTimeout(()=>{
      const pos=new THREE.Vector3((Math.random()-.5)*100,0,(Math.random()-.5)*100);
      spawnExplosion(pos);cameraShake(.4);
    },i*400);
    voiceAnnounce('CHUVA DE METEOROS!');
  }else if(fx==='quake'){
    let t=0;const iv=setInterval(()=>{cameraShake(.6);t++;if(t>=20)clearInterval(iv);},150);
    addChat('','🌊 TERREMOTO — MAGNITUDE 8.5',true);
  }else if(fx==='laser'){
    flashScreen();cameraShake(1.5);
    const l=new THREE.PointLight(0xff0000,30,80);l.position.set(playerPos.x,20,playerPos.z);scene.add(l);
    setTimeout(()=>scene.remove(l),1000);
    voiceAnnounce('LASER ORBITAL DISPARADO');
  }else if(fx==='screen_shake'){cameraShake(2);}
  else if(fx==='emp'){
    document.getElementById('hud').style.opacity='.1';
    setTimeout(()=>document.getElementById('hud').style.opacity='1',3000);
    addChat('','📡 PULSO EMP — HUD offline por 3s',true);
  }else if(fx==='anticrash'){
    bullets.length=0;particles.length=0;
    addChat('','🛡 Anti-Crash: Arrays limpos, memória liberada.',true);
  }else if(fx==='killall'){
    sbClearEnemies();
    addChat('','💀 Todos os NPCs eliminados.',true);
  }else if(fx==='teleport_center'){sbTeleport(0,0);}
  else if(fx==='fire'){
    for(let i=0;i<8;i++)spawnExplosion(new THREE.Vector3(playerPos.x+(Math.random()-.5)*30,0,playerPos.z+(Math.random()-.5)*30));
  }else if(fx==='fog'){
    if(scene.fog)scene.fog.density=0.05;
    setTimeout(()=>{if(scene.fog)scene.fog.density=0.003;},10000);
  }
}

function admSetWeather(type){
  const presets={clear:{fog:0.002,sky:0x0a1628},rain:{fog:0.01,sky:0x050a12},storm:{fog:0.02,sky:0x020407},night:{fog:0.008,sky:0x010208},fog:{fog:0.05,sky:0x0a0a0a},snow:{fog:0.012,sky:0x151520}};
  const p=presets[type];if(!p)return;
  if(scene.fog)scene.fog.density=p.fog;
  if(scene.background)scene.background.set(p.sky);

}

      <div class="adm-weapon-stat"><div class="adm-weapon-stat-label">CADÊNCIA</div><div class="adm-weapon-stat-bar"><div class="adm-weapon-stat-fill" style="width:${Math.max(0,100-w.rate/30)}%;background:#00ff88"></div></div><div class="adm-weapon-stat-val">${w.rate}ms</div></div>

function admMapClick(event){
  const rect=event.currentTarget.getBoundingClientRect();
  const px=(event.clientX-rect.left)/rect.width;
  const py=(event.clientY-rect.top)/rect.height;
  const x=(px-.5)*400;const z=(py-.5)*400;
  sbTeleport(x,z);
  updateAdminMapPlayer();
  addAdminLog('Teleportado via mapa: ('+Math.round(x)+','+Math.round(z)+')','action');
}
function updateAdminMapPlayer(){
  const el=document.getElementById('admMapPlayer');
  if(!el)return;
  const px=((playerPos.x/400)+.5)*100;const py=((playerPos.z/400)+.5)*100;
  el.style.left=px+'%';el.style.top=py+'%';
}

// Admin log system
function addAdminLog(msg,type='info'){
  const body=document.getElementById('adminLogBody');
  if(!body)return;
  const now=new Date();
  const time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  const entry=document.createElement('div');
  entry.className='log-entry '+type;
  entry.innerHTML=`<span class="log-time">${time}</span>${msg}`;
  body.appendChild(entry);
  body.scrollTop=body.scrollHeight;
  // Keep max 100 entries
  while(body.children.length>100)body.removeChild(body.firstChild);
}
function clearAdminLogs(){
  const body=document.getElementById('adminLogBody');
  if(body)body.innerHTML='';
  addAdminLog('Log limpo','system');
}

// Keyboard shortcut for admin panel
document.addEventListener('keydown',e=>{

    if(shortcuts[e.key]){adminAction(shortcuts[e.key]);e.preventDefault();}

});
