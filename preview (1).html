<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Luau Web Runner</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#0f0f0f;
        color:white;
        height:100vh;
        display:flex;
        flex-direction:column;
    }

    header{
        background:#181818;
        padding:15px;
        border-bottom:2px solid #2c2c2c;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    header h1{
        font-size:20px;
    }

    .main{
        flex:1;
        display:flex;
        overflow:hidden;
    }

    .editor{
        width:70%;
        height:100%;
        border-right:2px solid #2c2c2c;
        display:flex;
        flex-direction:column;
    }

    textarea{
        flex:1;
        background:#111;
        color:#00ff88;
        border:none;
        outline:none;
        resize:none;
        padding:20px;
        font-size:15px;
        line-height:1.5;
    }

    .buttons{
        display:flex;
        gap:10px;
        padding:15px;
        background:#181818;
        border-top:2px solid #2c2c2c;
    }

    button{
        padding:12px 18px;
        border:none;
        cursor:pointer;
        border-radius:8px;
        font-weight:bold;
        transition:0.2s;
    }

    .run{
        background:#00c853;
        color:white;
    }

    .clear{
        background:#ff1744;
        color:white;
    }

    button:hover{
        transform:scale(1.05);
    }

    .console{
        width:30%;
        background:#0b0b0b;
        display:flex;
        flex-direction:column;
    }

    .console h2{
        padding:15px;
        border-bottom:2px solid #2c2c2c;
        background:#161616;
    }

    #output{
        flex:1;
        padding:15px;
        overflow:auto;
        white-space:pre-wrap;
        color:#00ff88;
    }

    .line{
        margin-bottom:8px;
    }

</style>
</head>
<body>

<header>
    <h1>Luau Script Tester</h1>
</header>

<div class="main">

    <div class="editor">
        <textarea id="code">
print("Hello Roblox")

local player = {
    Name = "Player123",
    Health = 100
}

print(player.Name)
print(player.Health)
        </textarea>

        <div class="buttons">
            <button class="run" onclick="runCode()">Executar</button>
            <button class="clear" onclick="clearConsole()">Limpar</button>
        </div>
    </div>

    <div class="console">
        <h2>Console</h2>
        <div id="output"></div>
    </div>

</div>

<script>

const output = document.getElementById("output");

function log(text){
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = text;
    output.appendChild(div);

    output.scrollTop = output.scrollHeight;
}

function clearConsole(){
    output.innerHTML = "";
}

function runCode(){

    clearConsole();

    let code = document.getElementById("code").value;

    try{

        // Fake Luau Parser
        // Simula alguns comandos básicos

        let lines = code.split("\n");

        let variables = {};

        for(let rawLine of lines){

            let line = rawLine.trim();

            if(line.startsWith("print(")){

                let inside = line
                    .replace("print(", "")
                    .replace(")", "")
                    .trim();

                if(inside.startsWith('"') || inside.startsWith("'")){
                    inside = inside.slice(1,-1);
                    log(inside);
                }
                else{

                    if(inside.includes(".")){

                        let split = inside.split(".");
                        let obj = split[0];
                        let prop = split[1];

                        if(variables[obj]){
                            log(variables[obj][prop]);
                        }

                    }else{

                        if(variables[inside] !== undefined){
                            log(variables[inside]);
                        }else{
                            log("nil");
                        }

                    }

                }

            }

            else if(line.startsWith("local ")){

                // local x = 5

                if(line.includes("{")){

                    let name = line
                        .replace("local ","")
                        .split("=")[0]
                        .trim();

                    variables[name] = {};

                }else{

                    let parts = line
                        .replace("local ","")
                        .split("=");

                    let name = parts[0].trim();
                    let value = parts[1].trim();

                    if(!isNaN(value)){
                        value = Number(value);
                    }else{
                        value = value.replace(/['"]/g,"");
                    }

                    variables[name] = value;

                }

            }

            else if(line.includes("=") && !line.startsWith("local")){

                // player.Name = "abc"

                let parts = line.split("=");

                let left = parts[0].trim();
                let right = parts[1].trim();

                right = right.replace(/['"]/g,"");

                if(left.includes(".")){

                    let split = left.split(".");
                    let obj = split[0];
                    let prop = split[1];

                    if(!variables[obj]){
                        variables[obj] = {};
                    }

                    variables[obj][prop] = right;

                }

            }

        }

        log("Script finalizado.");

    }catch(err){

        log("Erro: " + err.message);

    }

}

</script>

</body>
</html>
