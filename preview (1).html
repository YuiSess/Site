<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Game</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial;
    overflow: hidden;
}

/* ÁREA DO JOGO */
.game {
    position: relative;
    width: 100%;
    height: 100vh;
}

/* LINHAS */
.lane {
    position: absolute;
    width: 25%;
    height: 100%;
    border-right: 1px solid #222;
}

.lane:nth-child(1){left:0;}
.lane:nth-child(2){left:25%;}
.lane:nth-child(3){left:50%;}
.lane:nth-child(4){left:75%;}

/* NOTAS */
.note {
    position: absolute;
    width: 20%;
    height: 20px;
    background: cyan;
    border-radius: 5px;
}

/* LINHA DE ACERTO */
.hitline {
    position: absolute;
    bottom: 100px;
    width: 100%;
    height: 5px;
    background: white;
}

/* UI */
.score {
    position: absolute;
    top: 10px;
    left: 10px;
}

.feedback {
    position: absolute;
    bottom: 150px;
    width: 100%;
    text-align: center;
    font-size: 30px;
}
</style>
</head>

<body>

<div class="game" id="game">
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="hitline"></div>
    <div class="score" id="score">Score: 0</div>
    <div class="feedback" id="feedback"></div>
</div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
let game = document.getElementById("game")
let score = 0
let notes = []
let keys = ["a","s","d","f"]

let music = document.getElementById("music")

function spawnNote(){
    let lane = Math.floor(Math.random()*4)
    
    let note = document.createElement("div")
    note.className = "note"
    note.style.left = (lane*25+2.5)+"%"
    note.style.top = "0px"
    
    game.appendChild(note)
    
    notes.push({el: note, lane: lane, y:0})
}

function update(){
    notes.forEach((n,i)=>{
        n.y += 5
        n.el.style.top = n.y+"px"
        
        if(n.y > window.innerHeight){
            n.el.remove()
            notes.splice(i,1)
            showFeedback("MISS")
        }
    })
}

function showFeedback(text){
    let fb = document.getElementById("feedback")
    fb.innerText = text
    setTimeout(()=>fb.innerText="",300)
}

document.addEventListener("keydown", (e)=>{
    let key = e.key.toLowerCase()
    let lane = keys.indexOf(key)
    
    if(lane !== -1){
        for(let i=0;i<notes.length;i++){
            let n = notes[i]
            
            if(n.lane === lane && n.y > window.innerHeight-150 && n.y < window.innerHeight-80){
                score += 100
                document.getElementById("score").innerText = "Score: "+score
                n.el.remove()
                notes.splice(i,1)
                showFeedback("GOOD")
                return
            }
        }
        showFeedback("BAD")
    }
})

setInterval(spawnNote, 600)
setInterval(update, 16)

/* START */
document.body.onclick = ()=>{
    music.play()
}
</script>

</body>
</html>
