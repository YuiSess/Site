<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest — A Aventura do Programador</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a1a;
    --panel: #111128;
    --border: #2a2a5a;
    --accent: #00ffcc;
    --accent2: #ff6b6b;
    --accent3: #ffd93d;
    --text: #c8d8ff;
    --dim: #5a6a9a;
    --success: #39d353;
    --error: #ff4d4d;
    --pixel: 2px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Starfield */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, #fff8 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 60%, #fff6 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 10%, #fff5 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 80%, #fff7 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 75%, #fff4 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 35%, #fff6 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 50%, #fff5 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 45%, #fff7 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  #app {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 24px 0 16px;
    animation: fadeDown 0.6s ease;
  }

  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(18px, 4vw, 28px);
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(0,255,204,0.3);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .logo span { color: var(--accent3); }

  .subtitle {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    margin: 16px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-label {
    font-size: 10px;
    color: var(--dim);
    white-space: nowrap;
    font-family: 'Press Start 2P', monospace;
  }

  .progress-track {
    flex: 1;
    height: 12px;
    background: var(--panel);
    border: var(--pixel) solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px var(--accent);
  }

  /* MAIN GAME AREA */
  .game-area {
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 16px;
    flex: 1;
  }

  @media (max-width: 640px) {
    .game-area { grid-template-columns: 1fr; }
    .sidebar { order: -1; }
  }

  /* PANEL */
  .panel {
    background: var(--panel);
    border: var(--pixel) solid var(--border);
    padding: 20px;
    position: relative;
    box-shadow: 0 0 0 1px rgba(0,255,204,0.05), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  .panel-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* NARRATIVE */
  .narrative-box {
    background: rgba(0,0,0,0.3);
    border-left: 3px solid var(--accent);
    padding: 16px;
    margin-bottom: 18px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
    min-height: 100px;
    position: relative;
  }

  .narrative-character {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--accent3);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .char-avatar {
    display: inline-block;
    width: 24px;
    height: 24px;
    background: var(--accent3);
    color: var(--bg);
    text-align: center;
    line-height: 24px;
    font-size: 14px;
  }

  .narrative-text {
    opacity: 0;
    animation: typeReveal 0.4s ease forwards;
  }

  /* CONCEPT BADGE */
  .concept-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,255,204,0.1);
    border: 1px solid rgba(0,255,204,0.3);
    padding: 4px 10px;
    font-size: 10px;
    color: var(--accent);
    margin-bottom: 14px;
    font-family: 'Press Start 2P', monospace;
  }

  /* CHOICES */
  .choices-label {
    font-size: 10px;
    color: var(--dim);
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .choice-btn {
    background: transparent;
    border: var(--pixel) solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .choice-btn::before {
    content: '▶ ';
    color: var(--dim);
    transition: color 0.15s;
  }

  .choice-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,255,204,0.05);
    transform: translateX(4px);
  }

  .choice-btn:hover::before { color: var(--accent); }

  .choice-btn.correct {
    border-color: var(--success);
    color: var(--success);
    background: rgba(57,211,83,0.1);
    animation: flashCorrect 0.4s ease;
  }

  .choice-btn.wrong {
    border-color: var(--error);
    color: var(--error);
    background: rgba(255,77,77,0.1);
    animation: shake 0.3s ease;
  }

  .choice-btn:disabled { cursor: not-allowed; opacity: 0.5; }

  /* FEEDBACK */
  .feedback {
    margin-top: 16px;
    padding: 14px;
    font-size: 12px;
    line-height: 1.7;
    border-left: 3px solid;
    display: none;
    animation: fadeUp 0.3s ease;
  }

  .feedback.show { display: block; }
  .feedback.correct { border-color: var(--success); color: var(--success); background: rgba(57,211,83,0.07); }
  .feedback.wrong { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,107,0.07); }

  .next-btn {
    margin-top: 14px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 12px 24px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
    display: none;
    box-shadow: 0 4px 0 rgba(0,255,204,0.3);
  }

  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,255,204,0.3); }
  .next-btn:active { transform: translateY(2px); box-shadow: none; }
  .next-btn.show { display: inline-block; }

  /* SIDEBAR */
  .sidebar { display: flex; flex-direction: column; gap: 16px; }

  /* STATS */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 12px;
  }

  .stat-label { color: var(--dim); font-size: 10px; }

  .stat-value {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--accent3);
  }

  .stat-value.lives { color: var(--accent2); }

  /* XP BAR */
  .xp-bar {
    height: 8px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    margin-top: 4px;
    overflow: hidden;
  }

  .xp-fill {
    height: 100%;
    background: var(--accent3);
    transition: width 0.5s ease;
    box-shadow: 0 0 8px var(--accent3);
  }

  /* CONCEPT MAP */
  .concept-list { display: flex; flex-direction: column; gap: 6px; }

  .concept-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    transition: all 0.3s;
  }

  .concept-item.unlocked {
    border-color: rgba(0,255,204,0.4);
    color: var(--accent);
    background: rgba(0,255,204,0.05);
  }

  .concept-item.locked { color: var(--dim); }

  .concept-dot {
    width: 8px;
    height: 8px;
    background: var(--border);
    flex-shrink: 0;
    transition: all 0.3s;
  }

  .concept-item.unlocked .concept-dot {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 2s infinite;
  }

  /* ENDING SCREEN */
  #ending {
    display: none;
    text-align: center;
    padding: 40px 20px;
    animation: fadeUp 0.6s ease;
  }

  #ending.show { display: block; }

  .trophy {
    font-size: 64px;
    margin-bottom: 16px;
    animation: bounce 1s ease infinite alternate;
    display: block;
  }

  .ending-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3vw, 22px);
    color: var(--accent3);
    text-shadow: 0 0 20px var(--accent3);
    margin-bottom: 16px;
  }

  .ending-score {
    font-size: 14px;
    color: var(--dim);
    margin-bottom: 24px;
    line-height: 2;
  }

  .restart-btn {
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    padding: 14px 32px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }

  .restart-btn:hover {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 20px var(--accent);
  }

  /* ANIMATIONS */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes typeReveal { from { opacity: 0; } to { opacity: 1; } }
  @keyframes flashCorrect { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  @keyframes glow { 0%,100% { text-shadow: 0 0 20px var(--accent); } 50% { text-shadow: 0 0 40px var(--accent), 0 0 60px rgba(0,255,204,0.5); } }
</style>
</head>
<body>
<div class="scanlines"></div>
<div id="app">
  <header>
    <div class="logo">Code<span>Quest</span></div>
    <div class="subtitle">A Aventura do Programador</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label" id="progressLabel">0/7</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progressPct">0%</div>
  </div>

  <div class="game-area" id="gameArea">
    <!-- MAIN -->
    <div>
      <div class="panel">
        <div class="panel-title" id="chapterLabel">Capítulo 1</div>

        <div class="concept-badge" id="conceptBadge">📦 Variáveis</div>

        <div class="narrative-box">
          <div class="narrative-character">
            <span class="char-avatar">🧙</span>
            <span id="charName">MESTRE BYTE</span>
          </div>
          <div class="narrative-text" id="narrativeText"></div>
        </div>

        <div class="choices-label">// ESCOLHA SUA AÇÃO:</div>
        <div class="choices" id="choices"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextScene()">CONTINUAR ▶</button>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">⚡ STATUS</div>
        <div class="stat-row">
          <span class="stat-label">VIDAS</span>
          <span class="stat-value lives" id="livesDisplay">❤️❤️❤️</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">PONTOS</span>
          <span class="stat-value" id="scoreDisplay">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">NÍVEL</span>
          <span class="stat-value" id="levelDisplay">1</span>
        </div>
        <div style="margin-top:10px;">
          <div class="stat-label" style="margin-bottom:4px;">EXP</div>
          <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">📚 CONCEITOS</div>
        <div class="concept-list" id="conceptList"></div>
      </div>
    </div>
  </div>

  <!-- ENDING -->
  <div class="panel" id="ending">
    <span class="trophy" id="trophyIcon">🏆</span>
    <div class="ending-title" id="endingTitle">MISSÃO COMPLETA!</div>
    <div class="ending-score" id="endingScore"></div>
    <div style="margin-bottom:24px; font-size:13px; color:var(--dim); line-height:1.8;" id="endingMsg"></div>
    <button class="restart-btn" onclick="restartGame()">↺ JOGAR NOVAMENTE</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// GAME DATA
// ─────────────────────────────────────────────
const scenes = [
  {
    id: 0,
    chapter: "Capítulo 1: O Início da Jornada",
    concept: "📦 Variáveis",
    conceptKey: "Variáveis",
    character: "🧙 MESTRE BYTE",
    narrative: `Bem-vindo, jovem aprendiz! Você chegou ao Reino do Código, onde feitiços são escritos em linguagem de programação.\n\nSua primeira missão: ajudar o aldeão Pedro a guardar o seu tesouro. No mundo da programação, guardamos informações em <strong>variáveis</strong> — como caixas com etiquetas.\n\nPedro quer guardar seu nome. Como você escreveria isso em código?`,
    choices: [
      { text: 'nomeDoUsuario = "Pedro"', correct: true },
      { text: '"Pedro" nomeDoUsuario', correct: false },
      { text: 'guardar(Pedro)', correct: false },
      { text: 'Pedro → nome', correct: false },
    ],
    feedbackCorrect: '✅ Perfeito! Você criou uma variável chamada "nomeDoUsuario" e guardou o valor "Pedro" dentro dela. É como colocar um bilhete escrito "Pedro" numa caixa rotulada "nomeDoUsuario"!',
    feedbackWrong: '❌ Quase! Variáveis seguem o padrão: nome = valor. O nome vem primeiro, depois o sinal de igual e, por fim, o valor que queremos guardar.'
  },
  {
    id: 1,
    chapter: "Capítulo 2: O Oráculo das Condições",
    concept: "🔀 Condicionais (if/else)",
    conceptKey: "Condicionais",
    character: "🔮 ORÁCULO LÓGIX",
    narrative: `O Oráculo Lógix guarda a ponte para o próximo reino. Ele só deixa passar quem tem mais de 18 anos de experiência.\n\nPara atravessar, você precisa criar uma <strong>condição</strong> — uma verificação que testa se algo é verdade ou falso.\n\nO aventureiro tem 20 anos de experiência. Qual código libera a passagem?`,
    choices: [
      { text: 'if (experiencia > 18): pode_passar = True', correct: true },
      { text: 'experiencia == 18: passar()', correct: false },
      { text: 'se experiencia então True', correct: false },
      { text: 'experiencia(> 18)', correct: false },
    ],
    feedbackCorrect: '✅ Excelente! O "if" verifica uma condição. Se ela for verdadeira, executa o bloco de código. Você dominou as condicionais!',
    feedbackWrong: '❌ O "if" (se, em inglês) deve vir antes da condição, seguido de dois-pontos. Ex: if (condição): ação'
  },
  {
    id: 2,
    chapter: "Capítulo 3: A Floresta dos Loops",
    concept: "🔁 Loops (repetição)",
    conceptKey: "Loops",
    character: "🌲 GUARDIÃO LOOPUS",
    narrative: `Na floresta mágica, há 5 árvores encantadas. Cada uma precisa ser regada para florescer. Fazer isso manualmente seria tedioso...\n\nO Guardião Loopus ensina: use um <strong>loop</strong> para repetir uma ação várias vezes sem escrever o mesmo código repetidamente!\n\nQual código rega as 5 árvores automaticamente?`,
    choices: [
      { text: 'regar(arvore1)\nregar(arvore2)\nregar(arvore3)', correct: false },
      { text: 'for i in range(5):\n   regar(arvore)', correct: true },
      { text: 'regar * 5', correct: false },
      { text: 'loop(arvore, 5)', correct: false },
    ],
    feedbackCorrect: '✅ Brilhante! O "for" repete o bloco 5 vezes automaticamente. É muito mais eficiente do que escrever regar() cinco vezes!',
    feedbackWrong: '❌ Loops usam palavras-chave como "for" ou "while". O padrão é: for variavel in range(quantidade): ação'
  },
  {
    id: 3,
    chapter: "Capítulo 4: A Torre das Funções",
    concept: "⚙️ Funções",
    conceptKey: "Funções",
    character: "🏰 ARQUITETO FUNCIO",
    narrative: `No topo da Torre das Funções, o Arquiteto Funcio explica:\n\n"Uma <strong>função</strong> é como um feitiço nomeado. Você o define uma vez e pode usá-lo quantas vezes quiser!"\n\nVocê quer criar um feitiço chamado "saudar" que exibe "Olá, Mundo!". Como definir essa função?`,
    choices: [
      { text: 'saudar = "Olá, Mundo!"', correct: false },
      { text: 'def saudar():\n   print("Olá, Mundo!")', correct: true },
      { text: 'function saudar "Olá"', correct: false },
      { text: 'criar saudar() → "Olá"', correct: false },
    ],
    feedbackCorrect: '✅ Magistral! "def" define uma nova função. Os parênteses guardam os parâmetros. O código da função fica indentado abaixo.',
    feedbackWrong: '❌ Em Python, funções são definidas com "def nome(): código". O "def" é a palavra mágica que cria uma nova função!'
  },
  {
    id: 4,
    chapter: "Capítulo 5: O Mercado das Listas",
    concept: "📋 Listas",
    conceptKey: "Listas",
    character: "🛒 MERCADOR LISTUS",
    narrative: `No mercado, o Mercador Listus vende poções. Ele precisa guardar os nomes de todas elas em um único lugar.\n\nEm programação, usamos <strong>listas</strong> (ou arrays) para guardar vários valores numa só variável — como uma prateleira com vários potes!\n\nComo criar uma lista com as poções: "cura", "força" e "velocidade"?`,
    choices: [
      { text: 'pocoes = ("cura", "força", "velocidade")', correct: false },
      { text: 'pocoes = ["cura", "força", "velocidade"]', correct: true },
      { text: 'pocoes = {cura, força, velocidade}', correct: false },
      { text: 'pocoes = cura + força + velocidade', correct: false },
    ],
    feedbackCorrect: '✅ Perfeito! Listas usam colchetes []. Cada item é separado por vírgula. Você pode acessar qualquer item pela sua posição (índice)!',
    feedbackWrong: '❌ Listas usam colchetes []. Os parênteses () são para tuplas e as chaves {} para dicionários ou sets.'
  },
  {
    id: 5,
    chapter: "Capítulo 6: O Castelo dos Erros",
    concept: "🛡️ Debug (depuração)",
    conceptKey: "Debug",
    character: "🐛 DETECTIVE BUGIUS",
    narrative: `Alarme no Castelo! Um feitiço com erro está causando caos. O Detetive Bugius pede sua ajuda.\n\nO código abaixo deveria mostrar "Boa tarde", mas está falhando:\n\n<code style="color:#ffd93d;background:rgba(0,0,0,0.4);padding:6px 10px;display:block;margin:8px 0;">imprim("Boa tarde")</code>\n\nQual é o erro e como corrigi-lo?`,
    choices: [
      { text: 'O texto precisa de aspas simples: imprim(\'Boa tarde\')', correct: false },
      { text: 'A função está escrita errada: o correto é print("Boa tarde")', correct: true },
      { text: 'Falta um ponto-e-vírgula no final', correct: false },
      { text: 'Não há erro, o código está correto', correct: false },
    ],
    feedbackCorrect: '✅ Olhos afiados! "imprim" não existe — a função correta é "print". Erros de digitação (typos) são os bugs mais comuns!',
    feedbackWrong: '❌ O problema é o nome da função: "imprim" não existe em Python. A função correta para exibir texto é "print".'
  },
  {
    id: 6,
    chapter: "Capítulo 7: O Templo Final",
    concept: "🌐 Conceito Geral",
    conceptKey: "Lógica",
    character: "✨ SÁBIA SYNTAXIS",
    narrative: `Você chegou ao Templo Final! A Sábia Syntaxis apresenta o desafio derradeiro.\n\nUm programa deve: guardar a idade do usuário, verificar se tem 18+ anos, e exibir "Acesso permitido" ou "Acesso negado".\n\nQual estrutura de código resolve isso corretamente?`,
    choices: [
      { text: 'idade = 20\nif idade >= 18:\n   print("Acesso permitido")\nelse:\n   print("Acesso negado")', correct: true },
      { text: 'if (idade > 18) print("ok") else print("nao")', correct: false },
      { text: 'verificar(idade, 18, "Acesso")', correct: false },
      { text: 'idade = 20; idade >= 18; mostrar("Acesso")', correct: false },
    ],
    feedbackCorrect: '🎉 INCRÍVEL! Você usou variável + condicional + else perfeitamente! Dominou os fundamentos da programação!',
    feedbackWrong: '❌ A estrutura correta usa: variável para guardar a idade, "if" com dois-pontos, bloco de código indentado, e "else" para o caso negativo.'
  }
];

// ─────────────────────────────────────────────
// GAME STATE
// ─────────────────────────────────────────────
let state = {
  scene: 0,
  lives: 3,
  score: 0,
  xp: 0,
  level: 1,
  unlockedConcepts: [],
  answered: false
};

// ─────────────────────────────────────────────
// CONCEPT MAP
// ─────────────────────────────────────────────
const allConcepts = [
  { key: "Variáveis",    icon: "📦" },
  { key: "Condicionais", icon: "🔀" },
  { key: "Loops",        icon: "🔁" },
  { key: "Funções",      icon: "⚙️" },
  { key: "Listas",       icon: "📋" },
  { key: "Debug",        icon: "🛡️" },
  { key: "Lógica",       icon: "🌐" },
];

function renderConceptList() {
  const list = document.getElementById('conceptList');
  list.innerHTML = allConcepts.map(c => {
    const unlocked = state.unlockedConcepts.includes(c.key);
    return `<div class="concept-item ${unlocked ? 'unlocked' : 'locked'}">
      <div class="concept-dot"></div>
      <span>${c.icon} ${c.key}</span>
    </div>`;
  }).join('');
}

// ─────────────────────────────────────────────
// RENDER SCENE
// ─────────────────────────────────────────────
function renderScene() {
  const s = scenes[state.scene];
  state.answered = false;

  document.getElementById('chapterLabel').textContent = s.chapter;
  document.getElementById('conceptBadge').textContent = s.concept;
  document.getElementById('charName').textContent = s.character;

  const narrativeEl = document.getElementById('narrativeText');
  narrativeEl.style.animation = 'none';
  narrativeEl.innerHTML = s.narrative.replace(/\n/g, '<br>');
  void narrativeEl.offsetWidth;
  narrativeEl.style.animation = 'typeReveal 0.5s ease forwards';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = s.choices.map((c, i) =>
    `<button class="choice-btn" onclick="selectChoice(${i})">${c.text.replace(/\n/g,'<br>')}</button>`
  ).join('');

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').className = 'next-btn';

  updateUI();
  renderConceptList();
}

// ─────────────────────────────────────────────
// SELECT CHOICE
// ─────────────────────────────────────────────
function selectChoice(idx) {
  if (state.answered) return;
  state.answered = true;

  const s = scenes[state.scene];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.disabled = true);

  const choice = s.choices[idx];
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');

  if (choice.correct) {
    btns[idx].className = 'choice-btn correct';
    state.score += 100;
    state.xp = Math.min(state.xp + 30, 100);
    if (state.xp >= 100) { state.xp = 0; state.level++; }
    if (!state.unlockedConcepts.includes(s.conceptKey)) {
      state.unlockedConcepts.push(s.conceptKey);
    }
    feedback.className = 'feedback correct show';
    feedback.innerHTML = s.feedbackCorrect;
  } else {
    btns[idx].className = 'choice-btn wrong';
    state.lives = Math.max(0, state.lives - 1);
    // Reveal correct
    s.choices.forEach((c, i) => {
      if (c.correct) btns[i].className = 'choice-btn correct';
    });
    feedback.className = 'feedback wrong show';
    feedback.innerHTML = s.feedbackWrong;
  }

  nextBtn.className = 'next-btn show';
  updateUI();
  renderConceptList();
}

// ─────────────────────────────────────────────
// NEXT SCENE
// ─────────────────────────────────────────────
function nextScene() {
  state.scene++;
  if (state.scene >= scenes.length) {
    showEnding();
  } else {
    renderScene();
  }
  updateProgress();
}

// ─────────────────────────────────────────────
// UPDATE UI
// ─────────────────────────────────────────────
function updateUI() {
  const hearts = ['','❤️','❤️❤️','❤️❤️❤️'];
  document.getElementById('livesDisplay').textContent = hearts[state.lives] || '💀';
  document.getElementById('scoreDisplay').textContent = state.score;
  document.getElementById('levelDisplay').textContent = state.level;
  document.getElementById('xpFill').style.width = state.xp + '%';
}

function updateProgress() {
  const pct = Math.round((state.scene / scenes.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${Math.min(state.scene, scenes.length)}/${scenes.length}`;
  document.getElementById('progressPct').textContent = pct + '%';
}

// ─────────────────────────────────────────────
// ENDING
// ─────────────────────────────────────────────
function showEnding() {
  document.getElementById('gameArea').style.display = 'none';
  const ending = document.getElementById('ending');
  ending.className = 'panel show';

  const pct = Math.round((state.unlockedConcepts.length / allConcepts.length) * 100);
  const perfect = state.lives === 3;

  document.getElementById('trophyIcon').textContent = perfect ? '🏆' : state.lives > 0 ? '🥈' : '🎖️';
  document.getElementById('endingTitle').textContent = perfect ? 'PERFEITO! LENDÁRIO!' : state.lives > 0 ? 'MISSÃO COMPLETA!' : 'VOCÊ CONSEGUIU!';
  document.getElementById('endingScore').innerHTML = `
    Pontuação Final: <strong style="color:var(--accent3)">${state.score}</strong><br>
    Nível Alcançado: <strong style="color:var(--accent)">${state.level}</strong><br>
    Conceitos Dominados: <strong style="color:var(--success)">${state.unlockedConcepts.length}/${allConcepts.length}</strong><br>
    Vidas Restantes: ${'❤️'.repeat(state.lives) || '💀'}
  `;
  document.getElementById('endingMsg').innerHTML =
    `Você aprendeu: <strong style="color:var(--accent)">${state.unlockedConcepts.join(', ')}</strong>.<br>
    Esses são os blocos fundamentais de qualquer programa! Continue praticando e logo você estará criando seus próprios projetos. 🚀`;
}

// ─────────────────────────────────────────────
// RESTART
// ─────────────────────────────────────────────
function restartGame() {
  state = { scene: 0, lives: 3, score: 0, xp: 0, level: 1, unlockedConcepts: [], answered: false };
  document.getElementById('gameArea').style.display = 'grid';
  document.getElementById('ending').className = 'panel';
  updateProgress();
  renderScene();
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderConceptList();
renderScene();
updateProgress();
</script>
</body>
</html>
