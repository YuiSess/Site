// ════ ROOM MONSTER ════
class RoomMonster{
  constructor(){
    this.grp=new THREE.Group();
    this.build();
    // Start in corner, crouching
    this.grp.position.set(-4,0,-4);
    scene.add(this.grp);
    this.state='lurk'; // lurk, investigate, prepare, burst
    this.investigateTarget=new THREE.Vector3();
    this.timer=0;
    this.burstTimer=0;
  }
  build(){
    const m=new THREE.MeshLambertMaterial({color:0x080808});
    const m2=new THREE.MeshLambertMaterial({color:0x100810});
    // Tall, thin body
    // Torso
    const torso=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,1.4,8),m);torso.position.y=2.8;this.grp.add(torso);
    // Neck
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.15,0.4,6),m2);neck.position.y=3.8;this.grp.add(neck);
    // Head - distorted
    const head=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.62,0.5),m2);head.position.set(0,4.22,0.05);head.rotation.z=0.12;this.grp.add(head);this.headMesh=head;
    // Eyes
    const eM=new THREE.MeshBasicMaterial({color:0xcc0000});
    const e1=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),eM);e1.position.set(-0.14,4.25,0.27);this.grp.add(e1);this.eye1=e1;
    const e2=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),eM);e2.position.set(0.14,4.25,0.27);this.grp.add(e2);this.eye2=e2;
    // Eye light
    const el=new THREE.PointLight(0x880000,1.5,6);el.position.set(0,4.25,0.4);this.grp.add(el);this.eyeLight=el;
    // Pelvis
    const pelvis=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.2,0.45,8),m);pelvis.position.y=2.0;this.grp.add(pelvis);
    // Arms - long, spindly
    this.armL=new THREE.Group();
    const alUpper=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,1.1,6),m);alUpper.position.y=-0.55;this.armL.add(alUpper);
    const alLower=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,0.95,6),m2);alLower.position.y=-1.45;this.armL.add(alLower);
    const alHand=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.25,0.1),m2);alHand.position.y=-2.0;this.armL.add(alHand);
    this.armL.position.set(-0.38,3.5,0);this.armL.rotation.z=0.4;this.grp.add(this.armL);
    this.armR=new THREE.Group();
    const arUpper=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,1.1,6),m);arUpper.position.y=-0.55;this.armR.add(arUpper);
    const arLower=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,0.95,6),m2);arLower.position.y=-1.45;this.armR.add(arLower);
    const arHand=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.25,0.1),m2);arHand.position.y=-2.0;this.armR.add(arHand);
    this.armR.position.set(0.38,3.5,0);this.armR.rotation.z=-0.4;this.grp.add(this.armR);
    // Legs
    this.legL=new THREE.Group();
    const llUpper=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.2,7),m);llUpper.position.y=-0.6;this.legL.add(llUpper);
    const llLower=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,1.0,6),m2);llLower.position.y=-1.6;this.legL.add(llLower);
    const llFoot=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.14,0.38),m2);llFoot.position.set(0,-2.18,0.1);this.legL.add(llFoot);
    this.legL.position.set(-0.22,2.1,0);this.grp.add(this.legL);
    this.legR=new THREE.Group();
    const lrUpper=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.2,7),m);lrUpper.position.y=-0.6;this.legR.add(lrUpper);
    const lrLower=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,1.0,6),m2);lrLower.position.y=-1.6;this.legR.add(lrLower);
    const lrFoot=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.14,0.38),m2);lrFoot.position.set(0,-2.18,0.1);this.legR.add(lrFoot);
    this.legR.position.set(0.22,2.1,0);this.grp.add(this.legR);
    // Scale taller
    this.grp.scale.set(1,1.15,1);
  }
  update(dt,playerPos,noiseLevel){
    if(!G.inStartRoom||G.roomEscaped){if(this.grp.parent)scene.remove(this.grp);return;}
    const t=performance.now()*0.001;
    this.timer+=dt;

    // Animate
    const spd=this.state==='burst'?14:this.state==='prepare'?6:3;
    this.legL.rotation.x=Math.sin(t*spd)*0.5;
    this.legR.rotation.x=-Math.sin(t*spd)*0.5;
    this.armL.rotation.x=Math.sin(t*spd+0.5)*0.3;
    this.armR.rotation.x=-Math.sin(t*spd+0.5)*0.3;
    this.headMesh.rotation.y=Math.sin(t*0.7)*0.2;
    // Eye pulse
    const eyePulse=0.8+Math.sin(t*3)*0.4;
    this.eyeLight.intensity=this.state==='lurk'?0.5*eyePulse:this.state==='prepare'?2.5*eyePulse:1.2*eyePulse;

    if(this.state==='lurk'){
      // Slowly patrol corners
      const corners=[new THREE.Vector3(-4,0,-4),new THREE.Vector3(4,0,-4),new THREE.Vector3(-4,0,3),new THREE.Vector3(-3,0,4.5)];
      if(!this._pIdx)this._pIdx=0;
      const tgt=corners[this._pIdx];
      const d=this.grp.position.distanceTo(tgt);
      if(d<0.5){this._pIdx=(this._pIdx+1)%corners.length;}
      else{
        const dir=new THREE.Vector3().subVectors(tgt,this.grp.position);dir.y=0;dir.normalize();
        this.grp.position.addScaledVector(dir,0.018);
        this.grp.rotation.y=Math.atan2(dir.x,dir.z);
      }
      // React to noise
      if(noiseLevel>0.3){
        this.state='investigate';
        this.investigateTarget.copy(playerPos).add(new THREE.Vector3((Math.random()-0.5)*3,(0),(Math.random()-0.5)*3));
        showMsg('!');
        G.monsterPreparedness=Math.min(1,G.monsterPreparedness+noiseLevel*0.15);
      }
    } else if(this.state==='investigate'){
      const d=this.grp.position.distanceTo(this.investigateTarget);
      if(d<0.6||this.timer>8){
        this.state='lurk';this.timer=0;
        if(G.monsterPreparedness>0.7){this.state='prepare';}
      } else {
        const dir=new THREE.Vector3().subVectors(this.investigateTarget,this.grp.position);dir.y=0;dir.normalize();
        this.grp.position.addScaledVector(dir,0.035);
        this.grp.rotation.y=Math.atan2(dir.x,dir.z);
      }
      if(noiseLevel>0.5){G.monsterPreparedness=Math.min(1,G.monsterPreparedness+dt*0.3);}
    } else if(this.state==='prepare'){
      // Monster goes to door, ready to burst
      const doorPos=new THREE.Vector3(0,0,4.5);
      const d=this.grp.position.distanceTo(doorPos);
      if(d>0.4){
        const dir=new THREE.Vector3().subVectors(doorPos,this.grp.position);dir.y=0;dir.normalize();
        this.grp.position.addScaledVector(dir,0.05);
        this.grp.rotation.y=Math.atan2(dir.x,dir.z);
      }
      G.monsterPreparing=true;
      if(noiseLevel>0.4){G.monsterPreparedness=Math.min(1,G.monsterPreparedness+dt*0.6);}
      if(G.monsterPreparedness>=1){this.state='burst';this.burstTimer=0;}
    } else if(this.state==='burst'){
      // Chase player in room
      const dir=new THREE.Vector3().subVectors(playerPos,this.grp.position);dir.y=0;
      if(dir.lengthSq()>0.001){dir.normalize();this.grp.position.addScaledVector(dir,0.1);this.grp.rotation.y=Math.atan2(dir.x,dir.z);}
      const dist=this.grp.position.distanceTo(playerPos);
      if(dist<1.2){roomCaught();}
    }
    G.monsterDist=this.grp.position.distanceTo(playerPos);
    G.nearMonster=G.monsterDist<6;
  }
}

      const display=document.getElementById('p1-display');
      const arr=['_','_','_'];
      puzzle1Input.forEach((v,i)=>arr[i]=v);
      display.textContent=arr.join(' ');

    this.armL.position.set(-0.62,4.18,0);this.armL.rotation.z=0.38;this.grp.add(this.armL);
    this.armR=new THREE.Group();
    const arU=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.12,1.15,7),m);arU.position.y=-0.57;this.armR.add(arU);
    const arL=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,1.0,6),m2);arL.position.y=-1.57;this.armR.add(arL);
    const arH=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6),m2);arH.position.y=-2.1;this.armR.add(arH);
    for(let f=0;f<3;f++){const fi=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.015,0.22,4),m2);fi.position.set((f-1)*0.06,-2.28,0.04);fi.rotation.x=0.3;this.armR.add(fi);}
    this.armR.position.set(0.62,4.18,0);this.armR.rotation.z=-0.38;this.grp.add(this.armR);
    // Pelvis
    const pelvis=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.24,0.5,8),m);pelvis.position.y=2.2;this.grp.add(pelvis);
    // Legs
    this.legL=new THREE.Group();
    const llU=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.15,1.4,7),m);llU.position.y=-0.7;this.legL.add(llU);
    const llL=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.13,1.2,6),m2);llL.position.y=-1.9;this.legL.add(llL);
    const llF=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.16,0.44),m2);llF.position.set(0,-2.58,0.12);this.legL.add(llF);
    this.legL.position.set(-0.26,2.25,0);this.grp.add(this.legL);
    this.legR=new THREE.Group();
    const lrU=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.15,1.4,7),m);lrU.position.y=-0.7;this.legR.add(lrU);
    const lrL=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.13,1.2,6),m2);lrL.position.y=-1.9;this.legR.add(lrL);
    const lrF=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.16,0.44),m2);lrF.position.set(0,-2.58,0.12);this.legR.add(lrF);
    this.legR.position.set(0.26,2.25,0);this.grp.add(this.legR);
    this.grp.scale.set(1,1.1,1);
  }
  update(dt,playerPos){
    if(G.inStartRoom){G.monsterDist=999;G.nearMonster=false;return;}
    if(G.inCar){G.monsterDist=999;G.nearMonster=false;return;}
    this.stTimer+=dt;
    const dist=this.grp.position.distanceTo(playerPos);
    G.monsterDist=dist;
    if(dist<10&&flashlightOn){this.state='chase';this.alertLv=Math.min(1,this.alertLv+dt*0.6);}
    else if(dist<30){this.alertLv=Math.min(1,this.alertLv+dt*0.08);if(this.alertLv>0.65)this.state='stalk';}
    else{this.alertLv=Math.max(0,this.alertLv-dt*0.04);if(this.stTimer>12){this.state='patrol';this.stTimer=0;}}
    let target;
    if(this.state==='chase'){this.speed=0.07;target=playerPos;}
    else if(this.state==='stalk'){this.speed=0.025;target=dist>35?playerPos:null;}
    else{this.speed=0.026;target=this.patrol[this.pIdx];if(this.grp.position.distanceTo(target)<3)this.pIdx=(this.pIdx+1)%this.patrol.length;}
    if(target){
      const dir=new THREE.Vector3().subVectors(target,this.grp.position);dir.y=0;
      if(dir.lengthSq()>0.001){dir.normalize();this.grp.position.addScaledVector(dir,this.speed);this.grp.rotation.y=Math.atan2(dir.x,dir.z);}
    }
    const t2=performance.now()*0.001;
    const ws=this.state==='chase'?9:3;
    this.legL.rotation.x=Math.sin(t2*ws)*0.42;this.legR.rotation.x=-Math.sin(t2*ws)*0.42;
    this.armL.rotation.x=Math.sin(t2*ws)*0.28;this.armR.rotation.x=-Math.sin(t2*ws)*0.28;
    this.headMesh.rotation.y=Math.sin(t2*0.65)*0.18;
    this.grp.position.y=Math.abs(Math.sin(t2*ws))*0.08;
    const eyePulse=0.7+Math.sin(t2*4)*0.5;
    this.eyeLight.intensity=this.state==='chase'?2.5*eyePulse:1.0*eyePulse;
    G.nearMonster=dist<20;
  }
}

    const tM=new THREE.MeshBasicMaterial({color:0x991100});
    if(Math.random()>0.4){
      const tape=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.06,0.08),tM);
      tape.position.set(0.35,1.0,0.3);
      tape.userData={type:'tape_car',collected:false,lore:'"Encontrei isso no banco de trás... era de alguém que passou por aqui. A rua consome tudo."'};
      this.grp.add(tape);this.items.push(tape);
    }
    if(Math.random()>0.5){
      const paper=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.01,0.12),new THREE.MeshLambertMaterial({color:0xddccaa}));
      paper.position.set(-0.3,0.98,-0.3);
      paper.userData={type:'note',collected:false,lore:'"Nota: NÃO SAIA DO CARRO. Ele não te vê se você estiver dentro."'};
      this.grp.add(paper);this.items.push(paper);
    }
  }
  update(dt){
    if(!this.occupied)return;
    const acc=keys['KeyW']?1:(keys['KeyS']?-0.6:0);
    const str=keys['KeyA']?1:(keys['KeyD']?-1:0);
    const maxSpd=keys['ShiftLeft']||keys['ShiftRight']?22:12;
    this.speed+=acc*12*dt;
    this.speed*=0.92;
    this.speed=Math.max(-5,Math.min(maxSpd,this.speed));
    if(Math.abs(this.speed)>0.2)this.heading+=str*(this.speed/maxSpd)*1.8*dt;
    this.grp.rotation.y=this.heading;
    this.grp.position.x+=Math.sin(this.heading)*this.speed*dt;
    this.grp.position.z+=Math.cos(this.heading)*this.speed*dt;
    this.grp.position.x=Math.max(-440,Math.min(440,this.grp.position.x));
    this.grp.position.z=Math.max(-440,Math.min(440,this.grp.position.z));
    this.headlightL.intensity=1.5;
    const kmh=Math.round(Math.abs(this.speed)*3.6);
    document.getElementById('car-speed-txt').textContent=kmh+' km/h';
    camera.position.set(this.grp.position.x,this.grp.position.y+1.4,this.grp.position.z);
    camera.position.x+=Math.sin(this.heading)*0.15;
    camera.position.z+=Math.cos(this.heading)*0.15;
  }
}

    const b=new THREE.Mesh(new THREE.BoxGeometry(22,22,22),m);b.position.set(x,11,z);b.castShadow=true;scene.add(b);
    const w=new THREE.Mesh(new THREE.BoxGeometry(8,12,30),m);w.position.set(x+15,6,z);scene.add(w);

    const hl=new THREE.PointLight(0x220000,0.7,30);hl.position.set(x,11,z);scene.add(hl);
  }else if(type==='bridge'){
    const br=new THREE.Mesh(new THREE.BoxGeometry(8,0.5,100),m);br.position.set(x,0.25,z+50);scene.add(br);
    for(let i=0;i<20;i++){
      [3.8,-(3.8)].forEach(rx=>{
        const r=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.4,0.1),m);r.position.set(x+rx,1.0,z+i*5);scene.add(r);
        const rail=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,100),m);rail.position.set(x+rx,1.7,z+50);scene.add(rail);
      });
    }
  }else if(type==='warehouse'){
    const w=new THREE.Mesh(new THREE.BoxGeometry(30,14,50),m);w.position.set(x,7,z);w.castShadow=true;scene.add(w);
    const wl=new THREE.PointLight(0x110000,0.5,30);wl.position.set(x,9,z);scene.add(wl);
  }else if(type==='church'){
    const b=new THREE.Mesh(new THREE.BoxGeometry(14,16,22),m);b.position.set(x,8,z);b.castShadow=true;scene.add(b);
    const spire=new THREE.Mesh(new THREE.CylinderGeometry(0.3,1.5,14,5),m);spire.position.set(x,23,z);scene.add(spire);
    const cl=new THREE.PointLight(0x000011,0.3,22);cl.position.set(x,14,z);scene.add(cl);
  }
}

const PLAYER_COLORS=[0x334488,0x884433,0x338855,0x664488,0x886633];
const remotePlayers={};
function getOrCreateRemote(key,name){
  if(remotePlayers[key])return remotePlayers[key];
  const color=PLAYER_COLORS[Object.keys(remotePlayers).length%PLAYER_COLORS.length];
  const grp=new THREE.Group();const mat=new THREE.MeshLambertMaterial({color});
  // Better remote player model
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.25,1.35,8),mat);body.position.y=1.08;grp.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.24,8,8),mat);head.position.y=2.05;grp.add(head);
  const aL=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,1.05,6),mat);aL.position.set(-0.38,0.95,0);aL.rotation.z=0.2;grp.add(aL);
  const aR=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,1.05,6),mat);aR.position.set(0.38,0.95,0);aR.rotation.z=-0.2;grp.add(aR);
  const lL=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,1.05,6),mat);lL.position.set(-0.18,0.35,0);grp.add(lL);
  const lR=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,1.05,6),mat);lR.position.set(0.18,0.35,0);grp.add(lR);
  scene.add(grp);
  const tag=document.createElement('div');tag.className='nametag';tag.textContent=name;
  document.getElementById('nametags').appendChild(tag);
  remotePlayers[key]={grp,tag,name,color,aL,aR,lL,lR,animT:0,lastPos:new THREE.Vector3()};
  return remotePlayers[key];
}
function removeRemote(key){if(!remotePlayers[key])return;scene.remove(remotePlayers[key].grp);remotePlayers[key].tag.remove();delete remotePlayers[key];}
function updateNametagsDOM(){Object.values(remotePlayers).forEach(p=>{const pos=p.grp.position.clone();pos.y+=2.6;const v=pos.clone().project(camera);if(v.z>1){p.tag.style.display='none';return;}const sx=(v.x*0.5+0.5)*window.innerWidth;const sy=(-0.5*v.y+0.5)*window.innerHeight-10;p.tag.style.display='block';p.tag.style.left=sx+'px';p.tag.style.top=sy+'px';});}
function animateRemotePlayers(dt){Object.values(remotePlayers).forEach(p=>{const moved=p.grp.position.distanceTo(p.lastPos);p.lastPos.copy(p.grp.position);p.animT+=dt*(moved>0.01?8:2);p.lL.rotation.x=Math.sin(p.animT)*(moved>0.01?0.38:0.05);p.lR.rotation.x=-Math.sin(p.animT)*(moved>0.01?0.38:0.05);p.aL.rotation.x=Math.sin(p.animT)*(moved>0.01?0.25:0.03);p.aR.rotation.x=-Math.sin(p.animT)*(moved>0.01?0.25:0.03);p.grp.position.y=moved>0.01?Math.abs(Math.sin(p.animT))*0.05:0;});}

async function connectRoom(){
  roomRef=fbDB.ref('horror_rooms/'+G.roomCode);
  const myRef=roomRef.child('players/'+G.myId);
  myRef.set({name:G.myName,x:0,y:1.7,z:0,ry:0,t:Date.now(),online:true});
  myRef.onDisconnect().remove();
  roomRef.child('players').on('child_added',snap=>{if(snap.key===G.myId)return;const d=snap.val()||{};getOrCreateRemote(snap.key,d.name||'???');Chat.addMsg('','⟶ '+(d.name||'???')+' entrou na sala',true);updateOnlineList();});
  roomRef.child('players').on('child_changed',snap=>{if(snap.key===G.myId)return;const d=snap.val()||{},p=remotePlayers[snap.key];if(p){p.grp.position.set(d.x||0,d.y||0,d.z||0);p.grp.rotation.y=d.ry||0;}});
  roomRef.child('players').on('child_removed',snap=>{if(remotePlayers[snap.key])Chat.addMsg('','⟵ '+(remotePlayers[snap.key].name)+' saiu',true);removeRemote(snap.key);updateOnlineList();});
  roomRef.child('chat').limitToLast(1).on('child_added',snap=>{const d=snap.val();if(!d||d.name===G.myName)return;Chat.addMsg(d.name,d.text);});

}

// ════ CAR NEARBY PROMPT ════
function checkCarProximity(){
  if(G.inCar){document.getElementById('car-prompt').style.display='none';return;}
  if(G.inStartRoom){document.getElementById('car-prompt').style.display='none';return;}
  for(const car of cars){
    const d=camera.position.distanceTo(car.grp.position);
    if(d<4&&!car.occupied){
      const el=document.getElementById('car-prompt');
      el.style.display='block';el.textContent='[ E ] — ENTRAR NO CARRO';return;
    }
  }
  // Check window
  if(G.inStartRoom&&G.windowPos&&camera.position.distanceTo(G.windowPos)<1.8){
    const el=document.getElementById('car-prompt');
    el.style.display='block';el.textContent='[ E ] — PULAR PELA JANELA';return;
  }
  // Check puzzles
  if(G.inStartRoom){
    if(G.puzzle1Obj&&!G.puzzle1Solved&&camera.position.distanceTo(G.puzzle1Obj.position)<2.2){
      const el=document.getElementById('car-prompt');el.style.display='block';el.textContent='[ E ] — EXAMINAR CAIXA';return;
    }
    if(G.puzzle2Obj&&!G.puzzle2Solved&&camera.position.distanceTo(G.puzzle2Obj.position)<2.2){
      const el=document.getElementById('car-prompt');el.style.display='block';el.textContent='[ E ] — EXAMINAR CHAVE';return;
    }
    if(G.roomDoor&&G.roomDoor.userData.unlocked&&camera.position.distanceTo(new THREE.Vector3(0,1.7,4.5))<2.2){
      const el=document.getElementById('car-prompt');el.style.display='block';el.textContent='[ E ] — SAIR PELA PORTA';return;
    }
  }
  document.getElementById('car-prompt').style.display='none';
}

// ════ INTERACT ════
function interact(){
  if(activePuzzle){closePuzzle();return;}
  if(G.inCar){
    const car=G.drivingCar;
    G.inCar=false;G.drivingCar=null;car.occupied=false;car.headlightL.intensity=0;
    camera.position.set(car.grp.position.x+2,1.7,car.grp.position.z+2);
    document.getElementById('car-hud').style.display='none';
    document.getElementById('car-prompt').style.display='none';
    showMsg('SAIU DO CARRO');return;
  }
  // Window escape
  if(G.inStartRoom&&G.windowPos&&camera.position.distanceTo(G.windowPos)<2.0){
    tryEscapeWindow();return;
  }
  // Door exit
  if(G.inStartRoom&&G.roomDoor&&G.roomDoor.userData.unlocked&&camera.position.distanceTo(new THREE.Vector3(0,1.7,4.5))<2.5){
    G.inStartRoom=false;G.roomEscaped=true;
    camera.position.set(0,1.7,8);
    if(roomMonster)scene.remove(roomMonster.grp);
    document.getElementById('noise-meter').style.display='none';
    showMsg('VOCÊ ESCAPOU DO QUARTO!');
    setTimeout(()=>showMsg('ELE ESTÁ LÁ FORA. CUIDADO.'),2500);
    return;
  }
  // Puzzle 1
  if(G.inStartRoom&&G.puzzle1Obj&&!G.puzzle1Solved&&camera.position.distanceTo(G.puzzle1Obj.position)<2.5){
    openPuzzle1();return;
  }
  // Puzzle 2
  if(G.inStartRoom&&G.puzzle2Obj&&!G.puzzle2Solved&&camera.position.distanceTo(G.puzzle2Obj.position)<2.5){
    openPuzzle2();return;
  }
  // Car entry
  for(const car of cars){
    const d=camera.position.distanceTo(car.grp.position);
    if(d<3.5&&!car.occupied){
      car.occupied=true;G.inCar=true;G.drivingCar=car;
      document.getElementById('car-hud').style.display='flex';
      showMsg('DENTRO DO CARRO — WASD PARA DIRIGIR');
      car.items.forEach(item=>{
        if(!item.userData.collected&&new THREE.Vector3().copy(item.getWorldPosition(new THREE.Vector3())).distanceTo(camera.position)<4){
          item.userData.collected=true;item.visible=false;
          G.foundTapes++;
          document.getElementById('found-items').textContent='FITAS VHS: '+G.foundTapes+'/'+tapeObjects.length;
          document.getElementById('lore-label-txt').textContent=item.userData.type==='note'?'NOTA ENCONTRADA':'FITA VHS — ENCONTRADA';
          document.getElementById('lore-text').textContent=item.userData.lore;
          document.getElementById('lore-popup').style.display='flex';
          if(isLocked)document.exitPointerLock();
        }
      });
      return;
    }
  }
  // Ground tapes
  tapeObjects.forEach((t,i)=>{
    if(t.mesh.userData.collected)return;
    if(camera.position.distanceTo(t.mesh.position)<3){
      t.mesh.userData.collected=true;t.mesh.visible=false;t.gl.intensity=0;
      G.foundTapes++;
      document.getElementById('found-items').textContent='FITAS VHS: '+G.foundTapes+'/'+tapeObjects.length;
      document.getElementById('lore-label-txt').textContent='FITA VHS — ENCONTRADA';
      document.getElementById('lore-text').textContent=t.lore;
      document.getElementById('lore-popup').style.display='flex';
      if(isLocked)document.exitPointerLock();
      if(roomRef&&!G.solo)roomRef.child('events').push({player:G.myName,tape:i,t:Date.now()});
    }
  });
}

// ════ MAIN LOOP ════
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastT)*0.001,0.05);lastT=ts;
  const t=ts*0.001;
  if(G.running){
    if(G.inCar&&G.drivingCar){
      G.drivingCar.update(dt);
      camera.rotation.order='YXZ';
      camera.rotation.y=G.drivingCar.heading+Math.PI;
      camera.rotation.x=-0.05;
    } else {
      const running=keys['ShiftLeft']||keys['ShiftRight'];
      const spd=running?5.8:2.8;
      const mv=new THREE.Vector3();
      if(keys['KeyW'])mv.z=-1;
      if(keys['KeyS'])mv.z=1;
      if(keys['KeyA'])mv.x=-1;
      if(keys['KeyD'])mv.x=1;
      if(mv.lengthSq()>0){
        mv.normalize().applyEuler(new THREE.Euler(0,yaw,0));
        const nx=camera.position.x+mv.x*spd*dt;
        const nz=camera.position.z+mv.z*spd*dt;
        // Room collision
        if(G.inStartRoom){
          const okX=nx>ROOM_MIN_X&&nx<ROOM_MAX_X;
          const okZ=nz>ROOM_MIN_Z&&nz<ROOM_MAX_Z;
          // Allow exit via door if unlocked
          const nearDoor=Math.abs(nx)<1.4&&nz>4.5;
          const nearWindow=nx>4.2&&nz>-3&&nz<-1;
          if(okX)camera.position.x=nx;
          if(okZ||nearDoor||(nearWindow&&false))camera.position.z=nz;
          // Don't let player leave unless escaped
          if(!G.roomEscaped){
            if(nz>4.7&&!(G.roomDoor&&G.roomDoor.userData.unlocked&&Math.abs(nx)<1.4)){
              camera.position.z=4.5; // blocked by closed door
            }
            if(nx>4.7)camera.position.x=4.5; // blocked by wall (window is just visual)
          }
        } else {
          camera.position.x=Math.max(-440,Math.min(440,nx));
          camera.position.z=Math.max(-440,Math.min(440,nz));
        }
        // Noise from running
        if(running&&G.inStartRoom){G.noiseLevel=Math.min(1,G.noiseLevel+dt*0.4);}
        else if(G.inStartRoom&&mv.lengthSq()>0){G.noiseLevel=Math.min(1,G.noiseLevel+dt*0.04);}
      }
      const moving=mv.lengthSq()>0;
      camera.position.y=1.7+Math.sin(t*(running?12:6))*(moving?0.04:0);

      if(running&&moving){G.stamina-=dt*18;if(G.stamina<=0){G.stamina=0;keys['ShiftLeft']=false;keys['ShiftRight']=false;}}
      else G.stamina=Math.min(100,G.stamina+dt*9);
    }

    // Noise decay
    G.noiseLevel=Math.max(0,G.noiseLevel-dt*0.12);

    if(G.nearMonster)G.sanity-=dt*7;else G.sanity=Math.min(100,G.sanity+dt*1.8);

    // HUD
    document.getElementById('stam-fill').style.width=G.stamina+'%';
    document.getElementById('san-fill').style.width=G.sanity+'%';
    // Noise bar
    document.getElementById('noise-bar').style.width=(G.noiseLevel*100)+'%';
    document.getElementById('noise-bar').style.background=G.noiseLevel>0.6?'rgba(255,40,20,0.9)':G.noiseLevel>0.3?'rgba(255,150,30,0.8)':'rgba(255,80,30,0.6)';

    // Effects
    document.getElementById('noise-overlay').style.opacity=(1-G.sanity/100)*0.18;
    const ri=Math.max(0,1-G.monsterDist/20);
    document.getElementById('red-pulse').style.opacity=ri*0.7;
    document.getElementById('monster-ring').style.opacity=ri*0.5;

    // Room red light pulse
    if(G.roomRedLight&&G.inStartRoom){G.roomRedLight.intensity=0.3+Math.sin(t*2.2)*0.15*(G.monsterPreparedness+0.2);}

    // Flashlight
    if(flashlightOn&&G.monsterDist<18){flashlight.intensity=4.5-Math.sin(t*18)*0.8*(1-G.monsterDist/18);}
    else if(flashlightOn&&!G.inCar){flashlight.intensity=4.5;}

    // Street lamp flicker
    streetLamps.forEach(l=>{l.t+=dt;const f=Math.sin(l.t*6.5)*0.06+Math.sin(l.t*22.3)*0.04;l.light.intensity=l.base+f;if(Math.random()<0.0006)l.light.intensity=0;});

    // Monsters
    if(roomMonster&&G.inStartRoom)roomMonster.update(dt,camera.position,G.noiseLevel);
    if(monster)monster.update(dt,camera.position);

    // Tapes spin
    tapeObjects.forEach(tp=>{if(!tp.mesh.userData.collected)tp.mesh.rotation.y+=dt*2.2;});

    // Remote
    animateRemotePlayers(dt);
    updateNametagsDOM();
    checkCarProximity();

    // Firebase sync
    posTimer+=dt;
    if(posTimer>0.1&&roomRef&&!G.solo){
      posTimer=0;
      roomRef.child('players/'+G.myId).update({x:+(camera.position.x.toFixed(2)),y:+(camera.position.y.toFixed(2)),z:+(camera.position.z.toFixed(2)),ry:+(yaw.toFixed(2)),t:Date.now()});
    }
  }
  drawRain();
  renderer.render(scene,camera);
}

function showEnding(){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:#000;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-family:Courier New,monospace;color:#fff;padding:60px';
  o.innerHTML='<p style="font-size:clamp(13px,2vw,17px);letter-spacing:2px;color:rgba(255,255,255,0.5);text-align:center;line-height:2.8;max-width:560px;font-style:italic">"Eu tentei mostrar pra todos..."<br>"Mas ninguém queria enxergar..."<br>"Pra eles eu era louco..."<br>"Pra mim... isso era normal..."</p><div style="width:60px;height:1px;background:rgba(255,255,255,0.15)"></div><p style="font-size:10px;letter-spacing:7px;color:rgba(255,255,255,0.25)">A HISTÓRIA NUNCA TERMINOU.</p><button onclick="location.reload()" style="background:transparent;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.35);font-family:Courier New;font-size:10px;letter-spacing:4px;padding:12px 28px;cursor:pointer;margin-top:16px">JOGAR NOVAMENTE</button>';
